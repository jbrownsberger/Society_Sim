    const securityBufferTarget = fullBufferUnits * securityGap;

    const base = Math.max(dailyBase, securityBufferTarget);
    return base + specUnits;
  }

  if (good === 'wood') {
    // Working stock for bakers and toolmakers; warmth buffer for everyone
    const workBuffer  = PROFESSIONS[prof]?.inputs?.wood ? (PROFESSIONS[prof].inputs.wood * 3) : 0;
    const warmthBuffer = 1;
    const base = Math.max(workBuffer, warmthBuffer);
    return base + specUnits;
  }

  if (good === 'luxury') {
    // Comfort stock: keep ~1 unit on hand to consume day-to-day, same
    // pattern as bread for food -- BUT only when comfort is actually the
    // better use of that unit right now. Comfort is a discretionary need
    // (NEEDS.comfort.critical === false), so shouldKeepForConsumption
    // compares its use-value against selling it, and selling already
    // reflects an elevated lambda when a CRITICAL need like food is in
    // crisis. This is what stops a starving artisan from reserving fine
    // goods for their own comfort instead of selling them for food money
    // — without a special-cased "unless starving" branch here.
    const base = shouldKeepForConsumption(npc, 'luxury') ? 1 : 0;
    return base + specUnits;
  }

  if (good === 'tools') {
    if (PROFESSIONS[prof]?.capitalGood === 'tools') return 2;
    if (prof === 'toolmaker') return 1;
    return 0;
  }

  return 0;
}

// ─────────────────────────────────────────────
// DAILY SCHEDULE BUILDER — TWO-PASS
// ─────────────────────────────────────────────
//
// Pass 1: Decide whether (and how many times) to work.
//   workSessionEV gives the net utility of one full work session,
//   including the cost of buying any missing inputs. If positive,
//   the NPC commits to working. A second session is added only if
//   the first leaves enough energy and time, and EV is still positive.
//   Input purchases required by committed work sessions are scheduled
//   at market price (no productive shadow price — that value already
//   appears in the work EV). This eliminates the double-count that
//   caused buy-inputs to crowd out work.
//
// Pass 2: Fill remaining time by scoring all other actions
//   (sell surplus, buy food/wood, rest, socialise) purely on
//   consumption/leisure value. No productive shadow prices here.
//
// Incentive sensitivity:
//   • High output price  → workSessionEV rises → more work sessions
//   • Low output price   → workSessionEV falls → NPC rests / socialises
//   • High savings + fed → lambda low → leisure scores higher relative
//     to work → voluntary shorter workday
//   • Starvation / broke → lambda high → even marginal work is worth it

// ─────────────────────────────────────────────
// WEEKLY PLANNER
// ─────────────────────────────────────────────
//
// Scheduling over scoring: each NPC commits to a 7-day schedule at once
// (matching a real household's weekly rhythm — you don't re-decide "should
// I go to work" from first principles every single morning), rather than
// building one day at a time from a stateless daily snapshot. The
// exception is a genuine crisis: any need breaching its starvationFloor
// (see emergencyReplanNeeded) tears up the rest of the week and replans
// immediately, rather than waiting for the next scheduled planning day.
//
// Each simulated day is built by a genuine SINGLE PASS (buildDayCandidates
// + allocateDay): every candidate action — work, hired labor, market,
// church, asset sale/delist, tinker, rest, socialize — is scored exactly
// once from one snapshot of state via the same scoreAction used
// throughout this file, sorted once, and allocated in one linear walk.
// Nothing gets re-scored after an earlier pick changes the state within a
// day. This was a deliberate choice over an iterative re-scoring loop:
// with re-scoring, small flat need bonuses (like socializing) could get
// picked repeatedly and compound into a free substitute for real
// consumption or productive work, which masked rather than exposed any
// underlying mistuning. With a single pass, if rest or socializing
// outscores work, that's a direct, visible signal that something in the
// value chain — energy shadow price, labor disutility, output prices,
// lambda — is genuinely out of tune, not an artifact of the scheduling
// algorithm itself.
//
// getAvailableActions and scoreAction remain the only two places that
// know about specific actions/needs; the planner itself never changes
// when a new need or action is added.
//
// Because real execution (executeSchedule, runMarketExchange, satisfyNeeds,
// collectTithes, etc.) is untouched and still runs once per REAL day
// against the REAL npc and REAL market, planning ahead is purely a
// forecast: it runs against a lightweight cloned NPC state so speculative
// "what happens if I do X, then Y" reasoning never touches live state
// until that day actually arrives.

const PLANNING_HORIZON_DAYS = 7;
const DAILY_HOURS = 14;

// How much of a score boost repeating last cycle's choice for this same
// day-slot gets (see buildDayCandidates' habit-continuity block below).
// 0.20 means a habitual choice needs to be beaten by more than ~20% to
// get displaced — enough to damp weekly thrashing between near-tied
// options without ever overriding a genuinely better opportunity or a
// real emergency.
const HABIT_CONTINUITY_BONUS = 0.20;

// A minimal, mutable stand-in for an NPC used only for forward simulation
// during planning. Shares the exact field shape real NPCs have, so every

// existing helper (lambda, shadowPriceGood, profSessionEV, planMarketVisit,
// etc.) works on it completely unmodified — versatility via duck-typing,
// not a parallel API.
function cloneNpcForPlanning(npc) {
  return {
    id: npc.id, name: npc.name, profession: npc.profession,
    trainingProfession: npc.trainingProfession, trainingDaysLeft: npc.trainingDaysLeft,
    ownedAssets: npc.ownedAssets.slice(), primaryAsset: npc.primaryAsset, primaryHouse: npc.primaryHouse,
    spouseId: npc.spouseId, childIds: npc.childIds.slice(), lastChildbirthDay: npc.lastChildbirthDay,
    age: npc.age,
    energy: npc.energy, savings: npc.savings, capital: npc.capital,
    inventory: { ...npc.inventory },
    needs: { ...npc.needs },
    traits: npc.traits,
    skills: { ...npc.skills },
    memory: npc.memory, // read-only during planning; never written here
    relations: npc.relations, // read-only during planning (see getAffinity/ask_help/help candidate generation) — never mutated via bumpAffinity during lookahead, only at real executeSchedule time, so sharing the live Map is safe and avoids a per-clone copy of a structure that can be large.
    // Without this, planConstructionAction(sim) always sees !proj and
    // returns null — 'build' would never even become a candidate during
    // real weekly planning, no matter how well it scores. Found exactly
    // this way: scoring 'build' directly against the real NPC showed it
    // winning decisively (score far above every other candidate), but
    // real construction progress stayed at 0 for hundreds of days,
    // because the actual planning pass never ran against a clone that
    // had this field at all.
    constructionProject: npc.constructionProject ? { ...npc.constructionProject } : null,
    schedule: [], scheduleIdx: 0, currentAction: 'idle',
  };
}

// Approximates one action's effect on a simulated (cloned) NPC, so the
// NEXT simulated day plans against a realistically progressed state. This
// mirrors what executeSchedule does for real, minus anything that mutates
// shared/global state (market prices, asset ownership, church cash) — those
// only happen for real, once, on the day they actually occur.
function applySimEffects(sim, action) {
  if (action.goodsConsumed) {
    for (const [g, q] of Object.entries(action.goodsConsumed)) {
      sim.inventory[g] = Math.max(0, (sim.inventory[g] ?? 0) - q);
    }
  }
  if (action.goodsProduced) {
    for (const [g, q] of Object.entries(action.goodsProduced)) {
      sim.inventory[g] = (sim.inventory[g] ?? 0) + q;
    }
  }
  if (action.id === 'hired-labor' && action.wage) sim.savings += action.wage;
  if (action.moneyEarned) sim.savings += action.moneyEarned;
  if (action.moneyCost)   sim.savings -= action.moneyCost;
  if (action.energyCost)     sim.energy = Math.max(0, sim.energy - action.energyCost);
  if (action.energyRestored) sim.energy = Math.min(100, sim.energy + action.energyRestored);
  if (action.needEffects) {
    for (const [need, amount] of Object.entries(action.needEffects)) {
      sim.needs[need] = Math.min(1, (sim.needs[need] ?? 0) + amount);
    }
  }
  if (action.id === 'tinker' && action.profId) {
    const current = sim.skills[action.profId] ?? 0;
    if (current < TINKER_SKILL_CEILING) {
      sim.skills[action.profId] = Math.min(TINKER_SKILL_CEILING, current + action._skillGainFrac);
    }
  }
  if (action.id === 'build' && sim.constructionProject) {
    // Mirrors the real completion check in executeSchedule (see
    // completeConstruction) but only for the SIMULATED clone's bookkeeping
    // — completing a project for real (creating the asset, assigning
    // ownership/profession) only ever happens once, on the real day it
    // actually occurs, in executeSchedule. Here we just need
    // hoursRemaining to be accurate for days 2-7 of the same weekly plan,
    // so a project doesn't look perpetually fresh to every day of the
    // week it's being worked on.
    sim.constructionProject.laborHoursDone += action.duration;
    if (sim.constructionProject.laborHoursDone >= sim.constructionProject.laborHoursNeeded - 0.01) {
      sim.constructionProject = null;
    }
  }
}

// ─────────────────────────────────────────────
// SINGLE-PASS DAY SCHEDULER
// ─────────────────────────────────────────────
//
// One candidate list, scored once, sorted once, allocated in one linear
// walk. No action gets re-scored after an earlier pick changes the state,
// and no action type is hand-exempted from anything. This matters for two
// reasons:
//   1. It's the honest test of the utility model. If rest ever outscores
//      productive work in the sorted list, that's a real signal that
//      something in the value chain (energy shadow price, labor
//      disutility, output prices, lambda) is out of tune — not an
//      artifact of an iterative loop compounding small bonuses. An
//      iterative re-scoring loop can hide that kind of miscalibration
//      behind its own dynamics; a single pass can't.
//   2. Work now competes on EXACTLY the same footing as everything else:
//      it's just another candidate built from goodsProduced/goodsConsumed/
//      energyCost/isLabor and scored by the same scoreAction used for
//      market visits, church, rest, everything. Previously work's value
//      was computed by a separate function (profSessionEV) using raw
//      market prices for its inputs/outputs, while every other action
//      priced goods through shadowPriceGood (which also reflects
//      use-value, not just sale price). That inconsistency is gone.
function buildDayCandidates(npc, priorDayActions = []) {
  const WORK_DURATION = 6;
  const candidates = [];

  // ── Self-employment work block(s) ────────────────────────────────────
  // workSessionEV still decides WHICH profession to work as today
  // (primary, or a no-input fallback if primary's inputs are unaffordable)
  // — that sub-choice isn't part of the time-allocation question this
  // scheduler answers, it's a separate "what am I capable of doing right
  // now" lookup, same role as bestWageOffer() below.
  const { ev, workAs } = workSessionEV(npc);
  if (workAs && isFinite(ev)) {
    const workProf = PROFESSIONS[workAs];
    const skill    = effectiveSkill(npc, workAs);
    const capMod   = workProf.capitalGood ? (1 + Math.log1p(npc.inventory.tools ?? 0) * 0.2) : 1;
    const buildMod = buildingProductivity(workAs);
    const seasonal = workAs === 'farmer' ? (SEASONAL_GRAIN[world.season] || 1) : 1;
    const workLabel = workAs === npc.profession ? `Work (${workProf.name})` : `Casual labour (${workProf.name})`;

    // Up to two blocks/day, exactly as before. Both are scored ONCE from
    // the current snapshot — block 2 simply assumes the fatigue a first
    // block would already have cost (npc.energy - 25), which is a
    // legitimate part of scoring it upfront, not a re-score triggered by
    // block 1 actually being picked. requires/group let the single
    // allocation pass below enforce "block 2 only after block 1" and
    // "self-work and hired-labor can't both happen the same day" with
    // simple bookkeeping instead of sequential re-evaluation.
    const blockDefs = [
      { energyBefore: npc.energy,      group: 'primary-labor',   requires: null },
      { energyBefore: npc.energy - 25, group: 'primary-labor-2', requires: 'primary-labor' },
    ];
    for (const b of blockDefs) {
      if (b.energyBefore < 30) continue;
      const energyMod = b.energyBefore / 100;
      const goodsConsumed = {}, goodsProduced = {};
      let inputsOk = true;
      for (const [g, qty] of Object.entries(workProf.inputs)) {
        goodsConsumed[g] = qty;
        // Block 2 must be able to afford a SECOND round of inputs, net of
        // what block 1 would already have drawn from inventory.
        if (b.requires) {
          const haveAfterFirst = Math.max(0, (npc.inventory[g] ?? 0) - qty);
          if (haveAfterFirst < qty && npc.savings < expectedPrice(npc, g) * qty) { inputsOk = false; break; }
        }
      }
      if (!inputsOk) continue;
      for (const [g, qty] of Object.entries(workProf.outputs)) {
        goodsProduced[g] = qty * skill * capMod * buildMod * energyMod * seasonal;
      }
      const action = {
        id: 'work', label: workLabel, duration: WORK_DURATION, isLabor: true,
        energyCost: 25, goodsProduced, goodsConsumed,
        _group: b.group, _requires: b.requires,
      };
      candidates.push({ ...action, score: scoreAction(action, npc) });
    }
  }

  // ── Hired labor ───────────────────────────────────────────────────────
  // Occupies the same time slot as self-employment block 1 (same
  // 'primary-labor' group), so the allocator's group exclusion — not a
  // hand-written if/else comparison — decides which one wins, purely by
  // score. Goods produced accrue to the EMPLOYER (see executeSchedule),
  // so only the wage is scored here, not the goods.
  const wageOffer = bestWageOffer(npc);
  if (wageOffer) {
    const employer = world.npcs.get(wageOffer.employerId);
    const laborProf = PROFESSIONS[wageOffer.profId];
    const skill = effectiveSkill(npc, wageOffer.profId);
    const buildMod = buildingProductivity(wageOffer.profId);
    const seasonal = wageOffer.profId === 'farmer' ? (SEASONAL_GRAIN[world.season] || 1) : 1;
    const energyMod = npc.energy / 100;
    const goodsProduced = {};
    for (const [g, qty] of Object.entries(laborProf.outputs)) {
      goodsProduced[g] = qty * skill * buildMod * energyMod * seasonal;
    }
    // Inputs are the EMPLOYER's to supply (they own the output) — see
    // executeSchedule, which gates/scales this by the employer's actual
    // inventory the same way self-employed work is now gated. Previously
    // hired-labor output had NO input handling at all: an employer could
    // hire a miller and receive full bread output with zero grain ever
    // deducted from anywhere — a pure conservation violation, worse than
    // the self-employed version of the same bug.
    const goodsConsumed = {};
    for (const [g, qty] of Object.entries(laborProf.inputs)) {
      goodsConsumed[g] = qty;
    }
    const action = {
      id: 'hired-labor', label: `Hired labor (${laborProf.name}${employer ? ' for ' + employer.name : ''})`,
      duration: WORK_DURATION, isLabor: true, energyCost: 25,
      wage: wageOffer.wage, employerId: wageOffer.employerId, assetId: wageOffer.assetId,
      moneyEarned: wageOffer.wage, goodsConsumed,
      _group: 'primary-labor', _requires: null, _wageOfferRef: wageOffer,
    };
    // Score without goodsProduced (this NPC never receives them) but keep
    // it on the stored action so execution can still credit the employer.
    const scoringAction = { ...action };
    delete scoringAction.goodsProduced;
    candidates.push({ ...action, goodsProduced, score: scoreAction(scoringAction, npc) });
  }

  // ── Everything else: market, church, asset sale/delist, tinker, build,
  // rest, socialize ── unchanged, already generic via getAvailableActions.
  for (const a of getAvailableActions(npc)) {
    candidates.push({ ...a, score: scoreAction(a, npc) });
  }

  // ── Habit continuity ────────────────────────────────────────────────
  // Real people don't re-derive their whole week from first principles
  // every planning cycle — they adjust marginal habits and keep most of
  // their routine steady. A modest proportional boost for repeating
  // whatever this NPC did in the SAME day-of-week slot last cycle acts as
  // a switching cost: strong enough to prevent thrashing between two
  // near-equally-scored alternatives purely from small week-to-week
  // price/need noise, but a genuinely better opportunity — or a real
  // emergency, which forces an immediate out-of-cycle replan anyway (see
  // emergencyReplanNeeded) — still clears it easily. Multiplicative
  // rather than additive so it scales sensibly across the huge range of
  // magnitudes different action types score at (a market trip
  // liquidating a big surplus can score 100x a rest action) without
  // needing a separately-tuned constant per action type. It also does
  // nothing harmful to a habit that's gone bad: multiplying an
  // already-negative score by (1 + bonus) makes it MORE negative,
  // correctly abandoning a habit the world has genuinely turned against
  // rather than clinging to it.
  if (priorDayActions.length > 0) {
    const priorKeys = new Set(priorDayActions.map(a => a.id + '|' + (a._group || '')));
    for (const c of candidates) {
      const key = c.id + '|' + (c._group || '');
      if (priorKeys.has(key)) c.score *= (1 + HABIT_CONTINUITY_BONUS);
    }
  }

  return candidates;
}

// Allocates one day from a candidate list that's already fully scored —
// sort once, walk once. chosenGroups/_requires handle the only two real
// constraints that survive from the old two-pass split (self-work vs
// hired-labor are mutually exclusive; work block 2 needs block 1 first);
// everything else (market/church/tinker/asset-sale/rest/socialize) is
// naturally one-per-day simply because each appears exactly once in the
// candidate list to begin with — there's no separate "one-shot" rule to
// maintain anymore.
function allocateDay(candidates, hoursAvailable) {
  const sorted = [...candidates].sort((a, b) => b.score - a.score);
  const daySchedule = [];
  const chosenGroups = new Set();
  let timeLeft = hoursAvailable;

  for (const c of sorted) {
    if (timeLeft <= 0.25) break;
    if (c.score < -1 && c.id !== 'rest') continue;
    if (c._group) {
      if (chosenGroups.has(c._group)) continue;
      if (c._requires && !chosenGroups.has(c._requires)) continue;
    }

    const dur = Math.min(c.duration, timeLeft);
    daySchedule.push({ ...c, duration: dur });
    timeLeft -= dur;
    if (c._group) chosenGroups.add(c._group);
    if (dur < c.duration - 0.01) break; // partial slot used — stop rather than fragmenting further
  }

  if (timeLeft > 0.5) {
    daySchedule.push({ id: 'rest', label: 'Rest', duration: timeLeft, energyRestored: timeLeft * 12, needEffects: {} });
  }
  return daySchedule;
}

// Builds a full PLANNING_HORIZON_DAYS-day schedule: one single-pass
// allocation per simulated day, against a cloned, forward-advancing NPC
// state. Only day 0 touches real, live labor-market contention (wage
// slots); every later day forecasts using today's snapshot of prices/
// wages, same convention as every other forecast in this file — actual
// quantities/prices still resolve live, day by day, in executeSchedule/
// runMarketExchange when each day for real arrives.
function planWeek(npc) {
  const sim = cloneNpcForPlanning(npc);
  const weekPlan = [];
  // Captured once, up front: npc.weekPlan still holds the PRIOR plan at
  // this point (we haven't overwritten it yet) — comparing new-plan day d
  // against old-plan day d is exactly "same slot in the weekly routine,"
  // since replanning happens on a consistent 7-day cadence per NPC in the
  // normal (non-emergency) case. See buildDayCandidates' habit-continuity
  // block for what this is used for.
  const priorWeekPlan = npc.weekPlan || [];

  for (let d = 0; d < PLANNING_HORIZON_DAYS; d++) {
    const candidates = buildDayCandidates(sim, priorWeekPlan[d] || []);
    const daySchedule = allocateDay(candidates, DAILY_HOURS);

    if (d === 0) {
      const hiredEntry = daySchedule.find(a => a.id === 'hired-labor');
      if (hiredEntry && hiredEntry._wageOfferRef) hiredEntry._wageOfferRef.slotsRemaining -= 1;
    }

    for (const entry of daySchedule) applySimEffects(sim, entry);
    weekPlan.push(daySchedule);

    // Advance the simulated NPC through this day's consumption/decay
    // (reuses satisfyNeeds exactly as real execution does) so day d+1 is
    // planned against a realistically progressed NPC, not a frozen
    // snapshot of today.
    sim.schedule = daySchedule;
    satisfyNeeds(sim);
  }

  npc.weekPlan = weekPlan;
}

// Entry point called once per real day per NPC (see tickDay). Decides
// whether a fresh week needs planning — on this NPC's own staggered
// weekly cadence (npc.planOffset spreads the village's planning days out
// across the week instead of everyone replanning in lockstep), or
// immediately on emergency — then hands today's slice of the current plan
// to npc.schedule for execution, unchanged from how execution always
// worked.
function buildSchedule(npc) {
  const needsReplan =
    !npc.weekPlan || npc.weekPlan.length === 0 ||
    npc.weekPlanDay >= npc.weekPlan.length ||
    (world.day + npc.planOffset) % PLANNING_HORIZON_DAYS === 0 ||
    emergencyReplanNeeded(npc);

  if (needsReplan) {
    planWeek(npc);
    npc.weekPlanDay = 0;
  }

  const dayIdx = Math.min(npc.weekPlanDay, npc.weekPlan.length - 1);
  npc.schedule = npc.weekPlan[dayIdx] ?? [];
  npc.weekPlanDay = dayIdx + 1;
  npc.scheduleIdx = 0;
  npc.currentAction = npc.schedule[0]?.id ?? 'idle';
}

// ─────────────────────────────────────────────
// ACTION EXECUTION
// ─────────────────────────────────────────────

function executeSchedule(npc) {
  // Money and goods exchange happens exclusively in runMarketExchange (which runs
  // before this in the tick). Schedule actions handle only:
  //   - work: produce goods from inventory inputs
  //   - energy costs/restoration
  //   - need effects (socialise, rest)
  //   - asset-sale listing / tinkering skill gain (new, Stage 1.5)
  // Buy/sell schedule entries are time-budget placeholders; they carry no
  // moneyCost/moneyEarned here — those flows belong to runMarketExchange.
  for (const action of npc.schedule) {
    // Work actions: consume inputs from inventory, produce outputs into
    // inventory — scaled by how much of the required input was ACTUALLY
    // on hand. This used to clamp consumption at zero but still credit
    // the FULL output regardless — a real conservation violation: a
    // miller with zero grain in inventory still produced a full 12 bread
    // "for free." Verified via harness trace: millers routinely showed
    // inventory.grain === 0 while still scheduled 'work', decoupling
    // bread production from actual grain scarcity — grain then had no
    // real derived demand pulling its price up (unmetDemand sat at 0
    // with a 531-unit glut) even while genuinely scarce, which is
    // directly why farming kept losing to woodcutting in EV terms. A
    // no-input profession (farmer, woodcutter) is unaffected — fillRatio
    // only activates when goodsConsumed has actual entries.
    if (action.id === 'work') {
      let fillRatio = 1;
      if (action.goodsConsumed) {
        for (const [g, q] of Object.entries(action.goodsConsumed)) {
          if (q > 0) fillRatio = Math.min(fillRatio, (npc.inventory[g] ?? 0) / q);
        }
      }
      fillRatio = clamp(fillRatio, 0, 1);
      if (action.goodsConsumed) {
        for (const [g,q] of Object.entries(action.goodsConsumed)) {
          npc.inventory[g] = Math.max(0, (npc.inventory[g]??0) - q * fillRatio);
        }
      }
      if (action.goodsProduced) {
        for (const [g,q] of Object.entries(action.goodsProduced)) {
          npc.inventory[g] = (npc.inventory[g]??0) + q * fillRatio;
        }
      }
    }

    // Hired labor: goods produced go to the EMPLOYER's inventory (they
    // own the asset and its output, same as any real employment
    // relationship) — NOT the laborer's. The employer pays the wage in
    // cash right now, out of pocket, regardless of whether they've sold
    // that output yet; this is the real short-term cash outlay every
    // capital owner takes on when hiring, and it's what makes wages a
    // genuine budget constraint rather than free money conjured on paper.
    if (action.id === 'hired-labor') {
      const employer = world.npcs.get(action.employerId);
      if (employer) {
        let fillRatio = 1;
        if (action.goodsConsumed) {
          for (const [g, q] of Object.entries(action.goodsConsumed)) {
            if (q > 0) fillRatio = Math.min(fillRatio, (employer.inventory[g] ?? 0) / q);
          }
          fillRatio = clamp(fillRatio, 0, 1);
          for (const [g, q] of Object.entries(action.goodsConsumed)) {
            employer.inventory[g] = Math.max(0, (employer.inventory[g] ?? 0) - q * fillRatio);
          }
        }
        if (action.goodsProduced) {
          for (const [g,q] of Object.entries(action.goodsProduced)) {
            employer.inventory[g] = (employer.inventory[g] ?? 0) + q * fillRatio;
          }
        }
        const wagePaid = Math.min(action.wage, employer.savings);
        employer.savings -= wagePaid;
        npc.savings += wagePaid;
        const asset = world.assets.get(action.assetId);
        if (asset) {
          asset.employedLaborIds = asset.employedLaborIds || [];
          if (!asset.employedLaborIds.includes(npc.id)) asset.employedLaborIds.push(npc.id);
        }
      }
    }

    // Asset sale listing: flag the asset for the next auction cycle. No
    // immediate money changes hands — that happens at auction settlement
    // (a later stage). Chosen because scoreAction rated selling above
    // holding, per planAssetSaleActions.
    if (action.id === 'list-asset-sale') {
      const asset = world.assets.get(action.assetId);
      if (asset && asset.ownerId === npc.id) {
        asset.forSale = true;
        // FIX: listing an asset for sale used to immediately zero out
        // primaryAsset, treating the owner as asset-less from that
        // instant — even though nobody has bought it yet. That meant a
        // starving owner fell into woodcutting the moment they even
        // LISTED their mill, not when it actually sold, needlessly
        // accelerating exactly the collapse this mechanic was meant to
        // be a last resort against. An owner now keeps working their
        // asset for as long as it remains unsold — being listed and
        // being operated are no longer mutually exclusive. primaryAsset
        // is only cleared for real at the point of sale (see
        // runAssetAuctions), when someone actually buys it out from
        // under them.
        if (npc.primaryAsset === asset.id) {
          logEvent(`${npc.name}, struggling, listed their ${ASSET_TYPES[asset.type].name.toLowerCase()} for sale as a last resort (still working it while it's on the market).`, [npc.id]);
        }
      }
    }

    // NEW: delisting — if an owner's circumstances improve (asset starts
    // paying off again, starvingStreak resets), they should be able to
    // take it back off the market rather than being stuck waiting for an
    // auction they no longer want to go through with. See
    // planAssetSaleActions for when this is offered.
    if (action.id === 'delist-asset-sale') {
      const asset = world.assets.get(action.assetId);
      if (asset && asset.ownerId === npc.id) {
        asset.forSale = false;
        asset.auctionAttempts = 0;
        logEvent(`${npc.name} took their ${ASSET_TYPES[asset.type].name.toLowerCase()} off the market.`, [npc.id]);
      }
    }

    // Construction: actual scheduled, executed labor advances the
    // project — not a calendar countdown (see startConstruction/
    // completeConstruction). If the NPC's circumstances changed enough
    // that scoreAction stopped offering 'build' (e.g. they're mid-crisis
    // and never got scheduled for it this cycle), the project simply sits
    // exactly where it was — nothing decays, nothing is lost, it just
    // waits for labor the same way an unbuilt farm should.
    if (action.id === 'build' && npc.constructionProject) {
      npc.constructionProject.laborHoursDone += action.duration;
      if (npc.constructionProject.laborHoursDone >= npc.constructionProject.laborHoursNeeded - 0.01) {
        completeConstruction(npc);
      }
    }

    // Tinkering: slow, unguided skill gain toward TINKER_SKILL_CEILING.
    // Applied directly here rather than through the goods/money system,
    // since the "output" of tinkering is embodied skill, not inventory.
    if (action.id === 'tinker' && action.profId) {
      const current = npc.skills[action.profId] ?? 0;
      if (current < TINKER_SKILL_CEILING) {
        npc.skills[action.profId] = Math.min(TINKER_SKILL_CEILING, current + action._skillGainFrac);
      }
    }

    // Marriage: executing 'seek_marriage' just enters today's matching
    // pool (see runMarriageMarket, which runs once after every NPC's
    // schedule has executed) — consent isn't decided by one side alone.
    if (action.id === 'seek_marriage') {
      npc._seekingMarriageToday = true;
    }

    // Childbirth: re-validated at execution time (see attemptChildbirth)
    // since a day can pass between scoring and execution.
    if (action.id === 'seek_child') {
      attemptChildbirth(npc);
    }

    // Ask for help: post a targeted request. Resolution is genuinely
    // deferred — the target sees this as a candidate 'help' action next
    // time THEIR schedule is built and decides with their own real state
    // at that time, not a state snapshot from today (see design notes:
    // predictions are honest guesses, not oracles).
    if (action.id === 'ask_help') {
      world.helpRequests.push({
        requesterId: npc.id, targetId: action.targetId,
        amount: action.requestedAmount, day: world.day, resolved: false,
      });
    }

    // Help: granted for real right now, against the giver's ACTUAL
    // current savings (which may have moved since this was scored) —
    // scales down rather than granting more than they actually have.
    if (action.id === 'help' && action.requestId && !action.requestId.resolved) {
      const req = action.requestId;
      const requester = world.npcs.get(req.requesterId);
      if (requester) {
        const actualAmount = Math.min(req.amount, Math.max(0, npc.savings));
        if (actualAmount > 0.1) {
          npc.savings -= actualAmount;
          requester.savings += actualAmount;
          // Gratitude toward the giver (large — proportional to how much
          // it mattered) and a smaller trickle the other way (giving
          // reinforces the giver's own attachment too).
          bumpAffinity(requester, npc.id, 0.15);
          bumpAffinity(npc, req.requesterId, 0.04);
          logEvent(`${npc.name} helped ${requester.name} in their time of need.`, [npc.id, requester.id]);
        }
      }
      req.resolved = true;
    }

    // Energy and needs — all actions
    if (action.energyCost)     npc.energy = Math.max(0, npc.energy - action.energyCost);
    if (action.energyRestored) npc.energy = Math.min(100, npc.energy + action.energyRestored);
    if (action.needEffects) {
      for (const [need, amount] of Object.entries(action.needEffects)) {
        // comfort/social are now composites of an activity/material
        // channel plus a family channel (see satisfyNeeds) — action
        // effects feed the channel, not the composite need directly, or
        // the composite would get overwritten wholesale next tick.
        if (need === 'comfort') { npc.materialComfort = Math.min(1, (npc.materialComfort ?? 0) + amount); continue; }
        if (need === 'social')  { npc.activitySocial  = Math.min(1, (npc.activitySocial  ?? 0) + amount); continue; }
        npc.needs[need] = Math.min(1, (npc.needs[need]??0) + amount);
      }
    }
  }
}

// ─────────────────────────────────────────────
// NEED SATISFACTION
// ─────────────────────────────────────────────

// How much EXTRA food (in the same raw inventory units as foodTarget/
// dailyBase) this NPC needs to buy/buffer for, beyond their own personal
// consumption, because children draw directly from a parent's inventory
// (see tickChildren) rather than having any food supply of their own.
// Without this, a parent's buying/buffering behavior stayed sized for
// ONE person even after having kids, so each child silently accelerated
// how fast the household ran out — a real, confirmed contributor to the
// starvation-driven population collapse (a parent kept buying like a
// single adult while feeding 2-4 extra mouths from the same larder).
// Both parents scale up independently (tickChildren can draw from
// either, depending on which one has stock on a given day) rather than
// splitting the total — mild double-buying is possible, but that's
// self-correcting via bread's spoilage rate, unlike running out, which
// isn't.
function householdFoodUnits(npc) {
  return npc.childIds ? npc.childIds.length * CHILD_FOOD_COST_PER_DAY : 0;
}

function satisfyNeeds(npc) {
  // Food from inventory — prefer bread, then grain only if surplus.
  // Millers and toolmakers protect their work inputs: they won't eat
  // grain they need for milling (above the work buffer), so production
  // inputs don't silently vanish overnight.
  let foodTarget = 2 + householdFoodUnits(npc);
  let fed = 0;

  for (const good of ['bread','grain']) {
    if (fed >= foodTarget) break;
    let have = npc.inventory[good] ?? 0;
    // For goods used as work inputs, only eat the surplus above the buffer
    const workBuffer = PROFESSIONS[npc.profession]?.inputs?.[good] ?? 0;
    const protectedQty = workBuffer > 0 ? Math.max(0, have - workBuffer * 2) : have;
    const consume = Math.min(protectedQty, foodTarget - fed);
    if (consume > 0.01) {
      npc.inventory[good] -= consume;
      fed += consume * GOODS[good].nutrition;
    }
  }

  // foodRatio: 1.0 means the NPC ate their full daily target (2 units × 0.4 nutrition = 0.8 nutrition).
  // Previously divided by foodTarget*0.4, letting NPCs hit "full" at 40% of actual intake,
  // which muted hunger signals and under-drove food demand. Now uses the real target.
  const foodRatio = Math.min(fed / (foodTarget * GOODS.bread.nutrition), 1);
  npc.needs.food = clamp(npc.needs.food + (foodRatio - 0.5) * 0.15, 0, 1);

  // Security from savings, OR from holding several days of bread in
  // reserve — a full larder is its own kind of security, independent of
  // cash on hand. Combined via max(): either is sufficient on its own,
  // matching how a subsistence household actually thinks about this (a
  // broke NPC sitting on a well-stocked larder isn't nearly as insecure
  // as their bank balance alone would suggest). See BUFFER_STOCK_EFFECTS/
  // bufferStockRatio and its mirror use in getBufferTarget, which is what
  // makes NPCs actually pursue this buffer rather than just passively
  // benefiting on the rare day they happen to have one.
  const savingsSecRatio = Math.min(npc.savings / 30, 1);
  const breadSecRatio = bufferStockRatio(npc, 'bread');
  const secRatio = Math.max(savingsSecRatio, breadSecRatio);
  npc.needs.security = clamp(npc.needs.security + (secRatio - 0.5) * 0.08, 0, 1);

  // Warmth from wood — consumed as fuel each day. Creates baseline demand
  // for woodcutters independent of toolmaking/artisanship. Feeds the
  // ACTIVITY social channel (not the composite `social` need directly —
  // see the channel combination below), same bucket socializing feeds.
  const woodHave = npc.inventory.wood ?? 0;
  const woodTarget = world.season === 'winter' ? 2 : 1;
  if (woodHave >= 0.5) {
    const woodConsumed = Math.min(woodHave, 0.5); // burn half a unit/day
    npc.inventory.wood -= woodConsumed;
    const warmthRatio = Math.min(woodConsumed / 0.5, 1);
    npc.activitySocial = clamp((npc.activitySocial ?? 0) + warmthRatio * 0.03, 0, 1);
  }

  // Comfort from fine goods — consumed the same way food is: drawn down
  // from inventory each day, satisfaction scaled to how much of the daily
  // target was met. Slower swing (0.08 vs food's 0.15) because comfort is
  // a slower-burning need than hunger. Feeds the MATERIAL comfort channel
  // — see the channel combination below for how this and family combine
  // into the actual `comfort` need everything else reads.
  //
  // Gated on shouldKeepForConsumption: comfort is discretionary (see
  // NEEDS.comfort.critical === false), so fine goods are only auto-eaten
  // for comfort when that's actually worth more than holding them for
  // sale. This is the other half of the fix in getBufferTarget — that one
  // stops a starving NPC from RESERVING fine goods instead of selling
  // them; this one stops any fine goods that are still sitting in
  // inventory (e.g. the market visit hasn't happened yet, or the Market
  // couldn't absorb them) from being silently consumed for comfort while
  // the same need crisis is in progress.
  const comfortTarget = 1;
  const luxHave = npc.inventory.luxury ?? 0;
  const luxConsumed = shouldKeepForConsumption(npc, 'luxury') ? Math.min(luxHave, comfortTarget) : 0;
  npc.inventory.luxury = luxHave - luxConsumed;
  const comfortGained = luxConsumed * GOODS.luxury.comfortValue;
  const comfortRatio = Math.min(comfortGained / (comfortTarget * GOODS.luxury.comfortValue), 1);
  npc.materialComfort = clamp((npc.materialComfort ?? 0) + (comfortRatio - 0.5) * 0.08, 0, 1);

  // Family channel — a spouse and/or children provide a standing source
  // of comfort/social/meaning, independent of goods or errands. Converges
  // smoothly toward familyChannelTarget() rather than snapping, so
  // marrying or having a child reads as a real transition. This is what
  // lets marriage/family close the gap fine goods and socializing alone
  // are capped below (see MATERIAL_COMFORT_CAP/ACTIVITY_SOCIAL_CAP) —
  // a wealthy hermit and a modest married household are no longer
  // equally able to reach full comfort/social satisfaction.
  const familyTarget = familyChannelTarget(npc);
  npc.familyChannel = clamp((npc.familyChannel ?? 0) + (familyTarget - (npc.familyChannel ?? 0)) * 0.08, 0, 1);
  npc.needs.comfort = clamp(MATERIAL_COMFORT_CAP * (npc.materialComfort ?? 0) + (1 - MATERIAL_COMFORT_CAP) * npc.familyChannel, 0, 1);

  // social's activity channel decays here directly (mirrors what the
  // generic decay loop used to do to the composite) — social is now
  // selfManaged (see NEEDS registry), so the generic loop below skips it
  // entirely and this is its only decay mechanism, applied to the
  // channel rather than the composite.
  npc.activitySocial = Math.max(0, (npc.activitySocial ?? 0) - NEEDS.social.decayPerDay);
  npc.needs.social = clamp(ACTIVITY_SOCIAL_CAP * (npc.activitySocial ?? 0) + (1 - ACTIVITY_SOCIAL_CAP) * npc.familyChannel, 0, 1);

  // Family also contributes a modest passive trickle to meaning — meaning
  // stays selfManaged:false (generic decay loop still applies to it), this
  // is just one more additive source alongside church attendance.
  npc.needs.meaning = clamp(npc.needs.meaning + familyTarget * FAMILY_MEANING_RATE, 0, 1);

  // Prestige converges toward prestigeTarget() rather than snapping —
  // same smoothing pattern as familyChannel — so a sudden windfall or
  // asset loss reads as a gradual shift in standing, not an instant jump.
  npc.needs.prestige = clamp(npc.needs.prestige + (prestigeTarget(npc) - npc.needs.prestige) * PRESTIGE_CONVERGENCE_RATE, 0, 1);

  // Natural decay for needs that DON'T already have a complete update
  // above (see NEEDS.selfManaged) — generic over the registry, so a
  // newly added need only needs one entry there, not a new line here.
  // food/security/comfort/social are skipped: their formulas above
  // already are their complete update, decay included, and
  // double-applying decay here was silently making a bad day cost ~3x
  // what a good day earned back (verified via day-by-day tracing:
  // +0.035/day on a fully-fed day vs -0.115/day on a food-less day, when
  // the intended symmetric swing was ±0.075) — a major, hard-to-notice
  // contributor to how easily NPCs fell into and got stuck in chronic
  // near-starvation.
  for (const [need, cfg] of Object.entries(NEEDS)) {
    if (cfg.selfManaged) continue;
    npc.needs[need] = Math.max(0, (npc.needs[need] ?? 0) - cfg.decayPerDay);
  }

  // Energy restoration from rest
  const restTime = npc.schedule.filter(a=>a.id==='rest').reduce((s,a)=>s+a.duration,0);
  npc.energy = Math.min(100, npc.energy + restTime * 5);
  if (npc.needs.food < 0.15) npc.energy = Math.max(0, npc.energy - 8); // starvation
}

// ─────────────────────────────────────────────
// THE MARKET — institutional bid/ask trading
// ─────────────────────────────────────────────
//
// updateMarketPrices() runs once per day, before trading, and sets the
// day's OPENING price: a damped move toward what yesterday's closing
// stock implies, smoothed so one huge trading day doesn't cause a violent
// overnight jump. This is what gets recorded to priceHistory and used for
// forecasting/shadow pricing (expectedPrice) — the "quoted" price.
//
// repriceGood() is the live, undamped version of the same formula. It's
// called after every individual trade inside runMarketExchange so the
// ask/bid the NEXT NPC sees already reflects the stock the previous NPC
// just bought or sold. This matters: without it, all 16 NPCs trade
// against one flat price for the whole day, and if a scarce good (like
// bread) runs out partway through, whoever landed near the back of that
// day's random order gets nothing — not because they were poor, but
// because they were unlucky. With live repricing, the price itself climbs
// as stock drains, so lagging buyers face a real, rising cost rather than
// a hard wall of zero stock. Scarcity gets rationed by price, the way the
// rest of this game's economics already works, instead of by queue order.
function priceForStock(good, stock) {
  const g = world.market.goods[good];
  const base = GOODS[good].baseValue;
  // BUG FIX: the old -0.95 floor on `dev` meant that once stock hit zero
  // (a full stockout), the price computation saturated at a FIXED ceiling
  // and could rise no further, no matter how severe or prolonged the
  // shortage became afterward. Verified in testing: bread stock sat at
  // exactly 0 for 300+ consecutive days with 20-28 units/day of unmet
  // demand, yet its price never moved a single cent past that ceiling —
  // completely masking a shortage that should have been screaming at
  // producers to make more. Real markets don't stop repricing once a
  // shelf is empty; price keeps climbing precisely because the shelf is
  // empty and buyers are still showing up. We fix this by folding
  // unmetDemand directly into the deviation: persistent unmet demand
  // pushes `dev` further negative even after stock itself can't drop any
  // further, so price keeps rising in proportion to how badly demand is
  // going unmet, not just how far stock has fallen. The lower bound is
  // relaxed from -0.95 to -3 (a ~6x max elasticity multiplier at
  // PRICE_ELASTICITY=0.6, vs the old ~1.77x cap) so genuine, sustained
  // scarcity can actually clear the market by attracting producers,
  // instead of being invisible to the price signal.
  const scarcityBoost = g.unmetDemand / Math.max(1, g.targetStock);
  const rawDev = (stock - g.targetStock) / g.targetStock - scarcityBoost;
  const dev = clamp(rawDev, -3, 5);
  return base * Math.exp(-PRICE_ELASTICITY * dev);
}

// TRADE_PRICE_IMPACT controls how much a SINGLE trade is allowed to move
// the quoted price, as a fraction of the full jump to the new raw target.
// Previously repriceGood() snapped midPrice straight to priceForStock()
// after every individual trade with NO damping at all — the smoothing in
// updateMarketPrices() only ever touched the once-per-day OPENING price,
// so it did nothing to prevent wild intraday swings as dozens of NPCs
// bought/sold in sequence within the same market session. Confirmed in
// testing: bread's midPrice climbed 11.37 -> 20.91 (+84%) across just 19
// sequential trades in a single day, entirely after that day's smoothed
// opening price had already been set. Blending each trade's impact by a
// small fraction, rather than snapping fully, turns that sawtooth into a
// gradual walk — still responsive to real supply/demand within the day,
// just not violently so from trade-order alone.
const TRADE_PRICE_IMPACT = 0.25;

function repriceGood(good) {
  const g = world.market.goods[good];
  const rawTarget = priceForStock(good, g.stock);
  g.midPrice = g.midPrice * (1 - TRADE_PRICE_IMPACT) + rawTarget * TRADE_PRICE_IMPACT;
  g.bidPrice = g.midPrice * (1 - g.spread / 2);
  g.askPrice = g.midPrice * (1 + g.spread / 2);
}

function updateMarketPrices() {
  for (const good of Object.keys(GOODS)) {
    const g = world.market.goods[good];
    const targetMid = priceForStock(good, g.stock);

    // Smooth toward the target rather than snapping — this is the
    // *opening* price for the day, so some inertia from yesterday's
    // close is appropriate.
    g.midPrice = g.midPrice * (1 - PRICE_ADJUST_RATE) + targetMid * PRICE_ADJUST_RATE;
    g.bidPrice = g.midPrice * (1 - g.spread / 2);
    g.askPrice = g.midPrice * (1 + g.spread / 2);

    g.priceHistory.push({ price: g.midPrice, season: world.season });
    if (g.priceHistory.length > 120) g.priceHistory.shift();
  }
}

function runMarketExchange() {
  for (const good of Object.keys(GOODS)) {
    world.market.goods[good].unmetSupply = 0;
    world.market.goods[good].unmetDemand = 0;
  }

  // Only NPCs who scheduled (and are executing) a market visit today get to
  // trade — going to market is now a time-costed choice, not an automatic
  // dawn ritual. Skipping market means no buying, no selling, and no
  // dividend share today; surplus goods just sit in inventory and deficits
  // go unmet until the next visit.
  const attendees = [...world.npcs.values()]
    .map(npc => ({ npc, visit: npc.schedule.find(a => a.id === 'market') }))
    .filter(({ visit }) => visit);

  world.market.visitorsToday = attendees.map(({ npc, visit }) => ({ npc, duration: visit.duration }));

  // Randomize trade order each day so no NPC has a systematic first-mover
  // advantage over the Market's limited stock/cash.
  const npcOrder = attendees.map(({ npc }) => npc);
  for (let i = npcOrder.length - 1; i > 0; i--) {
    const j = Math.floor(rng.float(0, i + 1));
    [npcOrder[i], npcOrder[j]] = [npcOrder[j], npcOrder[i]];
  }

  for (const npc of npcOrder) {
    for (const good of Object.keys(GOODS)) {
      const g = world.market.goods[good];
      const have    = npc.inventory[good] ?? 0;
      const target  = getBufferTarget(npc, good);
      const surplus = have - target;
      const deficit = target - have;

      // ── SELL to the Market (npc → Market, at the bid) ──────────────
      if (surplus > 0.1) {
        // Cost-based floor: an NPC won't dump goods below what it cost to
        // make them. If the Market's bid is under floor, the NPC just
        // holds the surplus instead of selling at a loss.
        const prof = PROFESSIONS[npc.profession];
        let costFloor = GOODS[good].baseValue * 0.4;
        if (prof && prof.outputs[good] && Object.keys(prof.inputs).length > 0) {
          let inputCostPerSession = 0;
          for (const [ig, iq] of Object.entries(prof.inputs)) {
            inputCostPerSession += iq * marketAsk(ig);
          }
          const outputPerSession = prof.outputs[good]
            * effectiveSkill(npc, npc.profession)
            * (prof.capitalGood ? (1 + Math.log1p(npc.inventory.tools ?? 0) * 0.2) : 1);
          if (outputPerSession > 0) costFloor = (inputCostPerSession / outputPerSession) * 1.15;
        }

        if (g.bidPrice >= costFloor) {
          const capacityRoom = Math.max(0, g.capacity - g.stock);
          const cashRoom     = g.cash / Math.max(g.bidPrice, 0.01);
          const qty = Math.min(surplus, have, capacityRoom, cashRoom);
          if (qty > 0.05) {
            const revenue = qty * g.bidPrice;
            npc.inventory[good] = have - qty;
            npc.savings += revenue;
            g.stock += qty;
            g.cash  -= revenue;
            repriceGood(good);
          }
          if (qty < surplus - 0.05) g.unmetSupply += (surplus - qty);
        } else {
          g.unmetSupply += surplus;
        }
      }

      // ── BUY from the Market (Market → npc, at the ask) ──────────────
      if (deficit > 0.1 && npc.savings > 0.5) {
        // Savings reserve: NPCs protect a minimum buffer and won't spend
        // below it, except in genuine starvation (food < 0.2), where the
        // reserve becomes the emergency fund it's meant to be.
        const SAVINGS_RESERVE = 5;
        const spendableSavings = npc.needs.food < 0.2
          ? npc.savings
          : Math.max(0, npc.savings - SAVINGS_RESERVE);
        if (spendableSavings < 0.5) continue;

        const affordableQty = spendableSavings / Math.max(g.askPrice, 0.01);
        const stockRoom = Math.max(0, g.stock);
        const qty = Math.min(deficit, affordableQty, stockRoom);
        if (qty > 0.05) {
          const cost = qty * g.askPrice;
          npc.inventory[good] = (npc.inventory[good] ?? 0) + qty;
          npc.savings -= cost;
          g.stock -= qty;
          g.cash  += cost;
          repriceGood(good);
        }
        if (qty < deficit - 0.05) g.unmetDemand += (deficit - qty);
      }
    }
  }
}

// ─────────────────────────────────────────────
// MEMORY & PROFESSION SWITCHING
// ─────────────────────────────────────────────

function updateMemory(npc) {
  npc.memory.daysSinceSwitch++;
  if (npc.trainingDaysLeft > 0) {
    npc.trainingDaysLeft--;
    if (npc.trainingDaysLeft <= 0) npc.trainingProfession = null;
  }

  // Update personal price history (entries are {price, season} objects).
  // Window extended to 20 so NPCs can accumulate at least one full season
  // of observations for seasonal forecasting.
  for (const good of Object.keys(GOODS)) {
    const hist = world.market.goods[good].priceHistory;
    if (hist.length > 0) {
      npc.memory.priceHistory[good].push(hist[hist.length-1]);
      if (npc.memory.priceHistory[good].length > 20) npc.memory.priceHistory[good].shift();
    }
  }

  // Update smoothed EV for each profession
  const alpha = 0.15;
  for (const profId of Object.keys(PROFESSIONS)) {
    const observed = computeProfessionEV(npc, profId);
    npc.memory.ev[profId] = alpha * observed + (1-alpha) * (npc.memory.ev[profId]??0);
  }
}

function computeProfessionEV(npc, profId) {
  const prof = PROFESSIONS[profId];
  if (!hasWorkableAsset(npc, profId)) return -999;

  // Use profSessionEV directly (not workSessionEV, which might fall back
  // to a different profession). We want the EV of THIS profId specifically.
  const savedProf = npc.profession;
  let ev;
  try {
    npc.profession = profId;
    ev = profSessionEV(npc, profId);
  } finally {
    npc.profession = savedProf; // FIX: same try/finally guarantee
  }

  if (!isFinite(ev)) return -50;
  return ev;
}

const SWITCH_PAYBACK_HORIZON = 60; // days over which switching costs are amortized in the decision

// Works out what switching to profId would actually cost this NPC right
// now: materials, a training fee (and to whom), and how long the ramp is.
function planProfessionSwitch(npc, profId) {
  const prof = PROFESSIONS[profId];
  const materialsCost = prof.materialsCost ?? 0;

  const currentPractitioners = [...world.npcs.values()].filter(n => n.id !== npc.id && n.profession === profId);
  let payees = currentPractitioners;
  if (payees.length === 0) {
    const history = world.professionHistory[profId] ?? [];
    payees = history.map(id => world.npcs.get(id)).filter(n => n && n.id !== npc.id);
  }
  // No one has ever worked this trade (or the only people who have are
  // unavailable) — there's no one to apprentice under, so no training fee.
  const trainingCost = payees.length > 0 ? (prof.trainingCost ?? 0) : 0;

  return { materialsCost, trainingCost, totalCost: materialsCost + trainingCost, trainingDays: prof.trainingDays ?? 0, payees };
}



const STARVING_FOOD_THRESHOLD = 0.15; // matches the existing starvation energy-penalty threshold
const STARVATION_MIN_TENURE = 45;     // starving NPCs can still switch much faster than a year,
                                       // but not instantly — prevents the starvation exemption
                                       // from becoming a second, larger-scale herding loophole
// Village-wide daily switch throttle now scales with population instead of
// being a flat 1. A 16-NPC village and a 200-NPC village shouldn't be held
// to the exact same absolute pace — the cap is meant to limit what FRACTION
// of the village can reallocate on a single day, not an arbitrary constant.
// One switch per ~24 residents keeps the same relative throttle strength
// the original design had at 16 NPCs (where 1/day was already a strong cap).
function maxSwitchesPerDay() {
  return Math.max(1, Math.round(world.npcs.size / 24));
}

function considerProfessionSwitch(npc) {
  // A trade is a year-long commitment, not a 20-day whim — apprenticeship,
  // tools, and a client base all take time to build, and abandoning that
  // the moment a better number flashes by defeats the point of having
  // switching costs at all. The one exception is genuine starvation: an
  // NPC actually going hungry isn't weighing career opportunity, they're
  // trying to survive, so the lock-in doesn't apply to them.
  // Starvation used to waive the tenure lock entirely (minTenure = 0),
  // which was fine at 16 NPCs but became a loophole at larger populations:
  // more simultaneous hunger meant more NPCs switching through this
  // bypass in the same window, reproducing exactly the same herding
  // cascade the yearly lock was designed to prevent — just rerouted
  // through the "emergency" path instead of the normal one. A starving
  // NPC still gets to jump the queue much faster than a year, but not
  // instantly, which keeps the correction real without making it a mass
  // stampede.
  const isStarving = npc.needs.food < STARVING_FOOD_THRESHOLD;
  const minTenure = isStarving ? STARVATION_MIN_TENURE : YEAR_LENGTH;

  // Village-wide daily cap: even a starving NPC or a very long-tenured one
  // still has to wait their turn if others already switched today. This is
  // the direct fix for the herding cascade — no single day can pull more
  // than a couple of people into (or out of) the same trade at once,
  // giving prices and supply chains real time to adjust between waves.
  if (world.switchesToday >= maxSwitchesPerDay()) return;

  const currentEV = npc.memory.ev[npc.profession] ?? 0;
  let bestAlt = null, bestEV = -Infinity;

  for (const [profId, ev] of Object.entries(npc.memory.ev)) {
    if (profId === npc.profession) continue;
    if (ev > bestEV) { bestEV = ev; bestAlt = profId; }
  }

  // A profession with ZERO current practitioners is a structural
  // emergency, not a career-opportunity whim — e.g. every miller has
  // died, so grain piles up unprocessed while bread runs out for
  // everyone, and nothing else in the sim can fix that except someone
  // stepping in. The year-long tenure lock (and the training-in-progress
  // gate) exists to prevent whimsical trade-hopping; it was never meant
  // to leave a vital supply-chain link permanently vacant just because
  // the person who could fill it switched jobs 40 days ago. The
  // village-wide daily cap above still applies, so this can't turn into
  // a stampede — at most a couple of people can respond to any given
  // vacancy on the same day.
  const bestAltIsVacant = bestAlt && countNpcsInProfession(bestAlt) === 0;

  if (!bestAltIsVacant) {
    if (npc.memory.daysSinceSwitch < minTenure) return;
    if (npc.trainingDaysLeft > 0) return; // still learning the current trade
  }

  // Also consider BUILDING a new asset from scratch — the only way an
  // asset-gated profession (miller, toolmaker, artisan) can ever attract
  // new entrants when every existing asset already has an owner. Without
  // this, real scarcity (e.g. bread) has no way to pull new capacity into
  // existence; it just caps out at however many mills happen to exist.
  let bestConstructAlt = null, bestConstructEV = -Infinity;
  for (const assetType of PRODUCTIVE_ASSET_TYPES) {
    const profId = ASSET_TYPES[assetType].profession;
    if (profId === npc.profession) continue;
    // Farm cap: a real, physical ceiling on food production capacity, not
    // just a soft price signal — this is what gives the village an actual
    // food-based population ceiling rather than an ever-expanding supply
    // of farms chasing an ever-growing population.
    if (assetType === 'farm' && countAssetsOfType('farm') >= MAX_FARMS) continue;
    const cev = computeConstructionEV(npc, profId);
    if (cev > bestConstructEV) { bestConstructEV = cev; bestConstructAlt = assetType; }
  }

  const constructionIsBest = bestConstructAlt && bestConstructEV > bestEV;
  if (constructionIsBest) {
    const threshold = 2 + (1 - npc.traits.riskTolerance) * 6;
    if (bestConstructEV - currentEV > threshold && !npc.constructionProject) {
      if (startConstruction(npc, bestConstructAlt)) {
        npc.memory.daysSinceSwitch = 0; // treat starting a build as a commitment, same lock-in spirit as switching
        world.switchesToday++;
      }
    }
    return; // don't also fall through to an ordinary instant-switch this same call
  }

  if (!bestAlt) return;

  const plan = planProfessionSwitch(npc, bestAlt);

  // Factor the real cost of switching into the decision itself, not just
  // into whether they can afford it. Two components, both converted to
  // the same per-session utility units as bestEV/currentEV so they can be
  // compared directly:
  //   - the upfront cash (materials + training), valued via this NPC's
  //     own shadow price of money (lambda) — the same conversion used
  //     everywhere else in this codebase to compare money against utility.
  //   - the ramp-up period itself: a linear 30%→100% climb over
  //     trainingDays sessions means an average shortfall of 35% of full
  //     output the whole way through, so that's 35% of bestEV, lost, for
  //     trainingDays sessions.
  // Both get amortized over a payback horizon so a great long-run EV isn't
  // blocked forever by short-run setup costs, but isn't free to ignore either.
  const avgRampDeficit = 0.35;
  const rampLoss = bestEV * avgRampDeficit * plan.trainingDays;
  const amortizedCost = (plan.totalCost * lambda(npc) + rampLoss) / SWITCH_PAYBACK_HORIZON;
  const adjustedBestEV = bestEV - amortizedCost;

  const threshold = 2 + (1 - npc.traits.riskTolerance) * 6;
  if (adjustedBestEV - currentEV <= threshold) return;

  // Still have to actually have the upfront cash on hand — this is what
  // throttles a whole village from switching into the same hot trade on
  // the same day, since only the currently-wealthy can afford entry.
  if (npc.savings < plan.totalCost) return;

  npc.savings -= plan.materialsCost;
  world.market.goods.tools.cash += plan.materialsCost; // bought equipment/materials through the Market

  if (plan.trainingCost > 0 && plan.payees.length > 0) {
    const share = plan.trainingCost / plan.payees.length;
    for (const payee of plan.payees) payee.savings += share;
    npc.savings -= plan.trainingCost;
  }

  // Record the leaver so whoever switches into this trade next still has
  // someone to pay, even once every current practitioner has moved on.
  const hist = world.professionHistory[npc.profession] ?? (world.professionHistory[npc.profession] = []);
  hist.unshift(npc.id);
  if (hist.length > 3) hist.pop();

  const costNote = plan.totalCost > 0.01
    ? ` (${plan.totalCost.toFixed(0)}¢: ${plan.materialsCost.toFixed(0)}¢ materials${plan.trainingCost > 0 ? ', ' + plan.trainingCost.toFixed(0) + '¢ training' : ''})`
    : ' (self-taught)';
  logEvent(`${npc.name} left ${PROFESSIONS[npc.profession].name} to become a ${PROFESSIONS[bestAlt].name}${costNote}.`, [npc.id]);

  npc.profession = bestAlt;
  npc.trainingProfession = bestAlt;
  npc.trainingDaysLeft = plan.trainingDays;
  npc.memory.daysSinceSwitch = 0;
  world.switchesToday++;

  // CRITICAL: if the OLD profession required an asset, npc.primaryAsset
  // still points at it — but it's no longer being worked. Without clearing
  // this, getIdleAssets() (which explicitly excludes a.id === primaryAsset)
  // permanently treats a now-unworked asset as "not idle," so it can never
  // be listed for sale or staffed by hired labor. This was the root cause
  // of a slow village-wide collapse: NPCs kept switching away from asset
  // professions into woodcutting, but their farms/mills/forges silently
  // vanished from circulation instead of becoming available to someone
  // who'd actually use them.
  const newProfNeedsAsset = Object.keys(ASSET_TYPES).some(t => ASSET_TYPES[t].profession === bestAlt);
  if (!newProfNeedsAsset) {
    npc.primaryAsset = null; // now genuinely idle — will surface in getIdleAssets()
  } else {
    // Switching INTO another asset-gated profession — only valid if they
    // already own a matching asset (hasWorkableAsset gated this decision
    // via computeProfessionEV), so re-point primaryAsset at THAT asset.
    const matchingAsset = npc.ownedAssets
      .map(id => world.assets.get(id))
      .find(a => a && ASSET_TYPES[a.type].profession === bestAlt);
    npc.primaryAsset = matchingAsset ? matchingAsset.id : null;
    if (matchingAsset) matchingAsset.idleSinceDay = undefined; // now primary again, not idle
  }
}

// ─────────────────────────────────────────────
// CAPITAL & PERISHABLES
// ─────────────────────────────────────────────

function tickCapital(npc) {
  // Capital is now just npc.inventory.tools — bought from toolmakers at
  // market price, decays via decayPerishables. No phantom money sink.
  // Keep npc.capital in sync for the UI display only.
  npc.capital = npc.inventory.tools ?? 0;
}

function decayPerishables() {
  for (const npc of world.npcs.values()) {
    for (const [good, rate] of Object.entries(GOODS).map(([g,d])=>[g,d.perishRate])) {
      if (rate > 0 && npc.inventory[good] > 0) {
        npc.inventory[good] *= (1 - rate);
      }
    }
  }
}

// The Market learns its own scale from experience: if a good keeps running
// out (repeated unmet demand), that's a granary that's too small for how
// this village actually consumes — the target stock (and capacity, which
// tracks it proportionally) grows to match. If a good keeps piling up
// unsold (repeated unmet supply — a glut the Market won't absorb), the
// target shrinks back down. Either way this is gradual: one bad day
// doesn't resize a warehouse, a week-plus of a consistent pattern does.
const STREAK_THRESHOLD = 7;   // consecutive days of real pressure before adapting
const ADAPT_STEP = 0.12;      // proportional resize per adaptation event

function adaptMarketStockTargets() {
  for (const good of Object.keys(GOODS)) {
    const g = world.market.goods[good];
    // "Real" pressure — small numerical noise near zero shouldn't count.
    const shortage = g.unmetDemand > 0.5;
    const glut     = g.unmetSupply > 0.5;

    g.shortageStreak = shortage ? g.shortageStreak + 1 : 0;
    g.glutStreak     = glut     ? g.glutStreak + 1     : 0;

    if (g.shortageStreak >= STREAK_THRESHOLD) {
      g.targetStock = Math.min(g.targetStockMax, g.targetStock * (1 + ADAPT_STEP));
      g.capacity    = g.targetStock * g.capacityRatio;
      g.shortageStreak = 0;
      logEvent(`The Market expands its ${GOODS[good].name.toLowerCase()} storage — demand has outstripped supply for weeks.`);
    } else if (g.glutStreak >= STREAK_THRESHOLD) {
      g.targetStock = Math.max(g.targetStockMin, g.targetStock * (1 - ADAPT_STEP));
      g.capacity    = g.targetStock * g.capacityRatio;
      g.glutStreak = 0;
    }
  }
}

// The Market's profit — the bid/ask spread it keeps on every trade — has
// nowhere to go by default, and testing showed that's a real problem: it
// silently vacuums money out of the village with no return path. This
// function shares it back out. Each good's cash pool above its own
// operating reserve (targetStock × baseValue × 4 — the same formula used
// to seed it) gives up a fraction each day; the combined pool is split
// among today's market-goers in proportion to time spent there. Nobody
// visiting means the pool just keeps accumulating for whenever someone
// finally does — an incentive that compounds the longer it's ignored.
const DIVIDEND_SHARE_RATE = 0.2; // fraction of each good's excess-above-reserve shared per day

function distributeMarketDividends() {
  // Start from any pool left over from a day nobody visited the Market —
  // previously this was silently discarded, which was a real money sink:
  // coins were already deducted from each good's cash reserve above, so
  // failing to hand them to anyone destroyed them outright rather than
  // merely delaying payment. Now it's carried forward until someone visits.
  let pool = world.market.dividendCarry || 0;
  for (const good of Object.keys(GOODS)) {
    const g = world.market.goods[good];
    const reserve = g.targetStock * GOODS[good].baseValue * 4;
    const excess = Math.max(0, g.cash - reserve);
    const share = excess * DIVIDEND_SHARE_RATE;
    g.cash -= share;
    pool += share;
  }

  const visitors = world.market.visitorsToday;
  const totalHours = visitors.reduce((s, v) => s + v.duration, 0);
  world.market.dividendPoolToday = pool;

  if (pool > 0.01 && totalHours > 0.01) {
    for (const { npc, duration } of visitors) {
      const share = pool * (duration / totalHours);
      npc.savings += share;
      npc.lastDividend = share;
    }
    const perHour = pool / totalHours;
    world.market.lastDividendPerVisitHour = world.market.lastDividendPerVisitHour * 0.7 + perHour * 0.3;
    world.market.dividendCarry = 0; // fully paid out — nothing to roll forward
    if (pool > 1) {
      logEvent(`The Market paid out ${pool.toFixed(0)}¢ in dividends to ${visitors.length} visitors.`, visitors.map(v => v.npc.id));
    }
  } else {
    // Nobody came to collect, or there's nothing to collect yet — carry
    // the pool forward to the next day someone visits, instead of
    // vanishing it. Let the displayed expectation decay slowly, since
    // NPCs have no way to observe the uncollected carry directly.
    world.market.dividendCarry = pool;
    world.market.lastDividendPerVisitHour *= 0.9;
  }
}

// ── The Church: tithes in, alms out ──────────────────────────────────────
// Collects from whoever actually attended today (planChurchVisit already
// scaled the tithe to their wealth), then separately hands out alms to
// whoever in the village needs it most, whether or not they attended.
const CHURCH_RESERVE = 20; // small operating buffer before anything gets redistributed

function collectTithes() {
  for (const npc of world.npcs.values()) {
    const visit = npc.schedule.find(a => a.id === 'church');
    if (!visit) continue;
    const tithe = Math.min(Math.max(0, npc.savings) * TITHE_RATE, TITHE_CAP);
    if (tithe > 0.01) {
      npc.savings -= tithe;
      world.church.cash += tithe;
    }
  }
}


// ─────────────────────────────────────────────
// ASSET AUCTIONS
// ─────────────────────────────────────────────
//
// Runs on a fixed cadence rather than continuously — matching how a real
// hamlet might hold a periodic market day for property, and far cheaper
// than checking every asset every tick. Every `forSale` asset (whether
// listed voluntarily via planAssetSaleActions or via a distress sale) is
// settled by sealed-bid auction: every other NPC privately values the
// asset (using their OWN actual skill, not a hypothetical competent
// operator — this is "what is it worth to ME specifically," unlike
// estimateAssetValue's market-reference calculation), the highest bidder
// who can actually afford their bid wins, pays the seller directly (a
// real transfer, not a market/institutional sink), and title changes
// hands. If nobody bids (or no bid clears a minimal reserve), the asset
// stays listed and tries again next auction cycle.

const AUCTION_PERIOD_DAYS = 30;
const AUCTION_MIN_RESERVE_FRACTION = 0.3; // a bid below 30% of the seller's own valuation doesn't clear

// Private valuation: same NPV-discounting idea as estimateAssetValue, but
// using the bidder's OWN current skill in the matching profession, since
// that's what determines what THEY would actually earn operating it —
// a skilled bidder values a forge more than an unskilled one, exactly as
// you'd expect in a real property market.
function bidValueForAsset(npc, asset) {
  const def = ASSET_TYPES[asset.type];
  if (!def) return 0;
  const profId = def.profession;
  // hasWorkableAsset() (called inside profSessionEV) checks asset.ownerId
  // === npc.id — correct for real gating, but a prospective BIDDER doesn't
  // own the asset yet (that's the entire point of bidding on it). So the
  // hypothetical swap has to temporarily reassign ownership too, alongside
  // profession/primaryAsset, then restore all three. Same pattern as the
  // estimateAssetValue/planTinkerAction fix — any hypothetical "what if I
  // operated this asset" check needs the full ownership triple swapped.
  const savedProf = npc.profession, savedPrimary = npc.primaryAsset, savedOwner = asset.ownerId;
  let dailyEV;
  try {
    npc.profession = profId; npc.primaryAsset = asset.id; asset.ownerId = npc.id;
    dailyEV = profSessionEV(npc, profId);
  } finally {
    // FIX: same try/finally guarantee as estimateAssetValue — see that
    // comment for why this matters.
    npc.profession = savedProf; npc.primaryAsset = savedPrimary; asset.ownerId = savedOwner;
  }
  if (!isFinite(dailyEV) || dailyEV <= 0) return 0;
  const discRate = discountRate(npc);
  const pv = dailyEV * (1 - Math.pow(1 - discRate, ASSET_VALUE_HORIZON)) / discRate;
  return Math.max(pv * asset.quality, 0);
}

// ── Installment financing, through a Bank ──────────────────────────────
// A pre-modern village auction with all-cash bidding, checked against a
// reserve pegged to the WEALTHIEST villager, creates a liquidity trap:
// nearly everyone's spare savings sit near zero while one or two outliers
// hold most of the village's cash (a realistic wealth distribution, but
// one that makes an all-cash market clear only for the very richest).
// Real small economies solve this with credit.
//
// This used to be seller-financed (the seller carried the buyer's IOU
// directly and collected installments over months). It's now a proper
// third institution alongside the Market and the Church: the BANK
// advances the seller the full financed amount in cash immediately (see
// runAssetAuctions), and the buyer's installment obligation is owed to
// the Bank, not the seller. This is what a real bank actually does —
// removes the seller's collection risk entirely (they're paid in full,
// today), and concentrates credit risk in one institution with its own
// reserve, capitalization, and (via distributeBankInterest) a way to pay
// some of its interest income back out to the village, the same
// three-institution pattern as Market dividends and Church alms.
const DOWN_PAYMENT_FRACTION = 0.35;   // buyer must have at least this much of their bid in cash now
const DEBT_TERM_DAYS        = 240;    // remaining balance amortized over ~8 months
const DEBT_INTEREST_DAILY   = 0.0006; // mild carrying cost — keeps credit from being strictly free money

// Sized the same way the Market's cash pools are (see makeMarketGood): a
// bank that starts near its own reserve floor can't fund a single loan
// until it's somehow already collected interest from loans it was never
// able to issue. POPULATION * 250 gives the Bank enough capacity to fund
// several simultaneous asset-financing deals (bids can run into the
// thousands for the wealthiest bidders) without immediately hitting its
// own liquidity ceiling — tune alongside DOWN_PAYMENT_FRACTION if the
// Bank is chronically illiquid or chronically overflowing in testing.
const BANK_INITIAL_RESERVE = POPULATION * 250;
world.bank.cash = BANK_INITIAL_RESERVE;
const BANK_RESERVE = BANK_INITIAL_RESERVE * 0.5; // floor kept before any interest is paid out
const BANK_PAYOUT_RATE = 0.05; // fraction of excess-above-reserve paid out per day — smoothed, not dumped all at once

// principal is what the Bank actually advances right now (see
// runAssetAuctions) — the debtor's obligation and the Bank's outgoing
// cash are always the same number, by construction, so the books balance
// by construction rather than needing a reconciliation step.
function issueDebt(debtorNpc, principal) {
  debtorNpc.debts = debtorNpc.debts || [];
  debtorNpc.debts.push({
    creditorId: 'bank',
    principal,
    remaining: principal,
    dailyPayment: principal * (1 + DEBT_INTEREST_DAILY * DEBT_TERM_DAYS) / DEBT_TERM_DAYS,
  });
  world.bank.cash -= principal;
  world.bank.loansOutstanding += principal;
}

// Called once per tick: every NPC with outstanding debt pays what they can
// toward it (partial payments allowed if cash-strapped — this is a
// village, not a bank, nobody's property gets repossessed over a missed
// installment in Stage 4; that's a plausible future refinement, not
// implemented here). Payments now flow to the Bank's own reserve rather
// than to a peer creditor NPC — see the Bank institution notes above
// issueDebt.
function serviceDebts() {
  let totalOutstanding = 0;
  for (const npc of world.npcs.values()) {
    if (!npc.debts || npc.debts.length === 0) continue;
    for (const debt of npc.debts) {
      const payment = Math.min(debt.dailyPayment, debt.remaining, npc.savings);
      if (payment > 0) {
        npc.savings -= payment;
        debt.remaining -= payment;
        world.bank.cash += payment; // principal recovery + interest both accrue to the Bank
      }
      // Real debt compounds when a payment is missed or only partially
      // made — the shortfall doesn't just vanish, it keeps accruing
      // interest, which is exactly the mechanism that makes real-world
      // over-borrowing genuinely risky rather than a free deferral.
      // Without this, a cash-strapped debtor could stay perpetually
      // "current" on paper while never actually shrinking their real
      // obligation relative to what they've truly paid down.
      const shortfall = debt.dailyPayment - payment;
      if (shortfall > 0.01) {
        debt.remaining += shortfall * DEBT_INTEREST_DAILY * 30; // penalty compounding on the missed portion
        debt.missedPayments = (debt.missedPayments || 0) + 1;
      }
    }
    npc.debts = npc.debts.filter(d => d.remaining > 0.01);
    totalOutstanding += npc.debts.reduce((s, d) => s + d.remaining, 0);
  }
  world.bank.loansOutstanding = totalOutstanding;
}

// The Bank's side of the three-institution symmetry: once its reserve
// exceeds BANK_RESERVE, it pays a share of the excess back out to the
// village as interest on savings — proportional to how much each NPC is
// holding, the simplest workable "interest on deposits" model. This
// mirrors distributeMarketDividends (paid to traders, proportional to
// participation) and distributeChurchAlms (paid to the needy,
// proportional to shortfall): three institutions, three distinct
// redistribution principles, all keeping the same total-money-conserved
// invariant — this only ever moves cash the Bank already collected in
// interest, never creates any.
function distributeBankInterest() {
  const excess = Math.max(0, world.bank.cash - BANK_RESERVE);
  world.bank.interestPaidToday = 0;
  if (excess < 0.5) return;

  const npcs = [...world.npcs.values()];
  const totalSavings = npcs.reduce((s, n) => s + n.savings, 0);
  if (totalSavings < 1) return;

  const payout = excess * BANK_PAYOUT_RATE; // smoothed — most of the excess stays as growing capital, not dumped in one day
  for (const n of npcs) {
    n.savings += payout * (n.savings / totalSavings);
  }
  world.bank.cash -= payout;
  world.bank.interestPaidToday = payout;
  logEvent(`The Bank paid out ${payout.toFixed(0)}¢ in interest on savings.`, npcs.map(n => n.id));
}

function runAssetAuctions() {
  const forSaleAssets = [...world.assets.values()].filter(a => a.forSale);
  if (forSaleAssets.length === 0) return;

  for (const asset of forSaleAssets) {
    const seller = world.npcs.get(asset.ownerId); // undefined if orphaned (owner died with no living heir — see killNPC)

    // Reserve pegged to MEDIAN village savings, not the max — an auction
    // that only ever prices to what the single richest villager could
    // theoretically pay will clear for nobody else, no matter how many
    // auction cycles pass. Median reflects what a realistically-positioned
    // buyer can actually bring to the table.
    const sortedSavings = [...world.npcs.values()].map(n => n.savings).sort((a,b) => a-b);
    const medianSavings = sortedSavings[Math.floor(sortedSavings.length / 2)];

    // Reserve also decays with repeated failed auction cycles — same as a
    // real property listing that sits unsold: sellers eventually lower
    // their asking price rather than holding out forever at a level the
    // market has already shown it won't clear.
    asset.auctionAttempts = asset.auctionAttempts || 0;
    const decayFactor = Math.pow(0.85, asset.auctionAttempts);
    // An orphaned/unclaimed estate has no owner with a reservation value
    // to protect — priced to move (a flat fraction of median savings)
    // rather than held to what a living owner would have wanted.
    const sellerReserveValue = seller
      ? Math.min(estimateAssetValue(seller, asset), medianSavings * 3) * AUCTION_MIN_RESERVE_FRACTION * decayFactor
      : medianSavings * 0.3 * decayFactor;

    let bestBidder = null, bestBid = -Infinity;
    for (const npc of world.npcs.values()) {
      if (npc.id === asset.ownerId) continue; // can't buy your own asset
      const valuation = bidValueForAsset(npc, asset);
      if (valuation <= 0) continue;
      // A rational bidder doesn't bid their full valuation — leaves a
      // margin, same spirit as any auction with more than one bidder.
      // No longer capped by cash-in-hand alone: a bidder can finance the
      // majority of a bid on credit (see DOWN_PAYMENT_FRACTION below), so
      // the true constraint is "can I afford the down payment," not "do I
      // have the entire price sitting in savings" — this is the direct
      // fix for the liquidity trap the all-cash version produced.

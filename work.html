      // Real borrowers are risk-conscious, not maximally leveraged: a
      // rational villager doesn't borrow up to the hilt on a hypothetical
      // future income stream, and existing debt obligations directly
      // reduce how much MORE they're willing/able to take on — the same
      // "debt-service-to-income" intuition that caps real-world mortgage
      // borrowing.
      const existingDebtBurden = (npc.debts || []).reduce((s, d) => s + d.remaining, 0);
      const MAX_LEVERAGE_MULTIPLE = 2.5; // total financed principal capped at 2.5x current savings, not unbounded
      const netBorrowingCapacity = Math.max(0, (npc.savings * (1 + MAX_LEVERAGE_MULTIPLE)) - existingDebtBurden);

      // RISK-AVERSION DISCOUNT: a forward-looking bidder discounts their
      // own valuation the more of the purchase they'd need to finance —
      // real people don't treat a fully-leveraged, debt-financed asset as
      // worth the same to them as one they could pay for outright. This
      // also directly captures interest cost (DEBT_INTEREST_DAILY over
      // DEBT_TERM_DAYS): a bidder correctly perceives that financing X
      // actually costs them more than X once interest is included, so
      // they should only be willing to bid less for the same asset the
      // more debt they'd need to take on, exactly mirroring how a real
      // buyer facing seller-financed interest bids more conservatively
      // than one paying cash.
      const financedFraction = 1 - DOWN_PAYMENT_FRACTION;
      const totalInterestMultiple = 1 + DEBT_INTEREST_DAILY * DEBT_TERM_DAYS; // total repaid per dollar financed
      const existingBurdenRatio = npc.savings > 0 ? Math.min(2, existingDebtBurden / npc.savings) : 2;
      // Discount grows with (a) how much interest financing costs and
      // (b) how debt-burdened this bidder already is — a clean villager
      // with no debt discounts only for interest; someone already
      // leveraged discounts much harder, i.e. bids far more conservatively.
      const riskDiscount = 1 / (totalInterestMultiple * (1 + existingBurdenRatio));
      const desiredBid = valuation * 0.85 * riskDiscount;

      const maxAffordableViaCredit = Math.min(
        npc.savings / DOWN_PAYMENT_FRACTION, // must still cover the down payment fraction in cash
        netBorrowingCapacity                  // and stay within a sane, debt-aware leverage ceiling
      );
      const bid = Math.min(desiredBid, maxAffordableViaCredit);
      if (bid <= 0) continue;
      if (bid > bestBid) { bestBid = bid; bestBidder = npc; }
    }

    if (bestBidder && bestBid >= sellerReserveValue && bestBid > 0.01) {
      // Settle via down payment + seller-financed installment debt rather
      // than requiring the full price in cash today.
      const downPayment = Math.min(bestBid * DOWN_PAYMENT_FRACTION, bestBidder.savings);
      const financedAmount = bestBid - downPayment;

      bestBidder.savings -= downPayment;
      // Orphaned estate (owner died with no heir — see killNPC): there's
      // no seller to pay, so proceeds go to the Church instead, same
      // "unclaimed estate" handling as any other institutional windfall,
      // rather than vanishing or crediting a dead id.
      if (seller) seller.savings += downPayment;
      else world.church.cash += downPayment;
      if (financedAmount > 0.01) {
        // The Bank advances the seller the financed portion in full,
        // right now — capped by what the Bank actually has on hand. In
        // the rare case the Bank's reserve can't cover the whole request
        // (e.g. a run of large loans issued in a short span), the seller
        // simply receives less and the buyer's loan shrinks to match:
        // the Bank never advances more than it holds, so world money
        // stays exactly conserved even under this constraint, and the
        // shortfall self-corrects as outstanding loans get repaid and
        // the Bank's reserve recovers (see serviceDebts/
        // distributeBankInterest).
        const bankFunded = Math.min(financedAmount, world.bank.cash);
        if (seller) seller.savings += bankFunded;
        else world.church.cash += bankFunded;
        if (bankFunded > 0.01) issueDebt(bestBidder, bankFunded);
      }

      if (seller) {
        seller.ownedAssets = seller.ownedAssets.filter(id => id !== asset.id);
        // FIX: this was the actual remaining leak behind the recurring
        // stale-pointer corruption. Since owners now keep working a listed
        // asset right up until it sells (a deliberate earlier fix), the
        // seller can still be its primaryAsset at the exact moment the
        // auction settles here — and this code was never updated to clear
        // that pointer on transfer. The seller instantly becomes
        // asset-less in that profession the moment ownership actually
        // changes hands, which is correct and matches how a real sale
        // works (you don't get to keep operating what you just sold).
        if (seller.primaryAsset === asset.id) {
          seller.primaryAsset = null;
        }
      }
      bestBidder.ownedAssets.push(asset.id);
      const sellerIdForHistory = asset.ownerId;
      asset.ownerId = bestBidder.id;
      recordStructureTransfer(findStructureByAssetId(asset.id), sellerIdForHistory, bestBidder.id, seller ? 'sold' : 'inherited (unclaimed estate)');
      asset.forSale = false;
      asset.starvingStreak = 0;
      asset.auctionAttempts = 0;
      asset.idleSinceDay = undefined; // fresh grace period for the new owner

      // New owner immediately starts operating it only if they currently
      // have no primary asset (i.e., they were asset-less in some
      // profession) — otherwise it's a spare they now hold, same as any
      // NPC who happens to own more than one asset.
      if (bestBidder.primaryAsset === null || bestBidder.primaryAsset === undefined) {
        bestBidder.primaryAsset = asset.id;
      }

      const financeNote = financedAmount > 0.01 ? ` (${downPayment.toFixed(0)}¢ down, ${financedAmount.toFixed(0)}¢ financed)` : '';
      logEvent(
        seller
          ? `${bestBidder.name} won the auction for ${seller.name}'s ${ASSET_TYPES[asset.type].name} (${bestBid.toFixed(0)}¢${financeNote}).`
          : `${bestBidder.name} won the auction for an unclaimed ${ASSET_TYPES[asset.type].name} (${bestBid.toFixed(0)}¢${financeNote}).`,
        seller ? [bestBidder.id, seller.id] : [bestBidder.id]
      );
    } else {
      // No qualifying bid — asset remains forSale, reserve decays for next cycle.
      asset.auctionAttempts++;
    }
  }
}


function distributeChurchAlms() {
  const excess = Math.max(0, world.church.cash - CHURCH_RESERVE);
  if (excess < 0.5) return;

  const npcs = [...world.npcs.values()];
  const meanSavings = npcs.reduce((s, n) => s + n.savings, 0) / npcs.length;
  const needy = npcs
    .map(n => ({ n, shortfall: Math.max(0, meanSavings - n.savings) }))
    .filter(x => x.shortfall > 0.5);
  const totalShortfall = needy.reduce((s, x) => s + x.shortfall, 0);

  world.church.cash -= excess;
  if (totalShortfall >= 0.5) {
    // Normal case: hand out alms proportional to how far behind the
    // village mean each NPC has fallen.
    for (const { n, shortfall } of needy) {
      n.savings += excess * (shortfall / totalShortfall);
    }
  } else {
    // Fix: previously, when the whole village was uniformly poor (near-zero
    // variance in savings), totalShortfall stayed under the 0.5 floor
    // forever and the function returned early WITHOUT refunding excess —
    // but excess had already been conceptually "found," and every day this
    // branch was skipped meant tithed coins piled up in church.cash with no
    // path back to villagers, a slow, permanent money sink. Now, whenever
    // there's real excess but no meaningful inequality to correct, pay it
    // out as a flat per-capita dividend instead of hoarding it.
    const perCapita = excess / npcs.length;
    for (const n of npcs) n.savings += perCapita;
  }

  if (excess > 1) {
    const text = totalShortfall >= 0.5
      ? `The Church distributed ${excess.toFixed(0)}¢ in alms to ${needy.length} in need.`
      : `The Church distributed ${excess.toFixed(0)}¢ evenly among the village.`;
    logEvent(text, totalShortfall >= 0.5 ? needy.map(x => x.n.id) : []);
  }
}

// ─────────────────────────────────────────────
// MAIN SIMULATION TICK
// ─────────────────────────────────────────────

// Defensive self-healing check: verifies every NPC's primaryAsset
// actually points at an asset THEY own. This is a safety net against the
// exact corruption class just fixed (a thrown exception inside a
// hypothetical profession/asset swap leaving primaryAsset pointing at
// someone else's asset) — even with the try/finally fixes in place, this
// catches any already-corrupted state from a prior run/save, and guards
// against any similar swap-and-restore pattern added in the future that
// might reintroduce the same bug. Self-heals by clearing the stale
// pointer rather than crashing or silently propagating bad state.
function healStaleAssetPointers() {
  for (const npc of world.npcs.values()) {
    if (npc.primaryAsset === null || npc.primaryAsset === undefined) continue;
    const asset = world.assets.get(npc.primaryAsset);
    if (!asset || asset.ownerId !== npc.id) {
      npc.primaryAsset = null; // will surface as idle/asset-less until a new asset is assigned
    }
  }
}

function recordTimeUse() {
  const dayTotals = {};
  for (const npc of world.npcs.values()) {
    const byAction = {};
    for (const action of npc.schedule) {
      byAction[action.id] = (byAction[action.id] || 0) + action.duration;
      dayTotals[action.id] = (dayTotals[action.id] || 0) + action.duration;
    }
    npc.timeUseHistory.push({ day: world.day, byAction });
    if (npc.timeUseHistory.length > TIME_USE_WINDOW) npc.timeUseHistory.shift();
  }
  world.timeUseHistory.push({ day: world.day, byAction: dayTotals });
  if (world.timeUseHistory.length > TIME_USE_WINDOW) world.timeUseHistory.shift();
}

function tickDay() {
  world.day++;
  const seasonIdx = Math.floor((world.day % 360) / 90);
  world.season = ['spring','summer','autumn','winter'][seasonIdx];

  healStaleAssetPointers();
  postWageOffers();
  for (const npc of world.npcs.values()) { buildSchedule(npc); npc._seekingMarriageToday = false; }
  recordTimeUse();
  // NPCs work first, accumulating output. Then the Market re-prices off
  // yesterday's stock and trades with each NPC individually — no peer-to-
  // peer matching, no auction. All money flows happen inside
  // runMarketExchange (executeSchedule only moves goods for work actions)
  // so conservation still holds.
  for (const npc of world.npcs.values()) executeSchedule(npc);
  updateMarketPrices();
  runMarketExchange();
  adaptMarketStockTargets();
  distributeMarketDividends();
  collectTithes();
  distributeChurchAlms();
  if (world.day % AUCTION_PERIOD_DAYS === 0) runAssetAuctions();
  serviceDebts();
  distributeBankInterest();
  for (const npc of world.npcs.values()) satisfyNeeds(npc);
  tickRelationDecay();
  tickAgingAndDeaths();
  for (const npc of world.npcs.values()) updateAssetDistressStreaks(npc);
  // Construction now advances inside executeSchedule (see completeConstruction),
  // triggered by actually executing 'build' schedule actions rather than
  // a separate daily calendar pass.
  for (const npc of world.npcs.values()) updateMemory(npc);

  // Shuffle order before considering switches — maxSwitchesPerDay() caps
  // how many go through today, and without shuffling, whoever happens
  // first in iteration order would always win any contention.
  world.switchesToday = 0;
  const switchOrder = [...world.npcs.values()];
  for (let i = switchOrder.length - 1; i > 0; i--) {
    const j = Math.floor(rng.float(0, i + 1));
    [switchOrder[i], switchOrder[j]] = [switchOrder[j], switchOrder[i]];
  }
  for (const npc of switchOrder) considerProfessionSwitch(npc);
  for (const npc of world.npcs.values()) considerHouseConstruction(npc);
  runMarriageMarket();
  resolveHelpRequests();
  tickChildren();

  for (const npc of world.npcs.values()) tickCapital(npc);
  decayPerishables();

  // Update NPC destinations for animation
  for (const npc of world.npcs.values()) {
    const action = npc.schedule[0];
    if (action) {
      npc.currentAction = action.id;
      if (action.id.startsWith('work')) {
        // Millers & toolmakers walk to the specific mill/forge THEY
        // operate (their primaryAsset's structure), not just any
        // building of the right type — matters now that several can
        // exist at once. Falls back to type-match if that lookup fails.
        let workBuilding = npc.primaryAsset != null
          ? findStructureByAssetId(npc.primaryAsset)
          : null;
        if (!workBuilding && PROFESSIONS[npc.profession]?.requires) {
          workBuilding = findStructureByType(PROFESSIONS[npc.profession].requires);
        }
        if (workBuilding) {
          npc.destX = workBuilding.x + rng.float(-12,12);
          npc.destY = workBuilding.y + rng.float(-12,12);
        } else {
          npc.destX = npc.homeX + rng.float(-20,20);
          npc.destY = npc.homeY + 30 + rng.float(-10,10);
        }
      } else if (action.id === 'market') {
        // Move toward market
        const marketBuilding = findStructureByType('market');
        if (marketBuilding) {
          npc.destX = marketBuilding.x + rng.float(-15,15);
          npc.destY = marketBuilding.y + rng.float(-15,15);
        }
      } else if (action.id === 'church') {
        // Move toward church
        const churchBuilding = findStructureByType('church');
        if (churchBuilding) {
          npc.destX = churchBuilding.x + rng.float(-15,15);
          npc.destY = churchBuilding.y + rng.float(-15,15);
        }
      } else if (action.id === 'socialize') {
        // Move toward center
        npc.destX = 380 + rng.float(-40,40);
        npc.destY = 280 + rng.float(-40,40);
      } else {
        npc.destX = npc.homeX + rng.float(-8,8);
        npc.destY = npc.homeY + rng.float(-8,8);
      }
    }
  }
}

// ─────────────────────────────────────────────

const canvas = document.getElementById('world-canvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  const sidebar = document.querySelector('.sidebar');
  canvas.width  = window.innerWidth - sidebar.offsetWidth;
  canvas.height = window.innerHeight - document.querySelector('header').offsetHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const ACTION_COLORS = {
  work:        '#8B6914',
  buy_grain:   '#1464A0',
  buy_bread:   '#1464A0',
  sell_grain:  '#145A8B',
  sell_bread:  '#145A8B',
  sell_wood:   '#145A8B',
  sell_tools:  '#145A8B',
  rest:        '#2E7D32',
  socialize:   '#7B1FA2',
  church:      '#C9A227',
  hired_labor: '#D4780A', // distinct burnt-orange: working someone else's asset, not your own trade
  building:    '#5A3E9E', // distinct violet-blue: mid-construction on a brand-new asset
  idle:        '#9E9E9E',
};

function getActionColor(npcOrActionId) {
  // Accepts either a raw action id (legacy call sites) or the full npc
  // object — an in-progress construction project takes visual priority
  // over whatever the NPC's schedule says today, since "building a mill"
  // is the more informative, longer-running state a player would want to
  // see at a glance.
  const npc = (npcOrActionId && typeof npcOrActionId === 'object') ? npcOrActionId : null;
  const actionId = npc ? npc.currentAction : npcOrActionId;
  if (npc && npc.constructionProject)  return ACTION_COLORS.building;
  if (actionId === 'hired-labor')      return ACTION_COLORS.hired_labor;
  if (actionId?.startsWith('work'))    return ACTION_COLORS.work;
  if (actionId === 'market')           return ACTION_COLORS.buy_grain;
  if (actionId === 'church')           return ACTION_COLORS.church;
  if (actionId === 'socialize')        return ACTION_COLORS.socialize;
  if (actionId === 'rest')             return ACTION_COLORS.rest;
  return ACTION_COLORS.idle;
}

function drawScene(alpha) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  // Background — season-tinted grass
  const seasonColors = {
    spring: '#6b8f4a', summer: '#5a7a3a', autumn: '#8a7040', winter: '#8a9090'
  };
  ctx.fillStyle = seasonColors[world.season];
  ctx.fillRect(0,0,W,H);

  // Subtle texture
  ctx.globalAlpha = 0.07;
  for (let i=0;i<W;i+=4) for (let j=0;j<H;j+=4) {
    if (rng.next()<0.3) { ctx.fillStyle='#000'; ctx.fillRect(i,j,2,2); }
  }
  ctx.globalAlpha = 1;

  // Road to market
  ctx.strokeStyle = '#c4a87a';
  ctx.lineWidth = 6;
  ctx.globalAlpha = 0.5;
  const marketS = findStructureByType('market');
  if (marketS) {
    for (const npc of world.npcs.values()) {
      ctx.beginPath();
      ctx.moveTo(npc.homeX, npc.homeY);
      ctx.lineTo(marketS.x, marketS.y);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // Buildings — every structure instance, so N mills really draw as N mills
  // "In use today": institutions (no backing asset) always read as active.
  // Houses read as in-use if occupied (owner != null) — a heirless house
  // pending re-auction genuinely IS sitting idle, worth showing as such.
  // Productive buildings (mill, forge, farm, workshop) are in use if the
  // owner is actively working it themselves today OR any hired laborer
  // is currently clocked in there — reuses the same currentAction/
  // employedLaborIds data the structure inspector already surfaces.
  function isStructureInUse(s) {
    const asset = s.assetId != null ? world.assets.get(s.assetId) : null;
    if (!asset) return true;
    if (s.type === 'house') return s.ownerId != null;
    const owner = s.ownerId != null ? world.npcs.get(s.ownerId) : null;
    if (owner && owner.currentAction === 'work' && PROFESSIONS[owner.profession]?.requires === s.type) return true;
    for (const wid of (asset.employedLaborIds ?? [])) {
      const w = world.npcs.get(wid);
      if (w && w.currentAction === 'hired-labor') return true;
    }
    return false;
  }

  // How many PRODUCTIVE (non-house) buildings each owner holds — an
  // owner with 2+ gets a small colored marker on each of their buildings
  // so a land-consolidation pattern (one family quietly buying up every
  // mill in the village) reads visually rather than requiring you to
  // click through every building's inspector to notice.
  const ownerProductiveCounts = new Map();
  for (const s of world.structures.values()) {
    if (s.ownerId != null && s.type !== 'house' && ASSET_TYPES[s.type]) {
      ownerProductiveCounts.set(s.ownerId, (ownerProductiveCounts.get(s.ownerId) || 0) + 1);
    }
  }
  // Deterministic per-owner color via golden-angle hue rotation — same
  // owner always gets the same color across buildings and re-renders,
  // and successive owner ids land far apart in hue so adjacent owners
  // don't get visually-confusable colors.
  function ownerColor(ownerId) {
    const hue = (ownerId * 137.508) % 360;
    return `hsl(${hue}, 70%, 45%)`;
  }

  for (const b of world.structures.values()) {
    ctx.strokeStyle = '#2c1810';
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = isStructureInUse(b) ? 1 : 0.4;

    if (b.type === 'market') {
      ctx.fillStyle = '#c4a87a';
      ctx.fillRect(b.x-18,b.y-18,36,32);
      ctx.strokeRect(b.x-18,b.y-18,36,32);
      ctx.beginPath();
      ctx.moveTo(b.x-22,b.y-18); ctx.lineTo(b.x,b.y-32); ctx.lineTo(b.x+22,b.y-18);
      ctx.fillStyle='#8B3A1A'; ctx.fill(); ctx.stroke();

    } else if (b.type === 'mill') {
      // Round tower + sails
      ctx.fillStyle = '#c8b89a';
      ctx.beginPath(); ctx.arc(b.x, b.y, 14, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#8B3A1A';
      ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
      // Four sails
      ctx.strokeStyle = '#4a3020'; ctx.lineWidth = 2;
      [[0,-18],[0,18],[18,0],[-18,0]].forEach(([dx,dy]) => {
        ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x+dx, b.y+dy); ctx.stroke();
      });

    } else if (b.type === 'forge') {
      ctx.fillStyle = '#807060';
      ctx.fillRect(b.x-12,b.y-14,24,28); ctx.strokeRect(b.x-12,b.y-14,24,28);
      // Chimney with smoke hint
      ctx.fillStyle = '#606050';
      ctx.fillRect(b.x+4,b.y-22,7,10); ctx.strokeRect(b.x+4,b.y-22,7,10);
      ctx.fillStyle = '#8B3A1A';
      ctx.beginPath(); ctx.arc(b.x-2,b.y+2,4,0,Math.PI*2); ctx.fill(); // forge glow

    } else if (b.type === 'house') {
      // Small cottage: body + peaked roof + door
      ctx.fillStyle = '#d9c4a0';
      ctx.fillRect(b.x-9, b.y-6, 18, 14); ctx.strokeRect(b.x-9, b.y-6, 18, 14);
      ctx.beginPath();
      ctx.moveTo(b.x-11, b.y-6); ctx.lineTo(b.x, b.y-16); ctx.lineTo(b.x+11, b.y-6);
      ctx.closePath();
      ctx.fillStyle = '#7a4a2a'; ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#4a3020';
      ctx.fillRect(b.x-2.5, b.y+2, 5, 6);

    } else if (b.type === 'church') {
      // Chapel: body + spire + cross
      ctx.fillStyle = '#e4ddc8';
      ctx.fillRect(b.x-13, b.y-8, 26, 20); ctx.strokeRect(b.x-13, b.y-8, 26, 20);
      ctx.beginPath();
      ctx.moveTo(b.x-15, b.y-8); ctx.lineTo(b.x, b.y-22); ctx.lineTo(b.x+15, b.y-8);
      ctx.closePath();
      ctx.fillStyle = '#5a4a6e'; ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#2c1810'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y-30); ctx.lineTo(b.x, b.y-22);
      ctx.moveTo(b.x-4, b.y-27); ctx.lineTo(b.x+4, b.y-27);
      ctx.stroke();

    } else if (b.type === 'well') {
      ctx.fillStyle = '#8a8a8a';
      ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#4a3020'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b.x-6,b.y-10); ctx.lineTo(b.x-6,b.y-2);
      ctx.moveTo(b.x+6,b.y-10); ctx.lineTo(b.x+6,b.y-2);
      ctx.moveTo(b.x-8,b.y-10); ctx.lineTo(b.x+8,b.y-10); ctx.stroke();

    } else if (b.type === 'workshop' || b.type === 'farm') {
      ctx.fillStyle = b.type === 'farm' ? '#b8a860' : '#a89880';
      ctx.fillRect(b.x-13, b.y-10, 26, 22); ctx.strokeRect(b.x-13, b.y-10, 26, 22);
      ctx.fillStyle = '#7a6a4a';
      ctx.fillRect(b.x-13, b.y-10, 26, 6); ctx.strokeRect(b.x-13, b.y-10, 26, 6);

    } else {
      ctx.fillStyle = '#9090a0';
      ctx.beginPath(); ctx.arc(b.x,b.y,10,0,Math.PI*2); ctx.fill(); ctx.stroke();
    }

    ctx.globalAlpha = 1; // labels and the owner marker stay fully legible even when the building itself is faded

    if (b.type !== 'house') {
      ctx.fillStyle = '#2c1810';
      ctx.font = '10px Crimson Pro';
      ctx.textAlign = 'center';
      ctx.fillText(b.label, b.x, b.y + (b.type==='mill' ? 26 : 28));
    }

    // Multi-building owner marker (see ownerProductiveCounts above)
    if (b.type !== 'house' && b.ownerId != null && (ownerProductiveCounts.get(b.ownerId) ?? 0) >= 2) {
      ctx.beginPath();
      ctx.arc(b.x + 14, b.y - 14, 4, 0, Math.PI*2);
      ctx.fillStyle = ownerColor(b.ownerId);
      ctx.fill();
      ctx.strokeStyle = '#2c1810'; ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // NPCs — interpolate position
  for (const npc of world.npcs.values()) {
    const x = npc.x + (npc.destX - npc.x) * 0.12;
    const y = npc.y + (npc.destY - npc.y) * 0.12;
    npc.x = x; npc.y = y;

    const color = getActionColor(npc);
    const isSelected = selectedNPC === npc.id;

    // Shadow
    ctx.beginPath();
    ctx.ellipse(x, y+6, 5, 3, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fill();

    // Body
    ctx.beginPath();
    ctx.arc(x, y, isSelected ? 8 : 6, 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = isSelected ? '#f2e8d5' : 'rgba(0,0,0,0.4)';
    ctx.lineWidth = isSelected ? 2 : 1;
    ctx.stroke();

    // Head
    ctx.beginPath();
    ctx.arc(x, y-9, 4, 0, Math.PI*2);
    ctx.fillStyle = '#d4a574';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // Hunger indicator
    if (npc.needs.food < 0.2) {
      ctx.beginPath();
      ctx.arc(x+7, y-12, 3, 0, Math.PI*2);
      ctx.fillStyle = '#F44336';
      ctx.fill();
    }

    // Name
    ctx.fillStyle = isSelected ? '#f2e8d5' : 'rgba(44,24,16,0.85)';
    ctx.font = `${isSelected?'bold ':''}10px Crimson Pro`;
    ctx.textAlign = 'center';
    ctx.fillText(npc.name, x, y-16);
  }
}

let selectedNPC = null;
let selectedStructure = null;

function updateUI() {
  document.getElementById('day-display').textContent = world.day;
  document.getElementById('pop-display').textContent = world.npcs.size;

  const seasonEl = document.getElementById('season-display');
  seasonEl.textContent = world.season.charAt(0).toUpperCase() + world.season.slice(1);
  const sColors = { spring:'#5a7a3a', summer:'#8b8b2a', autumn:'#8b5a2a', winter:'#4a6a8a' };
  seasonEl.style.background = sColors[world.season];
  seasonEl.style.color = '#f2e8d5';
  seasonEl.style.padding = '2px 8px';

  // Market grid
  const divStatus = document.getElementById('market-dividend-status');
  const visitCount = world.market.visitorsToday.length;
  divStatus.textContent = visitCount > 0
    ? `${visitCount} at market today · paid out ${world.market.dividendPoolToday.toFixed(0)}¢ · ~${world.market.lastDividendPerVisitHour.toFixed(2)}¢/hr going rate`
    : `Nobody at market today · ~${world.market.lastDividendPerVisitHour.toFixed(2)}¢/hr going rate`;

  const mg = document.getElementById('market-grid');
  mg.innerHTML = '';
  for (const [good, data] of Object.entries(GOODS)) {
    const g = world.market.goods[good];
    const hist = g.priceHistory;
    const price = g.midPrice.toFixed(1);
    const prevEntry = hist.length > 1 ? hist[hist.length-2].price : g.midPrice;
    const trend = g.midPrice > prevEntry ? '▲' : g.midPrice < prevEntry ? '▼' : '–';
    const trendColor = g.midPrice > prevEntry ? '#c0392b' : '#27ae60';
    const unmet = (g.unmetDemand > 0.1 ? `short ${g.unmetDemand.toFixed(1)}` :
                   g.unmetSupply > 0.1 ? `glut ${g.unmetSupply.toFixed(1)}` : 'balanced');
    mg.innerHTML += `
      <div class="market-item">
        <div class="good-name">${data.name}</div>
        <div class="good-price">${price} <span style="color:${trendColor};font-size:0.8rem">${trend}</span></div>
        <div class="good-unmet" title="bid ${g.bidPrice.toFixed(1)} / ask ${g.askPrice.toFixed(1)}">${unmet} · ${g.stock.toFixed(0)}/${g.capacity}</div>
      </div>`;
  }

  // Sparklines
  drawSparklines();

  // NPC list
  const nl = document.getElementById('npc-list');
  nl.innerHTML = '';
  for (const npc of world.npcs.values()) {
    const div = document.createElement('div');
    div.className = 'npc-item' + (selectedNPC===npc.id?' selected':'');
    div.onclick = () => { selectedNPC = npc.id; selectedStructure = null; updateUI(); switchToInspector(); };

    const needsHTML = Object.entries(npc.needs).map(([need,val])=>{
      const colors = { food:'#e74c3c', security:'#f39c12', comfort:'#a5478b', social:'#9b59b6', meaning:'#3498db', prestige:'#c9962c' };
      return `<div class="needs-bar-row">
        <span class="needs-bar-label">${need}</span>
        <div class="needs-bar-bg">
          <div class="needs-bar-fill" style="width:${(val*100).toFixed(0)}%;background:${colors[need]}"></div>
        </div>
        <span style="font-size:0.65rem;color:var(--ink-faded);width:28px;text-align:right">${(val*100).toFixed(0)}%</span>
      </div>`;
    }).join('');

    const spouse = npc.spouseId != null ? world.npcs.get(npc.spouseId) : null;
    const familyLine = spouse ? `💍 ${spouse.name}${npc.childIds.length ? ` · ${npc.childIds.length} kid${npc.childIds.length>1?'s':''}` : ''}` : '';

    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span class="npc-name">${npc.name}</span>
        <span class="npc-prof">${PROFESSIONS[npc.profession]?.name ?? npc.profession}</span>
      </div>
      <div style="font-size:0.72rem;color:var(--ink-faded);margin:2px 0">
        ${npc.currentAction ?? 'idle'} · ⚡${npc.energy.toFixed(0)} · 💰${npc.savings.toFixed(1)}${familyLine ? ' · ' + familyLine : ''}
      </div>
      ${needsHTML}`;
    nl.appendChild(div);
  }

  // Inspector
  if (selectedStructure !== null) {
    const s = world.structures.get(selectedStructure);
    if (s) drawStructureInspector(s);
  } else if (selectedNPC !== null) {
    const npc = world.npcs.get(selectedNPC);
    if (npc) drawInspector(npc);
  }

  updateInfraPanel();
  updateTimeUsePanel();
  updateDemographics();

  // Event log
  const logEl = document.getElementById('event-log');
  logEl.innerHTML = world.eventLog.slice(0,12).map(e=>
    `<div class="log-entry"><span class="day-tag">Day ${e.day}</span>${e.text}</div>`
  ).join('');
}

function updateDemographics() {
  const el = document.getElementById('demographics-status');
  if (!el) return;

  const npcs = [...world.npcs.values()];
  const n = npcs.length;
  const marriedCount = npcs.filter(p => p.spouseId != null).length;
  const householdsWithKids = npcs.filter(p => p.spouseId != null && p.id < p.spouseId && p.childIds.length > 0).length;
  const couples = npcs.filter(p => p.spouseId != null && p.id < p.spouseId).length;
  const totalKids = world.children.size;
  const avgKidsPerCouple = couples > 0
    ? (npcs.reduce((s,p) => s + (p.spouseId != null && p.id < p.spouseId ? p.childIds.length : 0), 0) / couples)
    : 0;
  const homelessCount = npcs.filter(p => housingQuality(p) < 1.0).length;
  const farmCount = countAssetsOfType('farm');

  el.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:0.78rem">
      <span>Population</span><span>${n}</span>
      <span>Married</span><span>${marriedCount} (${couples} couples)</span>
      <span>Children (dependents)</span><span>${totalKids}</span>
      <span>Couples with kids</span><span>${householdsWithKids} / ${couples}</span>
      <span>Avg kids/couple</span><span>${avgKidsPerCouple.toFixed(1)}</span>
      <span>Homeless</span><span style="${homelessCount>0?'color:#8b3a1a':''}">${homelessCount}</span>
      <span>Farms</span><span>${farmCount} / ${MAX_FARMS} cap</span>
      <span style="grid-column:1/-1;border-top:1px solid #6b4c3b;margin-top:2px;padding-top:2px;font-style:italic;color:var(--ink-faded)">Lifetime</span>
      <span>Total births</span><span>${world.totalBirths}</span>
      <span>Total deaths</span><span>${world.totalDeaths} (${world.deathsByCause.starvation} starvation, ${world.deathsByCause.oldAge} old age)</span>
    </div>`;
}

function drawSparklines() {
  const sc = document.getElementById('sparkline-canvas');
  const sx = sc.getContext('2d');
  sx.clearRect(0,0,sc.width,sc.height);

  const goods = Object.keys(GOODS);
  const colors = ['#c8a84b','#c47a3a','#7a5a3a','#808080','#a5478b'];
  const rowH = sc.height / goods.length;

  goods.forEach((good,i) => {
    const raw = world.market.goods[good].priceHistory.slice(-50);
    if (raw.length < 2) return;
    const hist = raw.map(e => e.price);

    const y0 = i * rowH + 4;
    const h  = rowH - 8;
    const mn = Math.min(...hist) * 0.9;
    const mx = Math.max(...hist) * 1.1;

    // Label
    sx.fillStyle = '#6b4c3b';
    sx.font = '9px Crimson Pro';
    sx.textAlign = 'left';
    sx.fillText(GOODS[good].name, 2, y0 + h/2 + 4);

    // Line
    sx.beginPath();
    sx.strokeStyle = colors[i];
    sx.lineWidth = 1.5;
    hist.forEach((p,j) => {
      const x = 65 + (j / (hist.length-1)) * (sc.width - 70);
      const y = y0 + h - ((p - mn) / (mx - mn)) * h;
      j===0 ? sx.moveTo(x,y) : sx.lineTo(x,y);
    });
    sx.stroke();

    // Current price
    const last = hist[hist.length-1].toFixed(1);
    sx.fillStyle = colors[i];
    sx.textAlign = 'right';
    sx.fillText(last, sc.width-2, y0+h/2+4);
  });
}

function drawStructureInspector(s) {
  const el = document.getElementById('inspector');
  if (!el) return;

  const owner = s.ownerId != null ? world.npcs.get(s.ownerId) : null;
  const asset = s.assetId != null ? world.assets.get(s.assetId) : null;

  const workerNames = (asset?.employedLaborIds ?? [])
    .map(id => world.npcs.get(id)?.name).filter(Boolean);

  // For houses specifically: who actually LIVES here, not just who owns
  // it — includes a spouse who moved in (their own primaryHouse was
  // nulled out at marriage, see marryCouple) and any of their children.
  let householdHtml = '';
  if (s.type === 'house' && owner) {
    const residents = [owner];
    if (owner.spouseId != null) {
      const spouse = world.npcs.get(owner.spouseId);
      if (spouse && spouse.primaryHouse == null) residents.push(spouse); // moved in, not a separate homeowner
    }
    const kids = residents.flatMap(r => r.childIds.map(id => world.children.get(id)).filter(Boolean));
    const uniqueKids = [...new Map(kids.map(k => [k.id, k])).values()];
    householdHtml = `<div style="font-size:0.72rem;margin:4px 0">
      <b>Household:</b> ${residents.map(r => r.name).join(' & ')}${uniqueKids.length ? `, ${uniqueKids.map(c=>c.name).join(', ')} (${uniqueKids.length} child${uniqueKids.length>1?'ren':''})` : ''}
    </div>`;
  }

  const historyRows = s.history.slice().reverse().map(h => {
    const label = h.event === 'built' ? 'Built' : h.event === 'sold' ? 'Sold' : h.event;
    const who = h.event === 'built'
      ? (world.npcs.get(h.ownerId)?.name ?? 'the village')
      : `${world.npcs.get(h.fromId)?.name ?? '—'} → ${world.npcs.get(h.toId)?.name ?? '—'}`;
    return `<div style="font-size:0.72rem;display:flex;justify-content:space-between">
      <span>${label} — ${who}</span>
      <span style="color:var(--ink-faded)">Day ${h.day}</span>
    </div>`;
  }).join('');

  const details = ASSET_TYPES[s.type] ? `
    <div style="font-size:0.72rem;color:var(--ink-faded);margin:2px 0">
      Quality: ${(asset?.quality ?? 1).toFixed(2)} ·
      Capacity: ${asset?.capacity ?? 1} ·
      ${asset?.forSale ? '<span style="color:#8b3a1a">Listed for sale</span>' : 'Not for sale'}
    </div>` : '';

  el.innerHTML = `
    <div class="npc-header" style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="npc-name">${s.label}</span>
      <span class="npc-prof">${owner ? 'Owned by ' + owner.name : 'Village institution'}</span>
    </div>
    ${details}
    ${householdHtml}
    ${workerNames.length ? `<div style="font-size:0.72rem;margin:4px 0"><b>Working here:</b> ${workerNames.join(', ')}</div>` : ''}
    <div style="margin-top:8px;padding-top:6px;border-top:1px solid #6b4c3b">
      <div style="font-size:0.7rem;font-style:italic;color:var(--ink-faded);margin-bottom:3px">History</div>
      ${historyRows || '<div style="font-size:0.72rem;color:var(--ink-faded)">No recorded events.</div>'}
    </div>`;
}

function drawInspector(npc) {
  const el = document.getElementById('inspector');
  const lam = lambda(npc).toFixed(2);

  const invStr = Object.entries(npc.inventory)
    .map(([g,q])=>`${g}: ${q.toFixed(1)}`).join(' · ');

  // Time-use breakdown: average hours/day per action over the NPC's
  // recent history (last TIME_USE_WINDOW days, or fewer early on),
  // rather than just today's single schedule — smooths out day-to-day
  // noise (e.g. one tinkering day) so the shape reflects an actual
  // recent pattern.
  const recentDays = npc.timeUseHistory.slice(-14);
  const avgByAction = {};
  for (const day of recentDays) {
    for (const [id, hrs] of Object.entries(day.byAction)) {
      avgByAction[id] = (avgByAction[id] || 0) + hrs;
    }
  }
  for (const id of Object.keys(avgByAction)) avgByAction[id] /= Math.max(1, recentDays.length);
  const timeUseHtml = renderTimeUseBar(avgByAction);

  const evRows = Object.entries(npc.memory.ev).map(([profId,ev])=>{
    const isCurrent = profId === npc.profession;
    const prof = PROFESSIONS[profId];
    // Build a compact signal string: "bread×3→8.2 grain×2→3.1" etc.
    let signal = '';
    if (prof) {
      const outParts = Object.entries(prof.outputs).map(([g,q])=>
        `${GOODS[g].name}×${q}→${expectedPrice(npc,g).toFixed(1)}`);
      const inParts  = Object.entries(prof.inputs).map(([g,q])=>
        `${GOODS[g].name}×${q}←${expectedPrice(npc,g).toFixed(1)}`);
      signal = [...outParts,...inParts].join(' ');
      if (!hasWorkableAsset(npc, profId)) {
        // Asset-gated and this NPC doesn't own one — show what building
        // one from scratch would be worth, since that's now a real,
        // player-visible option rather than a dead end (⛔ used to be the
        // whole story here; it no longer is).
        const cev = computeConstructionEV(npc, profId);
        signal = cev > -900 ? `🔨 build: ${cev.toFixed(1)}` : '⛔ no asset, not worth building';
      }
    }
    return `<tr class="${isCurrent?'current-prof':''}">
      <td>${PROFESSIONS[profId]?.name}</td>
      <td>${ev.toFixed(1)}</td>
      <td style="font-size:0.65rem;color:var(--ink-faded);font-style:italic">${isCurrent?'◀':''} ${signal}</td>
    </tr>`;
  }).join('');

  // In-progress construction gets its own prominent banner — this is a
  // multi-week commitment the NPC is mid-way through, worth surfacing
  // clearly rather than burying it in the EV table.
  const constructionBanner = npc.constructionProject ? `
    <div style="background:var(--parchment-dark,#e8dcc0);border:1px solid #5A3E9E;border-radius:4px;padding:6px;margin-bottom:6px;font-size:0.75rem">
      🔨 Building a ${ASSET_TYPES[npc.constructionProject.assetType].name.toLowerCase()} —
      ${(npc.constructionProject.laborHoursDone / CONSTRUCTION_HOURS_PER_DAY).toFixed(1)}/${(npc.constructionProject.laborHoursNeeded / CONSTRUCTION_HOURS_PER_DAY).toFixed(0)} labor-days
    </div>` : '';

  // Action scores for today
  const actions = getAvailableActions(npc);
  const scored = actions.map(a=>({...a,score:scoreAction(a,npc)}))
                        .sort((a,b)=>b.score-a.score).slice(0,5);
  const actionRows = scored.map(a=>
    `<tr><td>${a.label}</td><td>${a.score.toFixed(2)}</td></tr>`
  ).join('');

  // Family — spouse, children (with age in days -> nearest "year" at
  // 360 days/year, matching how CHILDHOOD_DAYS is denominated), and
  // current housing status (see housingQuality's spousal fallback).
  const spouse = npc.spouseId != null ? world.npcs.get(npc.spouseId) : null;
  const kids = npc.childIds.map(id => world.children.get(id)).filter(Boolean);
  const housed = housingQuality(npc) >= 1.0;
  const familySection = `
    <div style="font-size:0.75rem;margin-bottom:6px;padding:6px;background:var(--parchment-dark,#e8dcc0);border-radius:4px">
      <div style="font-style:italic;color:var(--ink-faded);margin-bottom:2px">Family</div>
      ${spouse ? `Married to <b>${spouse.name}</b> (${PROFESSIONS[spouse.profession]?.name ?? spouse.profession})` : 'Unmarried'}
      ${kids.length ? `<br>${kids.length} child${kids.length>1?'ren':''}: ${kids.map(c => `${c.name} (age ${(c.age/DOG_YEAR_DAYS).toFixed(1)})`).join(', ')}` : ''}
      <br><span style="${housed?'':'color:#8b3a1a'}">${housed ? '🏠 Housed' : '⛺ Homeless — see housing status'}</span>
    </div>`;

  const needsHTML = Object.entries(npc.needs).map(([need,val])=>{
    const colors = { food:'#e74c3c', security:'#f39c12', comfort:'#a5478b', social:'#9b59b6', meaning:'#3498db', prestige:'#c9962c' };
    const cfg = NEEDS[need];
    const critical = cfg?.critical && cfg.starvationFloor > 0 && val < cfg.starvationFloor;
    return `<div class="needs-bar-row">
      <span class="needs-bar-label">${need}${critical ? ' ⚠️' : ''}</span>
      <div class="needs-bar-bg">
        <div class="needs-bar-fill" style="width:${(val*100).toFixed(0)}%;background:${critical ? '#8b3a1a' : colors[need]}"></div>
      </div>
      <span style="font-size:0.65rem;color:var(--ink-faded);width:28px;text-align:right">${(val*100).toFixed(0)}%</span>
    </div>`;
  }).join('');

  // Events involving this NPC specifically — filtered from the same
  // global world.eventLog everyone else reads (see logEvent), not a
  // separate per-NPC log to maintain. Most recent first, capped so the
  // panel doesn't grow unbounded for a long-lived, event-heavy NPC.
  const npcEvents = world.eventLog.filter(e => e.npcIds && e.npcIds.includes(npc.id)).slice(0, 8);
  const npcEventsHtml = npcEvents.length
    ? npcEvents.map(e => `<div style="margin-bottom:2px"><span style="color:var(--ink-faded)">Day ${e.day}:</span> ${e.text}</div>`).join('')
    : `<div style="color:var(--ink-faded);font-style:italic">Nothing notable yet.</div>`;

  // Relationships — sorted by |affinity|, so both strong devotion and
  // strong odium surface first rather than getting buried under a long
  // tail of near-zero acquaintances. Capped to the top handful for
  // readability; the full sparse map can be much larger for a
  // well-connected old NPC.
  const relRows = [...npc.relations.entries()]
    .sort((a, b) => Math.abs(b[1].affinity) - Math.abs(a[1].affinity))
    .slice(0, 8)
    .map(([id, rec]) => {
      const other = world.npcs.get(id);
      if (!other) return '';
      const color = rec.affinity > 0 ? '#2e7d32' : (rec.affinity < 0 ? '#8b3a1a' : 'var(--ink-faded)');
      const label = rec.affinity > 0.5 ? 'devoted' : rec.affinity > 0.15 ? 'fond' : rec.affinity < -0.5 ? 'hateful' : rec.affinity < -0.15 ? 'resentful' : 'neutral';
      return `<div style="display:flex;justify-content:space-between;font-size:0.72rem;margin-bottom:1px">
        <span>${other.name}</span>
        <span style="color:${color}">${rec.affinity>=0?'+':''}${rec.affinity.toFixed(2)} (${label})</span>
      </div>`;
    }).join('');
  const relationsHtml = relRows || `<div style="color:var(--ink-faded);font-style:italic;font-size:0.72rem">No relationships yet.</div>`;

  // Owned buildings — cross-references world.structures by ownedAssets,
  // same asset ids the inheritance/auction systems already key off.
  const ownedStructures = npc.ownedAssets
    .map(assetId => findStructureByAssetId(assetId))
    .filter(Boolean);
  const ownedHtml = ownedStructures.length
    ? ownedStructures.map(s => `<div style="font-size:0.72rem">${ASSET_TYPES[s.type]?.name ?? s.type}${s.type===npc.primaryHouse?' 🏠':''}</div>`).join('')
    : `<div style="color:var(--ink-faded);font-style:italic;font-size:0.72rem">Owns no buildings.</div>`;

  el.innerHTML = `
    <h2>${npc.name} — ${PROFESSIONS[npc.profession]?.name}${npc.currentAction === 'hired-labor' ? ' (hired out today)' : ''}</h2>
    ${constructionBanner}
    ${familySection}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px">
      <div style="padding:6px;background:var(--parchment-dark,#e8dcc0);border-radius:4px">
        <div style="font-style:italic;color:var(--ink-faded);font-size:0.7rem;margin-bottom:2px">Relationships</div>
        ${relationsHtml}
      </div>
      <div style="padding:6px;background:var(--parchment-dark,#e8dcc0);border-radius:4px">
        <div style="font-style:italic;color:var(--ink-faded);font-size:0.7rem;margin-bottom:2px">Owned buildings</div>
        ${ownedHtml}
      </div>
    </div>
    <div style="margin-bottom:8px">
      <div style="font-size:0.7rem;font-style:italic;color:var(--ink-faded);margin-bottom:2px">Needs</div>
      ${needsHTML}
    </div>
    <div class="inspector-grid">
      <div class="stat-box"><div class="stat-label">Savings</div><div class="stat-value">${npc.savings.toFixed(1)}¢</div></div>
      <div class="stat-box"><div class="stat-label">Capital</div><div class="stat-value">${npc.capital.toFixed(1)}</div></div>
      <div class="stat-box"><div class="stat-label">Energy</div><div class="stat-value">${npc.energy.toFixed(0)}</div></div>
      <div class="stat-box"><div class="stat-label">Age</div><div class="stat-value">${(npc.age/DOG_YEAR_DAYS).toFixed(1)}${npc.starvingDays > 0 ? ` <span style="color:#8b3a1a;font-size:0.65rem">(${npc.starvingDays}d hungry)</span>` : ''}</div></div>
      <div class="stat-box"><div class="stat-label">λ (coin value)</div><div class="stat-value">${lam}</div></div>
    </div>
    <div style="font-size:0.7rem;color:var(--ink-faded);margin-bottom:6px">${invStr}</div>
    <div style="margin-bottom:8px">
      <div style="font-size:0.7rem;font-style:italic;color:var(--ink-faded);margin-bottom:2px">Time use (avg, last 14 days)</div>
      ${timeUseHtml}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
      <div>
        <div style="font-size:0.7rem;font-style:italic;color:var(--ink-faded);margin-bottom:2px">Profession EVs</div>
        <table class="ev-table"><thead><tr><th>Profession</th><th>EV/hr</th><th style="font-size:0.65rem">price signals</th></tr></thead><tbody>${evRows}</tbody></table>
      </div>
      <div>
        <div style="font-size:0.7rem;font-style:italic;color:var(--ink-faded);margin-bottom:2px">Top actions today</div>
        <table class="ev-table"><thead><tr><th>Action</th><th>U/hr</th></tr></thead><tbody>${actionRows}</tbody></table>
      </div>
    </div>
    <div style="margin-top:8px">
      <div style="font-size:0.7rem;font-style:italic;color:var(--ink-faded);margin-bottom:2px">Recent events</div>
      <div style="font-size:0.7rem;max-height:140px;overflow-y:auto">${npcEventsHtml}</div>
    </div>`;
}

// ─────────────────────────────────────────────

// REMOVED: the old buildStructure()/btn-build-* system let the PLAYER
// manually insert a mill/forge/workshop by levying the richest NPC's
// savings — a mechanic that predates and directly conflicts with the new
// autonomous construction system, where individual NPCs decide for
// themselves whether building a new asset is worth it (computeConstructionEV)
// and finance it out of their own real goods (startConstruction). Keeping
// both would let a player artificially force capacity into existence
// that has nothing to do with the village's actual economic signals,
// undermining the whole point of the fix. Villagers now build their own
// infrastructure; the player observes and can still tune productivity
// (see the sliders in updateInfraPanel below) but no longer places
// buildings directly. The onclick handlers are removed along with it —
// if the corresponding buttons still exist in the HTML, they're now
// inert; consider removing them from the markup in a future pass.


function setBuildingProductivity(type, value) {
  BUILDING_PRODUCTIVITY[type] = parseFloat(value);
  const label = document.getElementById('prod-label-' + type);
  if (label) label.textContent = parseFloat(value).toFixed(2) + 'x';
}

const TIME_USE_LABELS = {
  work: 'Own trade', 'hired-labor': 'Hired labor', market: 'Market',
  rest: 'Rest', socialize: 'Socialize', tinker: 'Tinkering',
  church: 'Church', 'list-asset-sale': 'Selling asset', 'delist-asset-sale': 'Delisting asset',
};
const TIME_USE_COLORS = {
  work: '#5a7a3a', 'hired-labor': '#8b5a2a', market: '#c9a227',
  rest: '#7a7a7a', socialize: '#5a478b', tinker: '#2a6a8b',
  church: '#8b2a5a', 'list-asset-sale': '#c0392b', 'delist-asset-sale': '#27ae60',
};

function renderTimeUseBar(byAction, totalHoursOverride) {
  const total = totalHoursOverride ?? Object.values(byAction).reduce((s,v)=>s+v,0);
  if (total <= 0) return '<div style="font-size:0.7rem;color:var(--ink-faded)">No data yet.</div>';
  const entries = Object.entries(byAction).sort((a,b)=>b[1]-a[1]);
  const segments = entries.map(([id,hrs]) => {
    const pct = (hrs/total*100);
    const color = TIME_USE_COLORS[id] || '#999';
    return `<div style="width:${pct}%;background:${color}" title="${TIME_USE_LABELS[id]||id}: ${hrs.toFixed(1)}h"></div>`;
  }).join('');
  const legend = entries.map(([id,hrs]) => {
    const pct = (hrs/total*100).toFixed(0);
    const color = TIME_USE_COLORS[id] || '#999';
    return `<span style="display:inline-flex;align-items:center;gap:3px;margin-right:8px;font-size:0.68rem;color:var(--ink-faded)">
      <span style="width:8px;height:8px;background:${color};border-radius:2px;display:inline-block"></span>
      ${TIME_USE_LABELS[id]||id} ${pct}%
    </span>`;
  }).join('');
  return `
    <div style="display:flex;height:14px;border-radius:3px;overflow:hidden;margin-bottom:4px">${segments}</div>
    <div>${legend}</div>`;
}

function updateTimeUsePanel() {
  const el = document.getElementById('time-use-aggregate');
  if (!el) return;
  const latest = world.timeUseHistory[world.timeUseHistory.length - 1];
  if (!latest) { el.innerHTML = '<div style="font-size:0.7rem;color:var(--ink-faded)">No data yet.</div>'; return; }
  el.innerHTML = renderTimeUseBar(latest.byAction);
}

function updateInfraPanel() {
  const el = document.getElementById('infra-status');
  if (!el) return;
  const all = [
    { type:'mill',     label:'Mill',     unlocks:'Miller' },
    { type:'forge',    label:'Forge',    unlocks:'Toolmaker' },
    { type:'workshop', label:'Workshop', unlocks:'Artisan' },
    { type:'market',   label:'Market',   unlocks:'Trade' },
  ];

  // Villagers now build their own infrastructure autonomously (see
  // startConstruction/completeConstruction) when a profession's price
  // signal makes it worthwhile — this panel is now purely observational:
  // how many of each asset exist, and what's currently under construction
  // village-wide. The player can no longer place buildings directly, but
  // can still tune realized productivity via the sliders below, same as
  // before.
  const assetCounts = {};
  for (const asset of world.assets.values()) {
    assetCounts[asset.type] = (assetCounts[asset.type] || 0) + 1;
  }
  const inProgress = [...world.npcs.values()]
    .filter(n => n.constructionProject)
    .map(n => ({ npc: n, proj: n.constructionProject }));

  const rows = all.map(s => {
    const count = assetCounts[s.type] ?? ([...world.structures.values()].some(b => b.type === s.type) ? 1 : 0);
    const built = count > 0;
    const icon = built ? '✔' : '✘';
    const color = built ? '#5a7a3a' : '#8b3a1a';
    const countNote = s.type !== 'market' ? ` <span style="color:var(--ink-faded)">(${count} in use)</span>` : '';
    const hasSlider = built && BUILDING_PRODUCTIVITY[s.type] !== undefined;
    const slider = hasSlider ? `
      <div style="display:flex;align-items:center;gap:6px;margin:2px 0 8px 0">
        <input type="range" min="0.2" max="2.0" step="0.05"
          value="${BUILDING_PRODUCTIVITY[s.type]}"
          oninput="setBuildingProductivity('${s.type}', this.value)"
          style="flex:1">
        <span id="prod-label-${s.type}" style="font-size:0.7rem;color:var(--ink-faded);min-width:34px">${BUILDING_PRODUCTIVITY[s.type].toFixed(2)}x</span>
      </div>` : '';
    return `<div style="margin-bottom:3px">
      <div style="display:flex;justify-content:space-between">
        <span><span style="color:${color};font-weight:600">${icon}</span> ${s.label}${countNote}</span>
        <span style="color:var(--ink-faded);font-size:0.7rem">unlocks ${s.unlocks}</span>
      </div>
      ${slider}
    </div>`;
  }).join('');

  const projectRows = inProgress.length > 0 ? `
    <div style="margin-top:8px;padding-top:6px;border-top:1px solid #6b4c3b">
      <div style="font-size:0.7rem;font-style:italic;color:var(--ink-faded);margin-bottom:3px">Under construction</div>
      ${inProgress.map(({npc,proj}) => `
        <div style="font-size:0.72rem;display:flex;justify-content:space-between">
          <span>🔨 ${npc.name} — ${ASSET_TYPES[proj.assetType].name}</span>
          <span style="color:var(--ink-faded)">${(proj.laborHoursDone / CONSTRUCTION_HOURS_PER_DAY).toFixed(1)}/${(proj.laborHoursNeeded / CONSTRUCTION_HOURS_PER_DAY).toFixed(0)}d labor</span>
        </div>`).join('')}
    </div>` : '';

  el.innerHTML = rows + projectRows;
}

// GAME LOOP
// ─────────────────────────────────────────────

let simTickMs = 0; // paused
let accumulator = 0;
let lastTime = 0;

document.getElementById('btn-pause').onclick = function() {
  simTickMs = 0;
  document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));
  this.classList.add('active');
};
document.getElementById('btn-1x').onclick = function() {
  simTickMs = 600;
  document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));
  this.classList.add('active');
};
document.getElementById('btn-5x').onclick = function() {
  simTickMs = 120;
  document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));
  this.classList.add('active');
};
document.getElementById('btn-20x').onclick = function() {
  simTickMs = 30;
  document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));
  this.classList.add('active');
};

function gameLoop(ts) {
  const dt = ts - lastTime;
  lastTime = ts;

  if (simTickMs > 0) {
    accumulator += dt;
    let ticks = 0;
    while (accumulator >= simTickMs && ticks < 10) {
      tickDay();
      accumulator -= simTickMs;
      ticks++;
    }
  }

  drawScene(accumulator / (simTickMs||600));

  if (world.day % 1 === 0) updateUI(); // update every day

  requestAnimationFrame(gameLoop);
}

// Canvas click to select NPCs or buildings
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  let closest = null, closestDist = 20;
  for (const npc of world.npcs.values()) {
    const d = Math.hypot(npc.x - mx, npc.y - my);
    if (d < closestDist) { closestDist = d; closest = npc.id; }
  }

  if (closest !== null) {
    selectedNPC = closest;
    selectedStructure = null;
    updateUI();
    switchToInspector();
    return;
  }

  // No NPC hit — check structures (simple radius test around each
  // building's pixel center; good enough at this footprint scale).
  let closestS = null, closestSDist = 18;
  for (const s of world.structures.values()) {
    const d = Math.hypot(s.x - mx, s.y - my);
    if (d < closestSDist) { closestSDist = d; closestS = s.id; }
  }
  if (closestS !== null) {
    selectedStructure = closestS;
    selectedNPC = null;
    updateUI();
    switchToInspector();
  }
});

// Helpers
function clamp(v,lo,hi) { return Math.max(lo,Math.min(hi,v)); }

// Initial UI draw and start loop
updateUI();
requestAnimationFrame(gameLoop);
// ── Tab switching ────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + target).classList.add('active');
  });
});

function switchToInspector() {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-tab="inspector"]').classList.add('active');
  document.getElementById('tab-inspector').classList.add('active');
}

</script>
</body>
</html>

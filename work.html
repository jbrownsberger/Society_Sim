<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamlet Simulation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Crimson+Pro:wght@300;400;600&display=swap');

  :root {
    --parchment: #f2e8d5;
    --parchment-dark: #e8d9bc;
    --ink: #2c1810;
    --ink-faded: #6b4c3b;
    --accent: #8b3a1a;
    --accent-light: #c4622d;
    --grass: #5a7a3a;
    --grass-light: #7a9a5a;
    --water: #4a7a9b;
    --stone: #8a8070;
    --panel-bg: rgba(242, 232, 213, 0.97);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--ink);
    font-family: 'Crimson Pro', serif;
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: var(--ink);
    color: var(--parchment);
    padding: 8px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--accent);
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'IM Fell English', serif;
    font-size: 1.4rem;
    letter-spacing: 0.05em;
  }

  .header-info {
    display: flex;
    gap: 24px;
    font-size: 0.9rem;
    color: var(--parchment-dark);
  }

  .header-info span { font-family: 'Crimson Pro', serif; }
  .header-info strong { color: var(--parchment); font-weight: 600; }

  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  button {
    font-family: 'Crimson Pro', serif;
    font-size: 0.85rem;
    padding: 4px 12px;
    background: transparent;
    color: var(--parchment);
    border: 1px solid var(--ink-faded);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }

  button:hover { background: var(--accent); border-color: var(--accent); }
  button.active { background: var(--accent); border-color: var(--accent-light); }

  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  canvas {
    flex-shrink: 0;
    display: block;
  }

  .sidebar {
    width: 320px;
    flex-shrink: 0;
    background: var(--parchment);
    border-left: 2px solid var(--accent);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel {
    border-bottom: 1px solid var(--parchment-dark);
    padding: 10px 14px;
    flex-shrink: 0;
  }

  .panel h2 {
    font-family: 'IM Fell English', serif;
    font-size: 0.95rem;
    color: var(--accent);
    margin-bottom: 8px;
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--parchment-dark);
    padding-bottom: 4px;
  }

  .market-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
  }

  .market-item {
    background: var(--parchment-dark);
    padding: 5px 7px;
    border-radius: 2px;
  }

  .market-item .good-name {
    font-size: 0.7rem;
    color: var(--ink-faded);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .market-item .good-price {
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
  }

  .market-item .good-unmet {
    font-size: 0.7rem;
    color: var(--accent);
  }

  .sparkline-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
  }

  .sparkline-label {
    width: 60px;
    font-size: 0.75rem;
    color: var(--ink-faded);
  }

  .npc-list {
    overflow-y: auto;
    flex: 1;
  }

  .npc-item {
    padding: 8px 14px;
    border-bottom: 1px solid var(--parchment-dark);
    cursor: pointer;
    transition: background 0.1s;
  }

  .npc-item:hover { background: var(--parchment-dark); }
  .npc-item.selected { background: #e8d0b0; }

  .npc-item .npc-name {
    font-family: 'IM Fell English', serif;
    font-size: 0.95rem;
    color: var(--ink);
  }

  .npc-item .npc-prof {
    font-size: 0.78rem;
    color: var(--ink-faded);
    font-style: italic;
  }

  .needs-bar-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
  }

  .needs-bar-label {
    width: 52px;
    font-size: 0.68rem;
    color: var(--ink-faded);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .needs-bar-bg {
    flex: 1;
    height: 5px;
    background: var(--parchment-dark);
    border-radius: 2px;
    overflow: hidden;
  }

  .needs-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s;
  }

  /* Inspector is now a full tab — styles moved to tab system section */

  .inspector-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    margin-bottom: 8px;
  }

  .stat-box {
    background: var(--parchment);
    padding: 5px 8px;
    border-radius: 2px;
  }

  .stat-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-faded);
  }

  .stat-value {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--ink);
  }

  .ev-table {
    width: 100%;
    font-size: 0.75rem;
    border-collapse: collapse;
    margin-top: 4px;
  }

  .ev-table th {
    text-align: left;
    color: var(--ink-faded);
    font-weight: 400;
    font-style: italic;
    padding: 2px 4px;
    border-bottom: 1px solid var(--parchment-dark);
  }

  .ev-table td {
    padding: 2px 4px;
    color: var(--ink);
  }

  .ev-table tr.current-prof td { color: var(--accent); font-weight: 600; }

  .log-panel {
    padding: 8px 14px;
    flex-shrink: 0;
    max-height: 120px;
    overflow-y: auto;
    border-top: 1px solid var(--parchment-dark);
    background: var(--parchment);
  }

  .log-panel h2 {
    font-family: 'IM Fell English', serif;
    font-size: 0.85rem;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .log-entry {
    font-size: 0.72rem;
    color: var(--ink-faded);
    line-height: 1.5;
    font-style: italic;
  }

  .log-entry .day-tag {
    color: var(--accent);
    font-style: normal;
    font-weight: 600;
    margin-right: 4px;
  }

  .season-tag {
    display: inline-block;
    padding: 1px 8px;
    font-size: 0.75rem;
    border-radius: 2px;
    font-style: italic;
  }

  /* ── Tab system ─────────────────────────────── */
  .tab-bar {
    display: flex;
    flex-shrink: 0;
    background: var(--parchment-dark);
    border-bottom: 2px solid var(--accent);
  }
  .tab-btn {
    flex: 1;
    padding: 7px 4px;
    font-family: 'IM Fell English', serif;
    font-size: 0.82rem;
    background: transparent;
    color: var(--ink-faded);
    border: none;
    border-right: 1px solid #d4c5a9;
    cursor: pointer;
    transition: all 0.12s;
    letter-spacing: 0.03em;
  }
  .tab-btn:last-child { border-right: none; }
  .tab-btn:hover { background: var(--parchment); color: var(--ink); }
  .tab-btn.active {
    background: var(--parchment);
    color: var(--accent);
    font-weight: 600;
    box-shadow: inset 0 -2px 0 var(--accent);
  }
  .tab-pane {
    display: none;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }
  .tab-pane.active { display: flex; }

  /* Inspector fills its tab */
  .inspector {
    padding: 10px 14px;
    overflow-y: auto;
    flex: 1;
    background: #ede0c8;
  }
  .inspector h2 {
    font-family: 'IM Fell English', serif;
    font-size: 0.95rem;
    color: var(--accent);
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>The Hamlet</h1>
  <div class="header-info">
    <span>Day <strong id="day-display">1</strong></span>
    <span id="season-display" class="season-tag">Spring</span>
    <span>Population <strong id="pop-display">10</strong></span>
  </div>
  <div class="controls">
    <button id="btn-pause" class="active">Pause</button>
    <button id="btn-1x">1×</button>
    <button id="btn-5x">5×</button>
    <button id="btn-20x">20×</button>
  </div>
</header>

<div class="main">
  <canvas id="world-canvas"></canvas>

  <div class="sidebar">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="economy">Economy</button>
      <button class="tab-btn" data-tab="people">People</button>
      <button class="tab-btn" data-tab="inspector">Inspector</button>
    </div>

    <!-- Economy tab: market, infrastructure, price history, event log -->
    <div class="tab-pane active" id="tab-economy">
      <div class="panel">
        <h2>Market Prices</h2>
        <div id="market-dividend-status" style="font-size:0.78rem;color:var(--ink-faded);margin-bottom:6px"></div>
        <div class="market-grid" id="market-grid"></div>
      </div>
      <div class="panel">
        <h2>Infrastructure</h2>
        <div id="infra-status" style="font-size:0.78rem;color:var(--ink-faded)"></div>
      </div>
      <div class="panel">
        <h2>Price History</h2>
        <canvas id="sparkline-canvas" width="290" height="80"></canvas>
      </div>
      <div class="log-panel" style="flex:1;max-height:none;overflow-y:auto;">
        <h2>Event Log</h2>
        <div id="event-log"></div>
      </div>
    </div>

    <!-- People tab: village-wide time-use breakdown + scrollable NPC list -->
    <div class="tab-pane" id="tab-people">
      <div class="panel">
        <h2>Demographics</h2>
        <div id="demographics-status" style="font-size:0.78rem;color:var(--ink-faded)"></div>
      </div>
      <div class="panel">
        <h2>Village Time Use</h2>
        <div style="font-size:0.7rem;color:var(--ink-faded);margin-bottom:4px">Hours/day, village-wide (most recent day)</div>
        <div id="time-use-aggregate"></div>
      </div>
      <div class="npc-list" id="npc-list" style="flex:1;overflow-y:auto;"></div>
    </div>

    <!-- Inspector tab: selected NPC detail -->
    <div class="tab-pane" id="tab-inspector">
      <div class="inspector" id="inspector">
        <h2>Inspector</h2>
        <p style="font-size:0.8rem;color:var(--ink-faded);font-style:italic;margin-top:4px;">
          Click a villager on the map or in the People tab.
        </p>
      </div>
    </div>

  </div>
</div>

<script>
// ─────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────

const GOODS = {
  grain:   { name:'Grain',        baseValue:6,  nutrition:0.15, comfortValue:0, perishRate:0.02,  color:'#c8a84b' }, // baseValue raised 3->6: grain was priced BELOW wood (4) despite being the food chain's foundational input (4 grain -> 12 bread @ baseValue 8). At the old value, farming looked worse than woodcutting even in calm/no-scarcity conditions, so farmers defected to woodcutting BEFORE any real grain shortage could push the price up to correct it — by the time scarcity pricing kicked in, farmer population had already collapsed past recovery. Verified via harness: with the old value, farmer count hit 0 by day 140 and the village went extinct by ~day 120 once the (separate, now-fixed) free-bread-production bug stopped masking the shortage.
  bread:   { name:'Bread',        baseValue:8,  nutrition:0.5, comfortValue:0, perishRate:0.15,  color:'#c47a3a' },
  wood:    { name:'Wood',         baseValue:4,  nutrition:0,   comfortValue:0, perishRate:0,     color:'#7a5a3a' },
  tools:   { name:'Tools',        baseValue:20, nutrition:0,   comfortValue:0, perishRate:0.003, color:'#808080' },
  luxury:  { name:'Fine Goods',   baseValue:15, nutrition:0,   comfortValue:0.5, perishRate:0.02, color:'#a5478b' },
};

// ─────────────────────────────────────────────
// ASSETS — ownable productive property
// ─────────────────────────────────────────────
//
// Replaces the old village-wide `requires: 'forge'` boolean gate with real,
// ownable, transferable (or non-transferable) property. An NPC can only
// work a profession that needs an asset if they personally own (and are
// actively operating) one, or are hired as labor by someone who does
// (hired labor arrives in a later stage).
//
// Two asset "families":
//   PHYSICAL  — farm, mill, forge, workshop. Transferable: can be sold,
//               inherited, auctioned, built by a Builder. Depreciates
//               slowly with use, improves slightly with investment
//               (future hook — not implemented yet in Stage 1).
//   SKILL     — toolmaking, milling, artisanry. NOT transferable — can
//               only be acquired by an NPC personally, currently still
//               via the existing trainingDays ramp, with a labor-market
//               learning path coming in a later stage.
//
// Every profession that needs a physical asset also needs the matching
// skill (npc.skills[profId]) to operate it at full efficiency — an owner
// with no skill can still hold title (and, later, hire a skilled laborer
// to run it), but personally working an asset they have no skill in
// produces at the same steep penalty effectiveSkill() already applies.

const ASSET_TYPES = {
  farm:     { name:'Farm',     profession:'farmer',    transferable:true,  baseQuality:1.0, buildCost:{wood:8},           buildDays:15 },
  mill:     { name:'Mill',     profession:'miller',    transferable:true,  baseQuality:1.0, buildCost:{wood:20},          buildDays:25 },
  forge:    { name:'Forge',    profession:'toolmaker', transferable:true,  baseQuality:1.0, buildCost:{wood:25},          buildDays:25 },
  workshop: { name:'Workshop', profession:'artisan',   transferable:true,  baseQuality:1.0, buildCost:{wood:20,grain:10}, buildDays:20 },
  house:    { name:'House',    profession:null,        transferable:true,  baseQuality:1.0, buildCost:{wood:15},          buildDays:12 },
};

// Types that are the physical seat of a profession (used to find "which
// asset type does profession X need" without house — which has no
// profession — accidentally matching anything).
const PRODUCTIVE_ASSET_TYPES = Object.keys(ASSET_TYPES).filter(t => ASSET_TYPES[t].profession);

// A hard ceiling on how many farms can ever exist — the deliberate,
// physical food-supply cap that makes population growth self-limiting.
// Arable land is finite; this is that fact, expressed as a number instead
// of an ever-elastic supply of new farms chasing demand. Tuned loosely to
// the starting village size — worth revisiting once population dynamics
// (marriage/children) are actually running and you can see where real
// pressure emerges.
const MAX_FARMS = 14;
function countAssetsOfType(type) {
  let n = 0;
  for (const a of world.assets.values()) if (a.type === type) n++;
  return n;
}
function countNpcsInProfession(profId) {
  let n = 0;
  for (const npc of world.npcs.values()) if (npc.profession === profId) n++;
  return n;
}

let nextAssetId = 0;
function makeAsset(type, ownerId) {
  const def = ASSET_TYPES[type];
  const id = nextAssetId++;
  return {
    id, type, ownerId,
    quality: def.baseQuality,
    transferable: def.transferable,
    capacity: 2,            // max simultaneous workers (owner + hired) — used from Stage 2 (labor market) onward
    employedLaborIds: [],   // hired NPC ids currently working this asset — populated from Stage 2 onward
    forSale: false,
    starvingStreak: 0,      // consecutive days the owner has been starving while holding this specific asset
    createdDay: world.day,
  };
}

// ─────────────────────────────────────────────
// STRUCTURES — the positional/visual counterpart to an asset
// ─────────────────────────────────────────────
//
// world.assets stays the sole economic authority (stock, ownerId, workers)
// and the sim runs identically headless with world.structures never
// touched. A structure is purely "where is this asset, and what's its
// build/ownership history" — nothing here feeds back into scoring.
//
// One structure per asset INSTANCE (not per type) — every mill, forge,
// house etc. gets its own tile, so multiple mills really do show as
// multiple buildings. assetId links a structure back to its economic
// record; for houses that link is still to a (non-productive) asset,
// see ASSET_TYPES.house, so ownership/inheritance code can treat every
// owned thing — productive or not — uniformly.

const GRID_CELL = 22;           // px per tile
const GRID_ANCHOR = { gx: 18, gy: 14 }; // town-center tile, spiral search starts here
const FOOTPRINTS = {
  market: 2, well: 1, mill: 2, forge: 2, workshop: 2, church: 2,
  farm: 2, house: 1,
};

function gridKey(gx, gy) { return gx + ',' + gy; }

// Expanding ring search outward from the anchor for the first tile (or
// block of tiles, for footprint>1) not already occupied. Deterministic
// and simple — fine at hamlet scale; a fancier packing can replace this
// later without touching anything that reads world.structures.
function findFreeGridSpot(footprint, anchorGx = GRID_ANCHOR.gx, anchorGy = GRID_ANCHOR.gy) {
  const occupied = world.gridOccupied; // Set of "gx,gy" keys
  const fits = (gx, gy) => {
    for (let dx = 0; dx < footprint; dx++)
      for (let dy = 0; dy < footprint; dy++)
        if (occupied.has(gridKey(gx + dx, gy + dy))) return false;
    return true;
  };
  for (let radius = 0; radius < 40; radius++) {
    for (let dx = -radius; dx <= radius; dx++) {
      for (let dy = -radius; dy <= radius; dy++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== radius) continue; // ring only
        const gx = anchorGx + dx, gy = anchorGy + dy;
        if (fits(gx, gy)) return { gx, gy };
      }
    }
  }
  return { gx: anchorGx, gy: anchorGy }; // fallback: overlap rather than fail
}

function occupyGrid(gx, gy, footprint) {
  for (let dx = 0; dx < footprint; dx++)
    for (let dy = 0; dy < footprint; dy++)
      world.gridOccupied.add(gridKey(gx + dx, gy + dy));
}

let nextStructureId = 0;
function createStructure(type, ownerId, assetId, anchor) {
  const footprint = FOOTPRINTS[type] ?? 1;
  const { gx, gy } = anchor
    ? findFreeGridSpot(footprint, anchor.gx, anchor.gy)
    : findFreeGridSpot(footprint);
  occupyGrid(gx, gy, footprint);
  const structure = {
    id: nextStructureId++, type, assetId, ownerId,
    gx, gy, footprint,
    x: gx * GRID_CELL, y: gy * GRID_CELL, // pixel position, cached for the renderer
    label: ASSET_TYPES[type]?.name ?? type,
    history: [{ day: world.day, event: 'built', ownerId }],
  };
  world.structures.set(structure.id, structure);
  return structure;
}

function findStructureByAssetId(assetId) {
  for (const s of world.structures.values()) if (s.assetId === assetId) return s;
  return null;
}
function findStructureByType(type) {
  for (const s of world.structures.values()) if (s.type === type) return s;
  return null;
}

function recordStructureTransfer(structure, fromId, toId, event = 'sold') {
  if (!structure) return;
  structure.ownerId = toId;
  structure.history.push({ day: world.day, event, fromId, toId });
}

// Creates BOTH the economic asset and its paired structure in one call —
// the only place either should ever be created, so they can't drift out
// of sync the way world.buildings/world.assets did before this refactor.
// `anchor` optionally biases placement (e.g. a house near its owner's
// existing home) — omit for "nearest free spot to town center."
function createOwnedAsset(type, ownerId, anchor) {
  const asset = makeAsset(type, ownerId);
  world.assets.set(asset.id, asset);
  const structure = createStructure(type, ownerId, asset.id, anchor);
  return { asset, structure };
}

// Seed starting assets matching the existing profDist, so every asset-
// gated profession (farmer, miller, toolmaker, artisan) has a backing
// asset from day one, AND every NPC gets a starting house (shelter is
// required for full rest — see housingQuality()). Woodcutting needs no
// productive asset (commons resource), but still gets a house.
function seedAssets() {
  for (const npc of world.npcs.values()) {
    const prof = npc.profession;
    const assetType = PRODUCTIVE_ASSET_TYPES.find(t => ASSET_TYPES[t].profession === prof);
    if (assetType) {
      const { asset, structure } = createOwnedAsset(assetType, npc.id);
      npc.ownedAssets.push(asset.id);
      npc.primaryAsset = asset.id;
    }

    const { asset: house, structure: houseStructure } = createOwnedAsset('house', npc.id);
    npc.ownedAssets.push(house.id);
    npc.primaryHouse = house.id;
    // Anchor the NPC's homeX/homeY (used all over movement/rendering) to
    // where their house actually got placed, instead of the old random
    // scatter point.
    npc.homeX = houseStructure.x;
    npc.homeY = houseStructure.y;
  }
}

// Returns true if this NPC can currently work `profId` — either the
// profession needs no physical asset (woodcutter), or the NPC personally
// owns an asset of the matching type and has it set as their primary
// (i.e., the one they operate themselves, vs. one they merely hold title
// to and staff with hired labor — see Stage 2).
function hasWorkableAsset(npc, profId) {
  const assetType = Object.keys(ASSET_TYPES).find(t => ASSET_TYPES[t].profession === profId);
  if (!assetType) return true;
  if (npc.primaryAsset === null || npc.primaryAsset === undefined) return false;
  const asset = world.assets.get(npc.primaryAsset);
  return !!asset && asset.type === assetType && asset.ownerId === npc.id;
}

const PROFESSIONS = {
  farmer:     { name:'Farmer',     outputs:{grain:8},  inputs:{},          requires:null,      capitalGood:'tools', laborHours:8, materialsCost:3,  trainingCost:0,  trainingDays:5  }, // output 5->8: worked backward from the target — a 48-person village needs ~96 bread/day (2/person), which needs ~32 grain/day (4 grain -> 12 bread via milling). If 1/4 of total village hours go to farming (half the time of half the people — 72 of 288 daily village-hours at pop 48), that's 72/6=12 sessions/day. At the OLD output of 5 grain/session that's 60 grain/day (already ~2x need on paper), but per-hour revenue was too thin to make farming competitive against a specialized miller's capital-boosted margin — see profSessionEV. At 8 grain/session, the same 12 sessions produce 96 grain/day (3x need) AND farming's per-hour revenue rises proportionally, directly narrowing the gap against milling in the EV comparison that was driving the specialist trap.
  woodcutter: { name:'Woodcutter', outputs:{wood:4},   inputs:{},          requires:null,      capitalGood:'tools', laborHours:8, materialsCost:3,  trainingCost:0,  trainingDays:5  },
  miller:     { name:'Miller',     outputs:{bread:12}, inputs:{grain:4},   requires:'mill',    capitalGood:null,    laborHours:7, materialsCost:10, trainingCost:15, trainingDays:20 }, // output doubled 6->12: mills were structurally undersized relative to village-wide bread demand
  toolmaker:  { name:'Toolmaker',  outputs:{tools:0.5},inputs:{wood:2},    requires:'forge',   capitalGood:null,    laborHours:8, materialsCost:15, trainingCost:20, trainingDays:25 },
  artisan:    { name:'Artisan',    outputs:{luxury:4}, inputs:{grain:2,wood:3}, requires:'workshop', capitalGood:null, laborHours:7, materialsCost:15, trainingCost:25, trainingDays:25 },
};
// Switching used to be one flat coin cost, deducted and gone. Now it's
// three separate, more legible things:
//   materialsCost — tools/setup, paid to the Market (buys into its tools
//     cash pool — a real purchase, not a sink)
//   trainingCost  — paid to whoever currently practices (or most recently
//     practiced) the target trade, split evenly. A wealth transfer, not a
//     sink — masters get paid by their apprentices. If literally nobody
//     has ever practiced it, there's no one to pay and this is waived
//     (you're the pioneer).
//   trainingDays  — after switching, output ramps up from 30% to 100% of
//     the NPC's innate skill over this many days (see effectiveSkill()).
//     This is a real, felt cost during the transition, and it's the one
//     considerProfessionSwitch has to actually reason about, not just pay.
// Miller and artisan outputs were originally tuned 1:1-ish with their raw
// inputs (3 bread per 2 grain; 1 luxury per 1 grain + 2 wood). That reads
// fine on paper but breaks in practice: at typical skill (0.2–0.6 for a
// newly-learned trade), a session nets LESS than the producer's own daily
// consumption buffer for that good (2 bread/day, 1 luxury/day) — meaning
// a lone miller or artisan can't even feed/comfort themselves from their
// own work, let alone leave anything over to sell. Farmers/woodcutters
// never hit this because their output-per-session already runs 3-6x their
// own buffer target. Scaling miller/artisan output up (same input ratio
// for miller, a richer ratio for artisan reflecting skilled value-add)
// gives them the same kind of surplus headroom.

// Player-tunable productivity multiplier per building type. 1.0 = baseline
// (no change from stock behavior). Applied as a straight multiplier on a
// worker's output alongside their skill and capital-good bonus — see
// buildingProductivity() below and its call sites in profSessionEV() and
// buildSchedule(). Exposed live in the Infrastructure panel via sliders.
const BUILDING_PRODUCTIVITY = {
  mill: 1.0,
  forge: 1.0,
  workshop: 1.0,
};

function buildingProductivity(profId) {
  const req = PROFESSIONS[profId]?.requires;
  return req ? (BUILDING_PRODUCTIVITY[req] ?? 1.0) : 1.0;
}

// ─────────────────────────────────────────────
// PRESTIGE — standing in the village.
// ─────────────────────────────────────────────
// A profession's inherent status, independent of how well any individual
// NPC happens to be doing at it — skilled/gated trades (miller, toolmaker,
// artisan, all requiring a building and real training investment) read as
// higher-status than subsistence trades (farmer, woodcutter), matching
// the ask. This is a flat per-profession constant, not derived from
// current wages, so it doesn't double-count with the wealth term below.
const PROFESSION_PRESTIGE = {
  woodcutter: 0.05,
  farmer:     0.10,
  miller:     0.20,
  toolmaker:  0.28,
  artisan:    0.35,
};
// Diminishing-returns wealth contribution (log, not linear — the 10th
// coin matters far more to standing than the 1000th) and a small bonus
// per owned productive asset/building (ownership of capital reads as
// status independent of the cash sitting in savings). Both capped so
// prestige stays a bounded [0,1] need like everything else, and reuse
// npc.ownedAssets (already tracked at the NPC level) rather than scanning
// world.assets.
const PRESTIGE_WEALTH_LOG_SCALE = 0.045;
const PRESTIGE_WEALTH_CAP       = 0.40;
const PRESTIGE_PER_ASSET        = 0.07;
const PRESTIGE_ASSET_CAP        = 0.25;
// How fast the composite need actually chases this target — deliberately
// slower than familyChannel's 0.08/day (see NEEDS.prestige comment):
// reputation should visibly lag a windfall or a bad turn, not snap to it.
const PRESTIGE_CONVERGENCE_RATE = 0.035;
// Granting help is itself a (smaller, separate) prestige event — visible
// generosity reads as status, same instinct as patronage/noblesse oblige.
// Kept as its own tunable constant rather than folded into prestigeTarget
// so the two effects (standing wealth/profession vs. an act of giving)
// can be isolated and tuned independently.
const PRESTIGE_HELP_GAIN = 0.03;

function prestigeTarget(npc) {
  const professionPart = PROFESSION_PRESTIGE[npc.profession] ?? 0;
  const wealthPart = Math.min(PRESTIGE_WEALTH_CAP, Math.log1p(Math.max(0, npc.savings)) * PRESTIGE_WEALTH_LOG_SCALE);
  const assetPart  = Math.min(PRESTIGE_ASSET_CAP, (npc.ownedAssets?.length ?? 0) * PRESTIGE_PER_ASSET);
  return clamp(professionPart + wealthPart + assetPart, 0, 1);
}

// ─────────────────────────────────────────────
// NEEDS REGISTRY — the single place a need's identity lives.
// ─────────────────────────────────────────────
// Every need is the same shape: a [0,1] level, a weight (how much it
// matters), a decay rate (entropy — needs fade if not tended), and two
// flags that drive the versatility this whole decision system is built
// around:
//   starvationFloor — if >0, this need has a real survival cliff. Falling
//     below it (a) makes its marginal utility spike sharply (see
//     needMarginalUtility below) so relieving it dominates any competing
//     use of the same resource, and (b) triggers an out-of-cycle
//     emergency replan mid-week (see emergencyReplanNeeded), instead of
//     waiting for the NPC's next scheduled planning day.
//   critical — if true, this need's own consumption goods (e.g. bread for
//     food) always keep a fixed daily-intake reserve, no matter how
//     "satisfied" the need currently reads — you eat on a schedule, not
//     only when hungry. If false, this need is discretionary: goods that
//     satisfy it (e.g. fine goods for comfort) are only reserved for
//     personal consumption when doing so is actually worth more than
//     selling them for cash — see shouldKeepForConsumption. This is what
//     lets a starving artisan correctly choose to sell fine goods for
//     food money instead of self-comforting while starving, without any
//     hardcoded "if food is urgent, override comfort" rule anywhere.
// Adding a new need (e.g. "status") means adding one entry here. Nothing
// else in shadowPriceGood, scoreAction, lambda, or the planner needs to
// change for the new need to be correctly weighed against every existing
// one.
const NEEDS = {
  // selfManaged: true means this need already gets a COMPLETE update
  // elsewhere in satisfyNeeds -- a ratio-centered-on-0.5 formula like
  // `food += (foodRatio - 0.5) * 0.15` that bakes its own decay AND gain
  // into one expression (ratio=0 -> lose half the swing, ratio=1 -> gain
  // half the swing). decayPerDay for these is descriptive documentation
  // of that baked-in rate, not a second deduction to separately apply --
  // the generic decay loop below skips them entirely. social and meaning
  // have no such self-contained formula (social's wood-warmth block only
  // ever ADDS, never subtracts; meaning has no other update in
  // satisfyNeeds at all), so decayPerDay is their ONLY decay mechanism
  // and the generic loop is what actually applies it.
  food:     { weight:100, decayPerDay:0.04,  starvationFloor:0.15, critical:true,  selfManaged:true  },
  security: { weight:40,  decayPerDay:0.01,  starvationFloor:0,    critical:true,  selfManaged:true  },
  comfort:  { weight:25,  decayPerDay:0.015, starvationFloor:0,    critical:false, selfManaged:true  },
  // social flipped to selfManaged: it now gets one complete daily update
  // (activity channel + family channel, combined and decayed below in
  // satisfyNeeds) instead of a raw accumulator + generic decay. Leaving
  // it selfManaged:false while ALSO giving it a complete formula would
  // double-decay it — exactly the food-decay bug class from before.
  social:   { weight:15,  decayPerDay:0.02,  starvationFloor:0,    critical:false, selfManaged:true  },
  // Bumped 8->20: meaning was structurally the least-weighted need by a
  // wide margin, making it nearly irrelevant to any decision. With family
  // now feeding it a real trickle (see familyChannelTarget), it's worth
  // it actually mattering in the scoring.
  meaning:  { weight:20,  decayPerDay:0.01,  starvationFloor:0,    critical:false, selfManaged:false },
  // Prestige: standing in the village, from wealth, owned productive
  // assets, and the skill tier of one's profession. selfManaged:true —
  // it has one complete convergence-toward-target update in satisfyNeeds
  // (see prestigeTarget), same pattern as comfort/family. Deliberately a
  // SLOW convergence (see PRESTIGE_CONVERGENCE_RATE) — a windfall
  // shouldn't instantly buy status; reputation lags wealth. Non-critical:
  // low prestige is a social discomfort, not a survival cliff.
  prestige: { weight:18,  decayPerDay:0,     starvationFloor:0,    critical:false, selfManaged:true  },
};

// Fine goods alone cap OUT at these fractions of full comfort/social —
// the remainder can only be closed by family (marriage/children). This is
// what makes marriage an economic necessity, not just a nice-to-have: a
// wealthy hermit and a modest married household are no longer both able
// to reach full comfort/social satisfaction through their own channel
// alone. Each need is modeled as two independently-tracked channels
// (see npc.materialComfort/activitySocial + npc.familyChannel, combined
// in satisfyNeeds) rather than one scalar, so the cap falls naturally out
// of a weighted sum instead of a hard ceiling bolted onto scoring.
const MATERIAL_COMFORT_CAP = 0.55; // fine goods can fill up to 55% of comfort on their own
const ACTIVITY_SOCIAL_CAP  = 0.55; // socializing can fill up to 55% of social on their own
// How strongly family status closes the remaining gap. A spouse alone
// gets partway there; each child closes more of what's left, with
// diminishing per-child returns (same diminishing-marginal-utility
// principle as everywhere else) — a first child changes a household's
// social/comfort life far more than a fourth one does.
const FAMILY_CHANNEL_SPOUSE_BONUS = 0.55;
const FAMILY_CHANNEL_PER_CHILD    = 0.18;
const FAMILY_MEANING_RATE = 0.02; // daily meaning trickle, scaled by familyChannelTarget()

// Moved up from the marriage/childbirth section below: makeNPC (called
// during initial world seeding, well before that section of the file
// runs) needs these to set every NPC's lifespan at creation.
const CHILDHOOD_DAYS = 150; // "dog years" for now — 3 (fast) years at 50 days/year, so multi-generational dynamics are actually observable in a normal test run. Trivial to dial back up to a realistic childhood once the mechanics are validated.
const DOG_YEAR_DAYS = CHILDHOOD_DAYS / 3; // for age display — a child "turns 1" every DOG_YEAR_DAYS days
const OLD_AGE_MIN_DOGYEARS = 10; // each NPC's actual lifespan is sampled once (see makeNPC) between these two, so deaths spread out naturally instead of everyone dying in the same week
const OLD_AGE_MAX_DOGYEARS = 12;

// How much of full comfort/social/meaning a household currently provides,
// from 0 (single, childless) approaching 1 (married with several kids).
// Purely a function of composition — the day-to-day channel trackers
// (npc.familyChannel) converge toward this smoothly rather than jumping,
// so gaining/losing a spouse or child reads as a real transition, not an
// instant snap.
function familyTargetFromComposition(hasSpouse, numChildren) {
  const childContribution = 1 - Math.pow(1 - FAMILY_CHANNEL_PER_CHILD, numChildren);
  const spouseContribution = hasSpouse ? FAMILY_CHANNEL_SPOUSE_BONUS : 0;
  return clamp(spouseContribution + (1 - spouseContribution) * childContribution, 0, 1);
}
function familyChannelTarget(npc) {
  const hasSpouse = npc.spouseId != null && world.npcs.has(npc.spouseId);
  const n = npc.childIds ? npc.childIds.length : 0;
  return familyTargetFromComposition(hasSpouse, n);
}

// Marginal utility of one more unit of `need`, right now, for this NPC.
// Same formula for every need — diminishing returns via 1/(1+level) — plus
// a cliff multiplier once a need with a starvationFloor drops below it.
// The cliff is deliberately bounded (max ~4x) rather than unbounded, so a
// crisis reorders priorities decisively without blowing up the overall
// magnitude of utility/lambda the rest of the economy is calibrated
// around.
// Does this NPC currently have a roof over their head? Required for full
// rest satisfaction — a homeless NPC can still rest (there's always
// somewhere to lie down), but recovers less energy and gets less of the
// comfort/social/meaning trickle than someone resting in their own house.
// Deliberately NOT zero at 0 shelter: total collapse of rest would make
// homelessness a death spiral (can't rest -> can't work -> can't afford
// a house) rather than the hardship it should read as.
const HOMELESS_REST_PENALTY = 0.45; // fraction of full rest value while unhoused
function housingQuality(npc) {
  if (npc.primaryHouse != null) {
    const house = world.assets.get(npc.primaryHouse);
    if (house && house.ownerId === npc.id) return 1.0;
  }
  // Married and living in a spouse's house (see marryCouple, which nulls
  // out the moved-in partner's own primaryHouse once consolidated into
  // one household) — still sheltered, just not the owner of record.
  if (npc.spouseId != null) {
    const spouse = world.npcs.get(npc.spouseId);
    if (spouse && spouse.primaryHouse != null) {
      const house = world.assets.get(spouse.primaryHouse);
      if (house && house.ownerId === spouse.id) return 1.0;
    }
  }
  return HOMELESS_REST_PENALTY;
}

function needMarginalUtility(npc, need) {
  const cfg = NEEDS[need];
  if (!cfg) return 0;
  const level = npc.needs[need] ?? 0;
  let mu = cfg.weight / (1 + level);
  if (cfg.starvationFloor > 0 && level < cfg.starvationFloor) {
    const severity = (cfg.starvationFloor - level) / cfg.starvationFloor; // 0..1
    mu *= 1 + severity * 3; // up to ~4x at the very bottom
  }
  return mu;
}

// Any need whose starvationFloor is currently breached demands an
// immediate replan rather than waiting for the NPC's next scheduled
// planning day (see buildSchedule) — the generalized escape hatch.
function emergencyReplanNeeded(npc) {
  for (const [need, cfg] of Object.entries(NEEDS)) {
    if (cfg.starvationFloor > 0 && (npc.needs[need] ?? 0) < cfg.starvationFloor) return true;
  }
  // A pending help request directed at ME won't otherwise be considered
  // until my next regular weekly planning day — which can be longer than
  // HELP_REQUEST_EXPIRY_DAYS (3 days). Verified via harness trace: 'help'
  // actions that scored as the clear #1 choice (up to 300+ utility/hr vs.
  // ~1 for rest) were still expiring unresolved because the target's
  // schedule had already been locked in before the request even existed.
  // Same escape-hatch pattern as the critical-need check above.
  if (world.helpRequests.some(r => r.targetId === npc.id && !r.resolved)) return true;
  return false;
}

// Which need (if any) does consuming one unit of `good` satisfy, and by
// how much? Derived entirely from GOODS' own nutrition/comfortValue
// fields — a new consumable good or a new need it satisfies is one edit
// to GOODS/this map, not a new branch in shadowPriceGood or getBufferTarget.
function goodConsumptionEffect(good) {
  const g = GOODS[good];
  if (!g) return null;
  if (g.nutrition > 0)    return { need: 'food',    amount: g.nutrition };
  if (g.comfortValue > 0) return { need: 'comfort', amount: g.comfortValue };
  return null;
}

// Is it worth keeping one more unit of `good` for personal consumption
// today, vs. selling it? Critical needs (food) always get their fixed
// daily intake reserve — see NEEDS.critical and getBufferTarget.
//
// For a DISCRETIONARY good (comfort, and any future non-critical need),
// the default is also to keep the reserve — comfort goods are meant to be
// enjoyed, not perpetually monetized. Comparing raw useValue against
// sellNow (price * lambda) directly doesn't work as an every-day gate:
// lambda's typical magnitude is dominated by food's much larger weight
// even when the NPC is perfectly well-fed, so that comparison would
// almost always favor selling regardless of actual hunger — silently
// collapsing the entire comfort-goods economy rather than fixing the
// starving-artisan case it was meant to target.
//
// So the reserve is only released when a CRITICAL need is genuinely in
// its own starvation-floor crisis right now — the direct generalization
// of the old single-purpose "if food is urgent, sell fine goods instead"
// override, except keyed off the NEEDS registry (any critical need, not
// just food) instead of a hardcoded threshold on one specific need.
function shouldKeepForConsumption(npc, good) {
  const effect = goodConsumptionEffect(good);
  if (!effect) return true;
  if (NEEDS[effect.need].critical) return true;

  for (const [need, cfg] of Object.entries(NEEDS)) {
    if (cfg.critical && cfg.starvationFloor > 0 && (npc.needs[need] ?? 0) < cfg.starvationFloor) {
      return false; // a critical need is in crisis — sell for cash instead of self-consuming
    }
  }
  return true;
}

// Some goods ease a need just by being held in reserve, independent of
// being consumed — a full larder eases anxiety about tomorrow before any
// of it is actually eaten. This is a STOCK effect (how many days' worth
// you have banked), distinct from goodConsumptionEffect's FLOW effect
// (what satisfies a need when you use one unit right now). Amount is
// expressed in "days of daily intake" so it composes with the same
// foodTarget/nutrition math satisfyNeeds already uses for the food need
// itself, rather than needing its own separate unit system. Adding
// another good/need pair here (e.g. stored wood easing security through a
// hard winter) is one line, same versatility principle as NEEDS/
// goodConsumptionEffect.
const BUFFER_STOCK_EFFECTS = {
  // daysForFullBenefit tested at 5 first: with ~48 NPCs simultaneously
  // chasing a 10-unit buffer of bread (which perishes at 15%/day), demand
  // overwhelmed supply and drove a village-wide price spiral (bread
  // roughly tripled, savings collapsed faster than the buffer effect
  // stabilized security) -- a classic "individually rational hoarding
  // becomes collectively self-defeating" dynamic. 2 days (4 units) still
  // gives the security benefit real weight without triggering that
  // spiral in testing; worth revisiting if the target profession mix or
  // bread supply changes.
  bread: { need: 'security', daysForFullBenefit: 2 },
};

// What fraction (0..1) of the "full benefit" buffer size does this NPC
// currently hold for `good`? Used both to actually grant the stock-based
// need benefit (satisfyNeeds) and to size how much of that buffer the NPC
// tries to keep on hand (getBufferTarget) — one number driving both the
// felt benefit and the purchasing target that pursues it.
function bufferStockRatio(npc, good) {
  const cfg = BUFFER_STOCK_EFFECTS[good];
  if (!cfg) return 0;
  const dailyTarget = 2 * GOODS[good].nutrition; // matches satisfyNeeds' daily food-intake target
  if (dailyTarget <= 0) return 0;
  const daysOnHand = ((npc.inventory[good] ?? 0) * GOODS[good].nutrition) / dailyTarget;
  return Math.min(daysOnHand / cfg.daysForFullBenefit, 1);
}

const SEASONAL_GRAIN = { spring:2.0, summer:2.0, autumn:2.0, winter:2.0 };
const LABOR_DISUTILITY = 4;
const WORK_SESSION_HOURS = 6; // mirrors buildDayCandidates' local WORK_DURATION — used by getAvailableActions (a different function/scope) for opportunity-cost calculations, e.g. help's forgone-labor term below.
// NAMES is intentionally a name-GENERATOR, not a fixed list. A fixed
// array works for a static population of 16, but breaks the moment
// anyone is born, immigrates, or otherwise joins after setup — you'd
// run out of names. generateName() combines a first + last syllable
// pool deterministically off the seeded RNG, so it scales to any future
// population size and stays reproducible run-to-run.
// NAMES: two-syllable combinations from a shared pool, deterministic off
// the seeded RNG. Founders get two random syllables. Children inherit —
// their name is a random combination of two of their four PARENTAL
// syllables (two from each parent), not a fresh random draw — so family
// names visibly echo across generations (a child might get one syllable
// from each parent, or both from one), without ever needing a fixed
// surname field.
const SYLLABLES = ['al','bram','cor','dun','ed','fenn','gun','hal','ing','jor',
                    'kel','lor','mar','nor','os','rag','sig','thal','ul','wyn',
                    'ber','col','dag','ew','fri','gund','helm','iv','ric','len',
                    'mag','nora','rid','sten','thor','vald','wren','yor','frey','holt'];

function combineSyllables(s1, s2) {
  return s1.charAt(0).toUpperCase() + s1.slice(1) + s2;
}

// Founders (no parents) — two random syllables from the shared pool.
function generateName(rng) {
  const s1 = rng.pick(SYLLABLES);
  let s2 = rng.pick(SYLLABLES);
  while (s2 === s1) s2 = rng.pick(SYLLABLES); // avoid degenerate self-combos like "Alal"
  return { name: combineSyllables(s1, s2), syllables: [s1, s2] };
}

// Children — two of the four syllables drawn from BOTH parents' names
// (2 each), picked at random without replacement. This is the actual
// mechanism requested: no fresh random draw from the full pool, just
// recombination of what the parents already carry.
function generateChildName(motherSyllables, fatherSyllables, rng) {
  const pool = [...(motherSyllables || SYLLABLES.slice(0,2)), ...(fatherSyllables || SYLLABLES.slice(0,2))];
  const i = rng.int(0, pool.length - 1);
  let j = rng.int(0, pool.length - 1);
  while (j === i) j = rng.int(0, pool.length - 1);
  return { name: combineSyllables(pool[i], pool[j]), syllables: [pool[i], pool[j]] };
}

// ─────────────────────────────────────────────
// SEEDED RNG
// ─────────────────────────────────────────────

class RNG {
  constructor(seed=42) { this.s = seed; }
  next() { this.s = (this.s * 1664525 + 1013904223) & 0xffffffff; return (this.s >>> 0) / 0xffffffff; }
  float(lo=0, hi=1) { return lo + this.next() * (hi - lo); }
  int(lo, hi) { return Math.floor(this.float(lo, hi+1)); }
  pick(arr) { return arr[this.int(0, arr.length-1)]; }
}
const rng = new RNG(42);

// ─────────────────────────────────────────────
// WORLD STATE
// ─────────────────────────────────────────────

// ── The Market institution ───────────────────────────────────────────────
// Replaces the old double-auction (buyOrders/sellOrders matched peer-to-
// peer) with a single counterparty: the Market itself. NPCs never trade
// with each other directly. The Market posts a bid (what it pays sellers)
// and an ask (what it charges buyers) for every good, and those posted
// prices move based on the Market's own inventory relative to a target
// stock level — the classic inventory-based market-maker model. Glut
// (stock above target) pushes prices down; scarcity (stock below target)
// pushes prices up. The gap between bid and ask (the spread) is the
// institution's own margin — future gameplay can expose this as taxable
// revenue, a thing the player can subsidize, corner, or regulate.
//
// The Market also has finite storage capacity (can refuse to buy more of
// a glutted good) and a finite cash reserve (can run low on coin and be
// unable to pay sellers). Neither constraint is calibrated to bind often
// in Phase 1 — they exist so later institutional-power mechanics have
// something real to grab onto (recapitalize the Market, expand the
// granary, etc.), not to create scarcity puzzles right now.
// POPULATION is the single source of truth for starting village size.
// Everything below derives from it (spawn count, market stock targets,
// etc.), so changing this one number doesn't require hunting down
// hardcoded values elsewhere. Defined early since world's market init
// now depends on it too.
const POPULATION = 48;
// DAILY_CONSUMPTION_PER_CAPITA: real per-capita daily demand for each
// good, derived directly from the actual consumption logic elsewhere in
// the code (not guessed):
//   grain — up to 2 units/day per NPC as a food fallback (satisfyNeeds'
//     foodTarget=2), though most of that is normally bread; grain is
//     also a work INPUT for millers (4/day) and artisans (2/day), so we
//     budget generously since it's both food and industrial input.
//   bread — the primary food good; foodTarget=2 units/day at full
//     nutrition (0.5), so ~2 units/day/capita covers a fully-fed diet.
//   wood — satisfyNeeds burns 0.5/day baseline, 1.0/day in winter
//     (worst case used here), plus it's a work input for toolmakers
//     (2/day) and artisans (3/day) — budgeted for the residential burn
//     rate, since industrial demand is a much smaller number of
//     asset-owners, not the whole population.
//   tools — a capital good bought occasionally, not consumed daily;
//     budgeted low per-capita since only asset-owning workers actually
//     need to hold any.
//   luxury — a comfort-need good, occasional purchase, budgeted low.
// TARGET_STOCK_BUFFER: the market keeps this many days' worth of
// village-wide consumption in reserve, so ordinary daily demand swings
// don't push stock anywhere near zero (which is what was driving both
// chronic stockouts AND the price volatility that comes from stock
// hovering near the danger zone).
const DAILY_CONSUMPTION_PER_CAPITA = {
  grain: 1.0, bread: 2.0, wood: 0.6, tools: 0.15, luxury: 0.2,
};
const TARGET_STOCK_BUFFER = 2; // days of full village-wide demand held in reserve

function buildMarketGoods(population) {
  const mk = (good, spread) => {
    const targetStock = DAILY_CONSUMPTION_PER_CAPITA[good] * population * TARGET_STOCK_BUFFER;
    const capacity = targetStock * 3.5; // headroom above target, same ratio the old flat values used
    return makeMarketGood(GOODS[good].baseValue, targetStock, capacity, spread);
  };
  return {
    grain:  mk('grain',  0.14),
    bread:  mk('bread',  0.16),
    wood:   mk('wood',   0.18),
    tools:  mk('tools',  0.22),
    luxury: mk('luxury', 0.25),
  };
}

function makeMarketGood(baseValue, targetStock, capacity, spread) {
  return {
    stock: targetStock,
    targetStock,
    targetStockMin: targetStock * 0.4,      // adaptive floor
    // Adaptive ceiling capped at 2x base (was 4x). At 4x, a good with
    // chronic real shortage (see bread, whose target ratcheted up via
    // repeated shortageStreak triggers) could balloon to a buffer far
    // beyond any real village's storage horizon — bread's target hit 768
    // units for a ~30-person village, over a YEAR of consumption. Filling
    // that buffer took so long that by the time it was "full" and price
    // crashed back to baseline (killing the milling incentive), the
    // underlying grain shortage hadn't actually stabilized — creating a
    // boom-bust cycle where production collapsed right as the next
    // shortage was about to hit. A tighter ceiling means price recovers
    // to a shortage signal faster and holds it longer relative to actual
    // production capacity, instead of one enormous slow-building buffer
    // that masks the recurring underlying imbalance for months at a time.
    targetStockMax: targetStock * 2,        // adaptive ceiling
    capacityRatio: capacity / targetStock,  // capacity always scales with target
    capacity,
    // Fully capitalized from day one. Previously this equaled the dividend
    // reserve threshold in distributeMarketDividends() exactly (also ×4),

    // way past its own floor via trade spread before a single dividend
    // ever paid out — a slow, compounding drain on villager savings over
    // thousands of days. Starting well above reserve means dividends can
    // flow from day one instead of needing a long one-way accumulation
    // period first.
    cash: targetStock * baseValue * 8,
    midPrice: baseValue,
    bidPrice: baseValue * (1 - spread/2),
    askPrice: baseValue * (1 + spread/2),
    spread,
    priceHistory: [],       // {price, season} — the Market's own posted midPrice over time
    unmetSupply: 0,         // NPCs who wanted to sell but Market wouldn't/couldn't buy
    unmetDemand: 0,         // NPCs who wanted to buy but Market wouldn't/couldn't sell
    shortageStreak: 0,      // consecutive days with real unmet demand
    glutStreak: 0,          // consecutive days with real unmet supply
  };
}

// ─────────────────────────────────────────────
// RELATIONS — devotion (+) / odium (-) between specific NPCs.
// ─────────────────────────────────────────────
// Asymmetric by design: A's record of B is independent of B's record of
// A (unrequited loyalty, one-sided grudges are real things). Lazily
// created on first contact rather than pre-seeded for the whole village.
const RELATION_DECAY_BASE = 0.01; // per-day pull toward neutral (0)
// familiarity gates decay: a well-known relationship (spouse, longtime
// trade partner) is sticky; a barely-known contact drifts back to
// indifference quickly if not reinforced. decayRate = BASE * (1 - familiarity*0.9)
// so familiarity=1 relationships decay at 10% of the base rate.

function getRelation(npc, targetId) {
  return npc.relations.get(targetId) || null;
}

function getAffinity(npc, targetId) {
  return npc.relations.get(targetId)?.affinity ?? 0;
}

// The single write-path for any relationship change. `delta` is signed
// (+devotion, -odium). Familiarity ticks up a little on every event
// (contact itself builds familiarity, independent of whether the event
// was good or bad) and eases toward 1 with repeated contact, uses
// diminishing returns so a single dramatic event can't instantly
// manufacture a decades-deep bond.
function bumpAffinity(npc, targetId, delta) {
  if (targetId === npc.id) return; // no self-relations
  let rec = npc.relations.get(targetId);
  if (!rec) {
    rec = { affinity: 0, familiarity: 0, lastEventDay: world.day };
    npc.relations.set(targetId, rec);
  }
  rec.affinity = clamp(rec.affinity + delta, -1, 1);
  rec.familiarity = clamp(rec.familiarity + (1 - rec.familiarity) * 0.15, 0, 1);
  rec.lastEventDay = world.day;
}

// Called once/day per NPC (see tickRelationDecay) — pulls every known
// relation gently back toward neutral, slower the more familiar it is.
function decayRelations(npc) {
  for (const rec of npc.relations.values()) {
    const decayRate = RELATION_DECAY_BASE * (1 - rec.familiarity * 0.9);
    rec.affinity *= (1 - decayRate);
  }
}

function tickRelationDecay() {
  for (const npc of world.npcs.values()) decayRelations(npc);
}

// Kinship seeding: parent/child and spousal bonds start with a floor of
// mutual affinity rather than the usual blank slate — this reuses the
// lineage/spouse data the inheritance and marriage systems already
// track, rather than inventing new bookkeeping. Structural bonds like
// this are also exempted from ever decaying below the floor (see the
// floor re-application in tickRelationDecay callers where relevant).
const KINSHIP_AFFINITY_FLOOR = 0.5;
function seedKinshipAffinity(aId, bId) {
  const a = world.npcs.get(aId), b = world.npcs.get(bId);
  if (!a || !b) return;
  for (const [x, y] of [[a, bId], [b, aId]]) {
    let rec = x.relations.get(y);
    if (!rec) { rec = { affinity: 0, familiarity: 0.3, lastEventDay: world.day }; x.relations.set(y, rec); }
    rec.affinity = Math.max(rec.affinity, KINSHIP_AFFINITY_FLOOR);
    rec.familiarity = Math.max(rec.familiarity, 0.3);
  }
}

// buildProfDist(n) generates a starting profession distribution that
// keeps the SAME ratios as the original hand-tuned 16-NPC village
// (37.5% farmer-or-flex, ~19% woodcutter, ~12.5% miller, ~6% toolmaker,
// remainder flex-farmers) but scaled proportionally to any population
// size. This keeps the initial economy shape consistent even as we
// change POPULATION, and is itself a template for how a future
// immigration event could pick a newcomer's starting profession
// (weighted by current village composition/need rather than fixed ratios).
function buildProfDist(n) {
  // Miller share raised 2/16->4/16 (farmer/woodcutter trimmed to 4/16
  // each to compensate). This is the actual root cause behind the
  // starvation crisis, found by tracing individual switch decisions:
  // every farmer who "defected" to woodcutting did so already at
  // food~0.00-0.14 (using the starvation tenure-lock bypass), not from a
  // rational EV comparison — and bread stock was hitting genuine zero by
  // day 4, with 54-72 units/day of unmet demand, WHILE all 6 starting
  // millers were still on the job. The math never closed: 6 millers x 12
  // bread/session = 72 bread/day maximum possible output, against ~96
  // bread/day needed for 48 people at 2 units/person. No amount of
  // pricing, switching-resistance, or housing fixes can close an actual
  // production-capacity shortfall — the village was structurally
  // guaranteed to starve from day 1 regardless of anything else. The
  // wood-price blip and the farmer exodus were real, but downstream
  // symptoms of this deeper arithmetic problem, not the root cause.
  const ratios = [
    ['farmer',      4/16],
    ['woodcutter',  4/16],
    ['miller',      4/16],
    ['toolmaker',   1/16],
  ];
  const dist = [];
  for (const [prof, ratio] of ratios) {
    const count = Math.round(n * ratio);
    for (let i = 0; i < count; i++) dist.push(prof);
  }
  // Remainder (the old "4 flex" slots) fills out to exactly n, always as
  // flex-farmers, same as the original village.
  while (dist.length < n) dist.push('farmer');
  return dist.slice(0, n);
}

// spawnNPC centralizes NPC creation + placement + world registration into
// one call, so a future birth/immigration event can reuse it directly

function spawnNPC(prof) {
  const id = nextNpcId; // peek — makeNPC() will actually increment it
  const angle = (id / POPULATION) * Math.PI * 2;
  const r = 220 + rng.float(-40, 40); // widened from 130 to fit 3x the NPCs without overlap
  const x = 380 + Math.cos(angle) * r;
  const y = 280 + Math.sin(angle) * r;
  const npc = makeNPC(prof, x, y);
  npc.homeX = x; npc.homeY = y;
  // Founding villagers start as established young adults, not newborns —
  // spread across a range so old-age deaths (see tickAgingAndDeaths)
  // don't all land in the same narrow window later. Kept well below the
  // 10-12 dog-year lifespan (not 3-8, which left almost no runway before
  // the whole founding generation died of old age at once — verified via
  // harness: population collapsed 48->2 in 800 days, driven mostly by a
  // synchronized old-age die-off, not starvation).
  npc.age = rng.float(1, 5) * DOG_YEAR_DAYS;
  world.npcs.set(npc.id, npc);
  return npc;
}

// ─────────────────────────────────────────────
// SHADOW PRICE SYSTEM  ← the core decision math
// ─────────────────────────────────────────────

// The Market posts its prices openly — there's no need for NPCs to
// estimate a price from noisy trade history anymore. expectedPrice()
// returns the Market's current midpoint, used everywhere valuation needs
// a single blended number (shadow pricing, EV estimates, forecasting).
// Where an NPC is about to actually transact, use marketAsk()/marketBid()
// instead — those are the real prices they'll pay or receive.
function expectedPrice(npc, good) {
  return world.market.goods[good]?.midPrice ?? GOODS[good].baseValue;
}

// What an NPC actually pays to buy one unit from the Market right now.
function marketAsk(good) {
  return world.market.goods[good]?.askPrice ?? GOODS[good].baseValue;
}

// What an NPC actually receives selling one unit to the Market right now.
function marketBid(good) {
  return world.market.goods[good]?.bidPrice ?? GOODS[good].baseValue;
}

// ── Seasonal price forecast ────────────────────────────────────────────────
// Returns the NPC's best estimate of what `good` will cost in `targetSeason`,
// based purely on their observed price history. No hardcoded calendar.
//
// Epistemically honest: an NPC who hasn't observed a full year has sparse or
// no data for seasons they haven't lived through yet, and falls back to the
// current expected price (no forecast premium). This means year-1 NPCs under-
// warehouse slightly — they learn to warehouse better after surviving winter.
function expectedSeasonalPrice(npc, good, targetSeason) {
  const unwrap = e => (typeof e === 'object' ? e.price : e);
  // The Market's posted price history is public — every NPC sees the same
  // record, so there's no need to blend in a separate personal memory of
  // prices the way the old peer-to-peer market required. (npc.memory.
  // priceHistory is still populated, kept for future info-access mechanics
  // — e.g. literacy or distance from the Market gating who gets timely
  // price news — but it currently just mirrors the public record.)
  const all = world.market.goods[good]?.priceHistory ?? [];

  const seasonal = all.filter(e => (typeof e === 'object' ? e.season : null) === targetSeason);
  if (seasonal.length < 3) {
    // Insufficient seasonal data — fall back to current expectation.
    // The NPC has no basis to forecast a premium yet.
    return expectedPrice(npc, good);
  }
  // Simple average of observed prices in the target season.
  return seasonal.reduce((s, e) => s + unwrap(e), 0) / seasonal.length;
}

// ── Seasons in order, used to determine what season is N days ahead ────────
const SEASON_ORDER = ['spring', 'summer', 'autumn', 'winter'];

function seasonNDaysAhead(daysAhead) {
  const dayOfYear = (world.day + daysAhead) % 360;
  return SEASON_ORDER[Math.floor(dayOfYear / 90)];
}

// ── Speculative carry value ────────────────────────────────────────────────
// Net present value of holding one additional unit of a storable good for
// resale, accounting for perish losses and time discounting.
//
//   carryValue = expectedFuturePrice × survivalRate^daysToSell - currentPrice
//
// If positive, holding an extra unit is worth more than selling today.
// The NPC's buffer target is implicitly the quantity where marginal carry
// value equals zero — implemented by having runMarketExchange sell above buffer
// and buy below it, with the buffer set to the carry-positive quantity.
//
// daysToSell: rough estimate of how long until the NPC expects to sell.
// We use the midpoint of the expected high-price season (90 days away at most).
function speculativeCarryValue(npc, good) {
  const g = GOODS[good];
  if (g.perishRate >= 0.5) return 0; // too perishable to warehouse profitably
  if (g.perishRate === 0 && g.nutrition === 0) return 0; // tools: handled separately

  const currentP = expectedPrice(npc, good);

  // Find the highest-price season the NPC knows about
  let bestSeasonPrice = currentP;
  let bestDays = 0;
  for (const season of SEASON_ORDER) {
    if (season === world.season) continue;
    const forecast = expectedSeasonalPrice(npc, good, season);
    if (forecast > bestSeasonPrice) {
      bestSeasonPrice = forecast;
      // Rough days until middle of that season
      const targetIdx = SEASON_ORDER.indexOf(season);
      const currentIdx = SEASON_ORDER.indexOf(world.season);
      const seasonsAway = ((targetIdx - currentIdx + 4) % 4);
      bestDays = seasonsAway * 90 + 45; // midpoint of that season
    }
  }

  if (bestDays === 0) return 0; // no better season found

  const survivalRate  = Math.pow(1 - g.perishRate, bestDays);
  const futureValue   = bestSeasonPrice * survivalRate;
  const discRate      = discountRate(npc);
  const discountFactor = Math.pow(1 - discRate, bestDays);
  const presentValue  = futureValue * discountFactor;

  return presentValue - currentP;
}

// Shadow price of a unit of a good in utility terms.
// This is the consumption/resale value only — productive value of inputs
// is handled separately in workSessionEV and flows through Pass 1 of the
// scheduler. Keeping these separate eliminates the double-count that caused
// "buy grain" to crowd out work itself.
function shadowPriceGood(npc, good) {
  const g = GOODS[good];
  const lam = lambda(npc);
  const marketPrice = expectedPrice(npc, good);
  const prof = PROFESSIONS[npc.profession];

  // Speculative carry: if future expected price exceeds current price (net of
  // perish losses and time discounting), holding an extra unit is worth more
  // than selling today. This is what drives seasonal warehousing without any
  // hardcoded calendar schedule. A summer NPC values grain at its expected
  // winter resale price, not today's cheap summer price -- automatically.
  // Only applied when the NPC has savings headroom to actually warehouse.
  const carry = speculativeCarryValue(npc, good);
  const SAVINGS_RESERVE = 5;
  const canSpeculate = npc.savings > SAVINGS_RESERVE * 3;
  const sellNow   = marketPrice * lam;
  const sellLater = canSpeculate ? (marketPrice + carry) * lam : 0;

  // ── Capital goods: value from future productivity boost ───────────────
  if (good === 'tools') {
    if (!prof?.capitalGood || prof.capitalGood !== 'tools') return Math.max(sellNow, sellLater);
    const currentBoost     = 1 + Math.log1p(npc.inventory.tools ?? 0) * 0.2;
    const newBoost         = 1 + Math.log1p((npc.inventory.tools ?? 0) + 1) * 0.2;
    const productivityGain = newBoost - currentBoost;
    const outputGood       = Object.keys(prof.outputs)[0];
    const dailyGain        = prof.outputs[outputGood] * productivityGain * expectedPrice(npc, outputGood) * lam;
    const discRate         = discountRate(npc);
    const pv = dailyGain * (1 - Math.pow(1 - discRate, 120)) / discRate;
    return Math.max(pv, sellNow, sellLater);
  }

  // ── Any good that satisfies a need when consumed (food, comfort, or
  // whatever future need/good gets registered) ──────────────────────────
  // This single generic branch replaces what used to be separate,
  // near-duplicate "food goods" and "comfort goods" branches. Value is the
  // highest of: using it, selling now, or holding for a better season.
  // needMarginalUtility already spikes once the relevant need crosses its
  // own starvationFloor, and — for CRITICAL needs like food — that spike
  // also drives lambda up (see lambda() below), which raises sellNow for
  // every OTHER discretionary good at the same time. That's what makes a
  // starving artisan correctly prefer selling fine goods over self-
  // comforting: no hardcoded "if food urgent, override comfort" branch is
  // needed here anymore — it falls out of the same shadow-price math every
  // other good uses.
  const effect = goodConsumptionEffect(good);
  if (effect) {
    const useValue = needMarginalUtility(npc, effect.need) * effect.amount;
    return Math.max(useValue, sellNow, sellLater);
  }

  // ── Default: monetary resale value, plus carry for non-perishable storables ──
  // Wood has zero perishRate so carry value can be substantial in summer.
  return Math.max(sellNow, sellLater);
}

// Marginal utility of money for this NPC right now. This is the single
// bridge between every instrumental resource and terminal need
// satisfaction — every other shadow price ultimately routes through here.
function lambda(npc) {
  // Use base values as a price floor when computing lambda.
  // Without this, stale near-zero prices cause lambda → ∞,
  // which inflates rest scores and collapses all economic activity.
  //
  // IMPORTANT: floors are anchored to marketAsk (the real price an NPC
  // pays to buy), not expectedPrice/midPrice. Using the mid-price here
  // was a structural bug: it calibrated "the cost of satisfying hunger"
  // below what bread actually costs to buy (ask is always ≥ mid, by
  // definition of the spread), so shadowPriceGood's useValue-vs-askPrice
  // comparison in planMarketVisit failed almost every time, by roughly
  // the spread's width — regardless of the stock-availability fix above.
  // Verified via harness trace: a stock-aware lambda alone made this
  // WORSE (500-day population dropped from 42 to 22) because grain's
  // stale, fictitiously-low mid-price used to accidentally inflate lambda
  // enough to paper over the mid/ask gap; fixing stock-awareness removed
  // that lucky accident and exposed the real defect underneath it.
  const grainFloor = Math.max(marketAsk('grain'), GOODS.grain.baseValue * 0.25);
  const breadFloor = Math.max(marketAsk('bread'), GOODS.bread.baseValue * 0.25);

  // Only treat a food good as part of "cheapest available food" if the
  // Market actually has stock of it right now. Previously this always
  // considered grain's price even when grain stock was 0 — a purely
  // theoretical price for food that couldn't actually be bought. That
  // understated the true cost of satisfying hunger whenever the cheap
  // option was out of stock, which in turn made the *real* available
  // option (bread) fail its own cost-clearing test in planMarketVisit by
  // a narrow margin, even for a starving NPC with money in hand — verified
  // via harness trace (Bram: food=0.075, bread in stock, bread shadow
  // value 122.5 vs. required 132.3, entirely because lambda was still
  // discounting against unavailable grain). If NOTHING is in stock, fall
  // back to the old theoretical floor rather than let lambda blow up —
  // a genuine full stockout should read as scarcity (see the stockout
  // finding from the market-visit fix), not an infinite money-value spike.
  const grainInStock = (world.market.goods.grain?.stock ?? 0) >= 0.5;
  const breadInStock = (world.market.goods.bread?.stock ?? 0) >= 0.5;
  let cheapestFoodPrice;
  if (grainInStock || breadInStock) {
    cheapestFoodPrice = Math.min(
      grainInStock ? grainFloor / GOODS.grain.nutrition : Infinity,
      breadInStock ? breadFloor / GOODS.bread.nutrition : Infinity
    );
  } else {
    cheapestFoodPrice = Math.min(
      grainFloor / GOODS.grain.nutrition,
      breadFloor / GOODS.bread.nutrition
    );
  }

  const foodMU = needMarginalUtility(npc, 'food');
  let lam = foodMU / cheapestFoodPrice;

  // Via security: savings buffer
  const secMU = needMarginalUtility(npc, 'security');
  lam += secMU / 30;

  // Hard cap: lambda can't exceed foodMU / (baseValue floor), preventing
  // runaway rest scores when prices temporarily collapse. This stays
  // pinned to the fixed theoretical floor (not the stock-aware
  // cheapestFoodPrice above) deliberately — it's an absolute ceiling
  // independent of current market conditions, so a stockout or price
  // spike can't also loosen the cap that's supposed to contain it. Scales
  // with foodMU itself, so the cap rises proportionally during a food
  // crisis rather than clipping the very spike that's supposed to
  // reorder priorities.
  const lamCap = foodMU / (GOODS.grain.baseValue * 0.25 / GOODS.grain.nutrition);
  return Math.min(Math.max(lam, 0.01), lamCap);
}

// NPC's time preference — higher when desperate
function discountRate(npc) {
  return 0.005 + (1 - npc.needs.food) * 0.04;
}

// Score an action in utility/hour
function scoreAction(action, npc) {
  const lam = lambda(npc);

  // Some actions (asset sale listing, tinkering) carry their own
  // pre-computed NPV-based utility rather than decomposing into the
  // generic need/goods/money terms below — those actions set
  // _scoreOverride at construction time (see planAssetSaleActions,
  // planTinkerAction) since their value comes from a discounted future
  // payoff, not an immediate need/goods/money flow this function tracks.
  if (typeof action._scoreOverride === 'number') {
    return action._scoreOverride / action.duration;
  }

  let score = 0;

  // Need satisfaction effects — routed through the single generic
  // needMarginalUtility function so every need (existing or newly added
  // to the NEEDS registry) is weighed the same way, including the
  // starvation-cliff spike for critical needs.
  if (action.needEffects) {
    for (const [need, amount] of Object.entries(action.needEffects)) {
      score += needMarginalUtility(npc, need) * amount;
    }
  }

  // Goods produced
  if (action.goodsProduced) {
    for (const [good, qty] of Object.entries(action.goodsProduced)) {
      score += shadowPriceGood(npc, good) * qty;
    }
  }

  // Goods consumed (cost)
  // For sale actions, skip shadow-price deduction — the revenue is already
  // captured in moneyEarned. Deducting shadow price too would double-penalise
  // selling, especially for millers whose grain has high productive shadow price.
  if (action.goodsConsumed && !action.isSale) {
    for (const [good, qty] of Object.entries(action.goodsConsumed)) {
      score -= shadowPriceGood(npc, good) * qty;
    }
  }

  // Money flows
  if (action.moneyEarned)  score += action.moneyEarned * lam;
  if (action.moneyCost)    score -= action.moneyCost * lam;

  // Effect on a THIRD PARTY, discounted by affinity toward them — the one
  // new term relational mechanics needed. `help` gives money outright
  // (simplest first-pass model — cash is fungible and the recipient can
  // buy whatever they actually need at market themselves, so this
  // doesn't require modeling in-kind good transfer). Valued through the
  // RECIPIENT's own lambda — the same food/security-desperation-aware
  // marginal-utility-of-money function used everywhere else — multiplied
  // by the giver's affinity toward them. Positive affinity makes helping
  // a desperate friend score real value; zero or negative affinity makes
  // it score near-zero or negative even for a friend in genuine need — no
  // separate "would I help this person" branch required, it falls out of
  // this one multiplicative term same as every other action here.
  if (action.affinityTarget) {
    const { npcId, moneyGift } = action.affinityTarget;
    const target = world.npcs.get(npcId);
    if (target) {
      score += getAffinity(npc, npcId) * lambda(target) * moneyGift;
    }
  }

  // Explicit opportunity cost (see 'help' in getAvailableActions) —
  // already in the same utility-scaled units profSessionEV produces, so
  // this is a direct subtraction, not something requiring its own
  // lambda conversion.
  if (action.opportunityCost) score -= action.opportunityCost;

  // Energy cost/restore: fixed utility shadow, NOT tied to lambda.
  // Coupling to lambda causes rest to score infinitely high when prices
  // collapse (lambda → ∞), which locks everyone into permanent rest.
  // A point of energy is worth ~0.05 utility regardless of market prices —
  // calibrated so a well-fed NPC with average wages works ~8 hrs/day.
  const ENERGY_SHADOW = 0.05;
  if (action.energyCost)    score -= action.energyCost    * ENERGY_SHADOW;
  if (action.energyRestored) score += action.energyRestored * ENERGY_SHADOW;

  // Labor disutility
  if (action.isLabor) score -= LABOR_DISUTILITY * action.duration;

  // Generic flat utility cost, pre-scaled by the caller (e.g. duration).
  // Used for activities that cost effort but aren't full manual labor —
  // a market visit is tiring in a different, lighter way than farm work.
  if (action.disutility) score -= action.disutility;

  return score / action.duration; // utility per hour
}

// ─────────────────────────────────────────────
// WORK SESSION VALUATION
// ─────────────────────────────────────────────

// Net utility of committing to one full work session (6 hrs).
// Accounts for revenue, input costs (buying if necessary), energy,
// and labour disutility. This is the true incentive signal:
//   high output price  → high EV → NPC works more
//   high input price   → low EV  → NPC works less or switches profession
//   high lambda        → high EV → desperate NPC works even at low wages
//   low lambda         → low EV  → comfortable NPC takes leisure instead
// Compute EV of one work session for a given profId, given this NPC's state.
// A trailing average of recent midPrice history, NOT today's snapshot.
// Used specifically for profSessionEV's REVENUE projection (see below) —
// a profession switch is a long-term commitment (year-long tenure lock),
// so it should be evaluated against a price TREND, not whatever the spot
// price happens to read on the one day the decision is made. Input costs
// still use marketAsk (the real price paid right now) unchanged — that
// asymmetry is deliberate: you pay today's real price for materials, but
// shouldn't assume today's possibly-transient output price holds for a
// whole session's worth of future work. Verified via harness: even after
// fixing the false-homelessness construction bug, a purely transient
// ~10-day market-settling wood price blip (unrelated to any real,
// sustained demand) was still enough to push farmer count from 24 to 9
// within 40 days, because profSessionEV compared today's spot wood price
// against grain's, with nothing to distinguish a blip from a trend.
function smoothedExpectedPrice(npc, good, days = 10) {
  const hist = world.market.goods[good]?.priceHistory;
  if (!hist || hist.length === 0) return expectedPrice(npc, good);
  const recent = hist.slice(-days);
  return recent.reduce((s, h) => s + h.price, 0) / recent.length;
}

function profSessionEV(npc, profId, ignoreAssetGate) {
  const prof = PROFESSIONS[profId];
  if (!prof) return -Infinity;
  if (!ignoreAssetGate && !hasWorkableAsset(npc, profId)) return -Infinity;
  if (npc.energy < 20) return -Infinity;

  const lam      = lambda(npc);
  const skill    = effectiveSkill(npc, profId);
  const capMod   = prof.capitalGood ? (1 + Math.log1p(npc.inventory.tools ?? 0) * 0.2) : 1;
  const buildMod = buildingProductivity(profId);
  const seasonal = profId === 'farmer' ? (SEASONAL_GRAIN[world.season] || 1) : 1;
  const ENERGY_SHADOW = 0.05;

  let revenue = 0;
  for (const [g, qty] of Object.entries(prof.outputs)) {
    revenue += qty * skill * capMod * buildMod * seasonal * smoothedExpectedPrice(npc, g);
  }

  let inputCashCost = 0;
  for (const [g, qty] of Object.entries(prof.inputs)) {
    const shortfall = Math.max(0, qty - (npc.inventory[g] ?? 0));
    inputCashCost += shortfall * marketAsk(g);
  }

  if (inputCashCost > npc.savings + 0.01) return -Infinity;

  const netCoins = revenue - inputCashCost;
  return netCoins * lam - 25 * ENERGY_SHADOW - LABOR_DISUTILITY * 6;
}

// workSessionEV: returns { ev, profId } for the best available work today.
// Tries the NPC's primary profession first. If that's blocked (inputs
// unaffordable), falls back to no-input professions (farmer, woodcutter).
// A broke miller doesn't rest — they help with the harvest until they can
// afford grain again. The NPC keeps their profession identity; this is
// casual day-labour, not a switch.

// ─────────────────────────────────────────────
// LABOR MARKET — hired labor at owned assets
// ─────────────────────────────────────────────
//
// An asset owner with spare capacity (their farm/mill/forge/workshop can
// support more than one worker, per ASSET_TYPES' capacity field) can hire
// someone else to work it. This is the missing piece that lets a
// struggling or absent owner still extract value from an asset instead of
// their only options being "grind it out alone" or "abandon it entirely"
// — directly targeting the one-way collapse into woodcutting observed in
// testing, where asset professions had no recovery path once an owner
// faltered.
//
// Mechanics, kept deliberately simple for a first pass:
//   - Each day, every asset owner with spare capacity posts a wage offer
//     equal to a fraction of the marginal output value an additional
//     worker would generate (owner keeps the surplus as their profit —
//     the classic capital/labor split).
//   - Any NPC without a workable primary asset of their own (today, this
//     is effectively "woodcutters and other unemployed/asset-less NPCs")
//     compares the best available wage offer against their own best
//     self-employment EV (workSessionEV) and takes whichever pays more.
//   - Hired labor produces at the LABORER's own skill level, but goods
//     accrue to the EMPLOYER's inventory (the employer owns the output,
//     same as any real employment relationship) — and the employer pays
//     the wage immediately from savings, whether or not they've sold
//     that output yet (a short-term cash outlay against future revenue,
//     which is exactly what real capital owners do).

const LABOR_WAGE_SHARE = 0.55; // laborer's cut of marginal output value; owner keeps the rest as profit

// Marginal output value of adding ONE more worker at this asset, using
// the OWNER's context for pricing (expectedPrice etc. are npc-specific
// memory, but using the owner's is a reasonable proxy for "what this
// asset's output is worth to sell").
function marginalHireValue(owner, asset) {
  const profId = ASSET_TYPES[asset.type].profession;
  const prof = PROFESSIONS[profId];
  if (!prof) return 0;
  // Assume a competent hire (steady-state skill) for the wage-setting
  // calculation — the owner doesn't know the specific hire's skill yet
  // when deciding what to offer.
  const assumedSkill = 0.8;
